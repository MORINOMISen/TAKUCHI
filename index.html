<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>宅建 短期攻略 一問一答</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:760px;margin:auto;min-height:100dvh;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:6px 0 4px} h2{margin:4px 0 10px}
.sub{font-size:13px;color:#687386;line-height:1.6}
.banner{background:#fff8dd;border:1px solid #f0dd9a;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.65}
.card{background:#fff;border:1px solid #dce3ed;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 3px 12px rgba(20,35,60,.05)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.subjectGrid{display:grid;gap:13px;margin-top:16px}
.subject{text-align:left;background:#fff;border:1px solid #dce3ed;border-radius:18px;padding:18px;min-height:112px;box-shadow:0 3px 12px rgba(20,35,60,.05)}
.subject .num{font-size:12px;color:#2457d6;font-weight:800} .subject .name{font-size:22px;font-weight:850;margin-top:3px}
.subject small{display:block;color:#687386;font-size:12px;margin-top:8px;line-height:1.5}
.topic{text-align:left;background:#fff;border:1px solid #dce3ed;border-radius:15px;padding:13px;min-height:82px;font-weight:800}
.topic.core{background:#fff8dd;border-color:#e7ce73}
.topic small{display:block;color:#687386;font-size:11px;font-weight:500;margin-top:5px}
.done{color:#16813c!important;font-weight:800!important}
button{font:inherit;font-weight:750;border:0;border-radius:14px;min-height:48px;padding:11px 14px}
.primary{background:#2457d6;color:#fff} .soft{background:#eaf0fc;color:#214785} .danger{background:#fff0f0;color:#9b2525}
.row{display:flex;gap:9px;flex-wrap:wrap}
label{display:block;font-size:13px;font-weight:750;margin:12px 0 6px}
select,input{width:100%;font-size:16px;padding:13px;border:1px solid #bec8d6;border-radius:12px;background:#fff}
.hidden{display:none!important}
.meta{display:flex;gap:7px;flex-wrap:wrap} .pill{font-size:12px;background:#eef2f7;padding:5px 8px;border-radius:999px}
.stats{display:flex;justify-content:space-between;font-size:13px;color:#687386;margin-top:10px}
.progress{height:8px;background:#e7ebf1;border-radius:999px;overflow:hidden;margin-top:10px} #bar{height:100%;background:#2457d6}
#question{font-size:22px;line-height:1.65;font-weight:800;margin:18px 0 132px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(244,247,251,.95);border-top:1px solid #dce3ed;z-index:10}
.dockin{max-width:732px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{min-height:68px;font-size:28px;border:2px solid} .yes{background:#effaf3;color:#146b38;border-color:#9ad2ae} .no{background:#fff2f2;color:#922020;border-color:#e5a2a2}
.result{display:none;margin-top:12px;border-radius:14px;padding:14px;line-height:1.65}
.result.ok{display:block;background:#effaf3;border:1px solid #9ad2ae} .result.ng{display:block;background:#fff2f2;border:1px solid #e5a2a2}
.actions{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px} .actions.show{display:grid}
.breadcrumb{font-size:12px;color:#687386;margin-bottom:8px}
.note{font-size:12px;color:#687386;line-height:1.6;margin:8px 0 0}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <h1>宅建 短期攻略 一問一答</h1>
  <div class="sub">「本試験で判断するための基本知識」を優先。単純な言い換え反復をやめた短期攻略版です。</div>
  <div class="banner"><b>令和8年度（2026年度）対策</b><br>
  ①同じ周回では同じ問題を二度出しません。<br>
  ②間違いはその場で再出題せず「誤答だけ復習」に保存します。<br>
  ③権利関係にはまず「★最優先30問」を用意しています。</div>

  <section id="subjectHome" class="card">
    <h2>1. 分野を選択</h2>
    <div class="subjectGrid">
      <button class="subject" onclick="openSubject('宅建業法')"><div class="num">1</div><div class="name">宅建業法</div><small>11分野・165問</small></button>
      <button class="subject" onclick="openSubject('権利関係')"><div class="num">2</div><div class="name">権利関係</div><small>最優先30問＋18分野・合計210問</small></button>
      <button class="subject" onclick="openSubject('法令上の制限')"><div class="num">3</div><div class="name">法令上の制限</div><small>7分野・70問</small></button>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="soft" onclick="showSettings()">共通設定</button>
      <button class="danger" onclick="resetAll()">全進捗リセット</button>
    </div>
  </section>

  <section id="topicHome" class="card hidden">
    <div class="breadcrumb" id="crumb"></div>
    <h2 id="subjectTitle"></h2>
    <div id="subjectNote" class="note"></div>
    <div id="topicGrid" class="grid"></div>
    <div class="row" style="margin-top:14px"><button class="soft" onclick="backSubjects()">← 3分野へ戻る</button></div>
  </section>

  <section id="settings" class="card hidden">
    <h2>共通設定</h2>
    <label>問題順</label><select id="order"><option value="random">ランダム</option><option value="id">問題番号順</option></select>
    <label>宅建解説チャットURL</label><input id="chatUrl" placeholder="固定で使うChatGPTチャットURL">
    <div class="row" style="margin-top:14px"><button class="primary" onclick="saveSettings()">保存して戻る</button></div>
  </section>

  <section id="topicMenu" class="card hidden">
    <div class="breadcrumb" id="topicCrumb"></div><h2 id="topicTitle"></h2>
    <p class="note">この周回では同じ問題は繰り返しません。間違えた問題は誤答履歴に保存されます。</p>
    <div class="row"><button class="primary" onclick="start(false)">開始</button><button class="soft" onclick="resume()">続きから</button><button class="soft" onclick="start(true)">誤答だけ復習</button><button class="soft" onclick="backTopics()">← 問題選択へ</button></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="meta"><span class="pill" id="qid"></span><span class="pill" id="qsubject"></span><span class="pill" id="qtopic"></span><span class="pill" id="point"></span></div>
    <div class="stats"><span>残り <b id="remaining"></b></span><span>正解 <b id="correct"></b></span><span>不正解 <b id="wrong"></b></span></div>
    <div class="progress"><div id="bar"></div></div><div id="question"></div>
    <div id="result" class="result"><h2 id="resultTitle"></h2><div><b>正解：</b><span id="correctAnswer"></span></div><div id="explanation"></div><div id="memory" style="font-weight:800;margin-top:8px"></div></div>
    <div id="actions" class="actions"><button class="soft" onclick="openChat()">詳しい解説</button><button class="primary" onclick="next()">次へ</button></div>
  </section>

  <section id="done" class="card hidden">
    <h2 id="doneTitle"></h2><p id="doneText"></p>
    <div class="row"><button class="primary" onclick="backTopics()">問題選択へ</button><button class="soft" onclick="start(true)">誤答だけ復習</button><button class="soft" onclick="backSubjects()">3分野へ</button></div>
  </section>
</div>

<div id="dock" class="dock hidden"><div class="dockin"><button class="ans yes" onclick="answer(true)">○</button><button class="ans no" onclick="answer(false)">×</button></div></div>

<script>
const DATA={"宅建業法":{"宅建業法の基本":[{"point":"宅建業の範囲","question":"自ら宅地・建物を反復継続して売買する行為は、宅地建物取引業に含まれる。","answer":true,"explanation":"自己所有物件でも業として売買すれば宅建業です。","memory":"自ら売買＝宅建業"},{"point":"自己賃貸","question":"自ら所有する建物を賃貸する行為は、宅地建物取引業に含まれる。","answer":false,"explanation":"自己賃貸は宅建業に含まれません。","memory":"自ら貸す＝宅建業ではない"},{"point":"媒介","question":"他人の宅地・建物の売買を反復継続して媒介する行為は、宅地建物取引業に含まれる。","answer":true,"explanation":"売買等の媒介は宅建業です。","memory":"媒介＝宅建業"},{"point":"貸借の媒介","question":"建物賃貸借の媒介を業として行うには、宅建業免許が必要である。","answer":true,"explanation":"貸借の媒介・代理は宅建業です。","memory":"貸借媒介＝免許必要"},{"point":"自己交換","question":"自ら宅地を反復継続して交換する行為は、宅建業に含まれる。","answer":true,"explanation":"自己の売買・交換は宅建業です。","memory":"自ら交換＝宅建業"},{"point":"業として","question":"宅地建物取引業に当たるかは、不特定多数への継続・反復性などを総合して判断する。","answer":true,"explanation":"単発処分か事業としての取引かを社会通念上判断します。","memory":"業＝不特定多数＋継続反復"},{"point":"用途地域内","question":"用途地域内の土地は、道路・公園等の例外を除き、宅建業法上の宅地に含まれる。","answer":true,"explanation":"用途地域内は原則宅地です。","memory":"用途地域内＝原則宅地"},{"point":"建物敷地目的","question":"現在更地でも、建物の敷地に供する目的で取引される土地は宅地に含まれ得る。","answer":true,"explanation":"現況だけでなく目的も見ます。","memory":"建物敷地目的＝宅地"},{"point":"単発農地","question":"都市計画区域外の農地を農地のまま一度だけ売却する行為は、当然に宅建業に当たる。","answer":false,"explanation":"単発処分で宅地にも当たらなければ通常宅建業ではありません。","memory":"農地＋単発＝当然宅建業ではない"},{"point":"免許主義","question":"宅地建物取引業を営むには、原則として宅建業法上の免許が必要である。","answer":true,"explanation":"宅建業は免許制です。","memory":"宅建業＝免許制"},{"point":"国等","question":"国や地方公共団体が行う宅地建物の取引には、宅建業法の免許規定が適用されない。","answer":true,"explanation":"国・地方公共団体には免許規定が適用されません。","memory":"国・地方公共団体＝免許不要"},{"point":"信託会社等","question":"信託会社等には宅建業法上の特例がある。","answer":true,"explanation":"一般業者と異なる特例があります。","memory":"信託会社等＝特例あり"},{"point":"無免許営業","question":"免許を受けていない者が宅建業を営むことはできない。","answer":true,"explanation":"無免許営業は禁止です。","memory":"無免許営業＝禁止"},{"point":"名義貸し","question":"宅建業者が自己の名義を他人に貸して宅建業を営ませることは許されない。","answer":true,"explanation":"名義貸しは禁止です。","memory":"名義貸し＝禁止"},{"point":"取引態様","question":"宅建業者は広告時等に、自ら売主・代理・媒介の別を明示すべき場面がある。","answer":true,"explanation":"取引態 anation":"通常4月1日～4月21日です。","memory":"届出＝3週間以内"},{"point":"届出先","question":"宅建業者は宅建業免許を受けた行政庁へ基準日届出をする。","answer":true,"explanation":"免許行政庁です。","memory":"届出先＝免許行政庁"},{"point":"0戸届出","question":"基準日前1年の引渡しが0戸でも、過去10年間に引渡実績があれば届出が必要となる場合がある。","answer":true,"explanation":"現在の重要ルールです。","memory":"過去10年実績あり＝0戸でも届出"},{"point":"実績なし","question":"基準日前10年間に新築住宅引渡実績がなければ基準日届出は不要である。","answer":true,"explanation":"国交省案内に明示されています。","memory":"過去10年実績なし＝届出不要"},{"point":"措置未実施","question":"資力確保措置を講じていないと一定時期以後新たな新築住宅売買契約締結が禁止される。","answer":true,"explanation":"50日経過後の契約制限が問題になります。","memory":"措置なし＝新規契約制限"},{"point":"未届出","question":"基準日届出をしていない場合も一定時期以後新たな新築住宅売買契約締結が禁止される。","answer":true,"explanation":"未届出にも契約制限があります。","memory":"未届出＝新規契約制限"},{"point":"罰則等","question":"義務違反には罰則や宅建業法上の監督処分が適用されることがある。","answer":true,"explanation":"重大な効果があります。","memory":"履行法違反＝罰則・監督"},{"point":"供託取戻し","question":"供託額が法定基準額を超えた場合、行政庁の承認等を経て超過額を取り戻せることがある。","answer":true,"explanation":"自由に引き出せません。","memory":"供託取戻し＝承認等"}]},"権利関係":{"★ 最優先30問":[{"id":"Q01","category":"制限行為能力者","point":"未成年者","question":"未成年者が法律行為をするには、原則として法定代理人の同意が必要である。","answer":true,"explanation":"未成年者の法律行為は原則として法定代理人の同意が必要です。ただし、単に権利を得る・義務を免れる行為などには例外があります。","memory":"未成年者＝原則同意、単純有利行為は例外。"},{"id":"Q02","category":"制限行為能力者","point":"詐術","question":"制限行為能力者が、自分は行為能力者だと相手方に信じさせるため詐術を用いた場合でも、制限行為能力を理由に必ず取り消すことができる。","answer":false,"explanation":"詐術を用いた制限行為能力者は、その行為を取り消すことができません。","memory":"詐術を使ったら取消し不可。"},{"id":"Q03","category":"意思表示","point":"心裡留保","question":"心裡留保による意思表示は原則として有効である。","answer":true,"explanation":"表意者が真意でないことを知っていても原則有効です。ただし相手方が真意でないことを知り、又は知ることができたときは無効です。","memory":"心裡留保＝原則有効、相手方悪意・有過失なら無効。"},{"id":"Q04","category":"意思表示","point":"錯誤","question":"現行民法では、重要な錯誤による意思表示は当然に無効となる。","answer":false,"explanation":"現行民法では、重要な錯誤は一定の要件のもとで『取消し』の対象です。旧法の『無効』と混同しないことが重要です。","memory":"錯誤＝現行民法では取消し。"},{"id":"Q05","category":"意思表示","point":"詐欺・強迫","question":"詐欺による取消しは善意無過失の第三者に対抗できないが、強迫による取消しは善意の第三者にも対抗できる。","answer":true,"explanation":"詐欺と強迫では第三者保護が異なります。強迫には詐欺と同じ第三者保護規定はありません。","memory":"詐欺＝善意無過失第三者保護、強迫＝第三者にも対抗可。"},{"id":"Q06","category":"代理","point":"代理人の行為能力","question":"代理人になるためには、完全な行為能力を有していなければならない。","answer":false,"explanation":"代理人は行為能力者であることを要しません。制限行為能力者も代理人になれます。","memory":"代理人＝行為能力不要。"},{"id":"Q07","category":"代理","point":"無権代理","question":"無権代理人がした契約は、本人が追認しない限り、本人に対して効力を生じない。","answer":true,"explanation":"無権代理行為は本人の追認がなければ本人を拘束しません。","memory":"無権代理＝本人の追認待ち。"},{"id":"Q08","category":"代理","point":"無権代理の相手方","question":"無権代理の相手方が契約時に代理権がないことを知らなかった場合、本人が追認するまで契約を取り消すことができる。","answer":true,"explanation":"善意の相手方には、本人の追認前まで取消権があります。本人への催告権も重要です。","memory":"無権代理の善意相手方＝追認前は取消し可。"},{"id":"Q09","category":"時効","point":"取得時効","question":"所有の意思をもって平穏かつ公然に他人の土地を占有し、占有開始時に善意無過失なら、10年間で取得時効が成立し得る。","answer":true,"explanation":"短期取得時効は、占有開始時の善意・無過失と10年間の占有が基本です。","memory":"10年取得時効＝占有開始時に善意無過失。"},{"id":"Q10","category":"時効","point":"催告","question":"債権者が内容証明郵便で支払を催告すると、その時点で消滅時効は更新してゼロから進み直す。","answer":false,"explanation":"裁判外の催告は原則6か月の完成猶予を生じさせますが、更新ではありません。","memory":"催告＝6か月完成猶予、更新ではない。"},{"id":"Q11","category":"時効","point":"債権の消滅時効","question":"債権は、原則として権利を行使できることを知った時から5年、又は権利を行使できる時から10年で時効消滅する。","answer":true,"explanation":"現行民法の一般的な債権の消滅時効は、主観的起算点5年と客観的起算点10年です。","memory":"債権時効＝知って5年・行使できて10年。"},{"id":"Q12","category":"債務不履行・解除","point":"解除と帰責事由","question":"現行民法では、債務者に故意・過失などの帰責事由がなければ、契約解除は絶対にできない。","answer":false,"explanation":"現行民法では解除に債務者の帰責事由は一般要件ではありません。損害賠償とは分けて考えます。","memory":"解除≠必ず帰責事由。"},{"id":"Q13","category":"債務不履行・解除","point":"催告解除","question":"債務不履行があっても、その不履行が契約や取引上の社会通念に照らして軽微であるときは、原則として解除できない。","answer":true,"explanation":"催告期間を経過しても不履行が軽微なら解除できません。","memory":"軽微な不履行＝解除不可。"},{"id":"Q14","category":"危険負担","point":"双方無責","question":"双務契約で、双方の責めに帰すことができない事由により一方の債務が履行不能になった場合、反対給付をすべき者は原則としてその履行を拒むことができる。","answer":true,"explanation":"現行民法の危険負担は、反対債務が当然消滅するというより、反対給付の履行拒絶権として整理します。","memory":"双方無責の不能＝反対給付拒絶可。"},{"id":"Q15","category":"弁済","point":"第三者弁済","question":"保証人のように弁済について正当な利益を有する第三者は、債務者の意思に反しても弁済できる。","answer":true,"explanation":"正当な利益を有する第三者は、債務者の意思に反しても弁済できます。","memory":"正当利益ある第三者＝反対でも弁済可。"},{"id":"Q16","category":"相殺","point":"時効完成債権","question":"時効で消滅した債権でも、時効完成前に相殺適状にあった場合は、その債権を用いて相殺できることがある。","answer":true,"explanation":"時効完成前に相殺適状にあったかがポイントです。","memory":"時効完成債権＝完成前に相殺適状なら相殺可。"},{"id":"Q17","category":"債権譲渡","point":"譲渡制限特約","question":"債権に譲渡制限特約がある場合、その特約に反してされた債権譲渡は当然に無効となる。","answer":false,"explanation":"現行民法では、譲渡制限特約があっても債権譲渡自体は原則有効です。債務者の履行拒絶等が別途問題になります。","memory":"譲渡制限特約があっても譲渡自体は原則有効。"},{"id":"Q18","category":"債権譲渡","point":"第三者対抗要件","question":"指名債権の譲渡を第三者に対抗するには、原則として確定日付のある証書による通知又は承諾が必要である。","answer":true,"explanation":"二重譲渡では確定日付のある通知・承諾と通知到達時期が重要です。","memory":"債権譲渡の第三者対抗＝確定日付。"},{"id":"Q19","category":"売買","point":"他人物売買","question":"他人の所有物を目的とする売買契約は、契約締結時に売主が所有者でないという理由だけで当然に無効となる。","answer":false,"explanation":"他人物売買も契約自体は有効です。売主は権利を取得して買主に移転する義務を負います。","memory":"他人物売買＝契約自体は有効。"},{"id":"Q20","category":"売買","point":"契約不適合責任","question":"売買目的物が契約内容に適合しない場合、買主には追完請求、代金減額請求、損害賠償請求、解除が問題となり得る。","answer":true,"explanation":"現行民法では『瑕疵担保責任』ではなく契約不適合責任として整理します。","memory":"契約不適合＝追完・減額・損害賠償・解除。"},{"id":"Q21","category":"物権変動","point":"不動産二重譲渡","question":"同一不動産が二重譲渡された場合、原則として先に売買契約を締結した買主が必ず優先する。","answer":false,"explanation":"原則として先に登記を備えた者が第三者に対抗できます。契約の先後だけでは決まりません。","memory":"不動産二重譲渡＝登記勝負。"},{"id":"Q22","category":"物権変動","point":"背信的悪意者","question":"登記欠缺を主張することが信義則に反する背信的悪意者は、民法177条の第三者として保護されない。","answer":true,"explanation":"単純な悪意だけでは足りませんが、背信的悪意者は第三者から除外されます。","memory":"単純悪意はOK、背信的悪意者は保護されない。"},{"id":"Q23","category":"抵当権","point":"物上代位","question":"抵当権者が抵当不動産の売却代金や賃料債権に物上代位するには、原則として払渡し又は引渡し前に差し押さえる必要がある。","answer":true,"explanation":"物上代位では差押えの時期が頻出です。","memory":"物上代位＝払渡し前に差押え。"},{"id":"Q24","category":"抵当権","point":"法定地上権","question":"法定地上権の成立を判断する際は、原則として抵当権設定時に土地と建物が同一所有者に属していたかが重要である。","answer":true,"explanation":"抵当権設定時の土地・建物の所有関係が主要な判断ポイントです。","memory":"法定地上権＝抵当権設定時の同一所有を見る。"},{"id":"Q25","category":"連帯債務","point":"請求の効力","question":"現行民法では、債権者が連帯債務者の一人に履行を請求すると、その請求の効力は当然に他のすべての連帯債務者にも及ぶ。","answer":false,"explanation":"現行民法では、一人に対する請求は原則として他の連帯債務者に効力を及ぼしません。旧法との違いに注意します。","memory":"連帯債務の請求＝原則相対効。"},{"id":"Q26","category":"保証","point":"連帯保証","question":"連帯保証人には、普通保証人に認められる催告の抗弁権と検索の抗弁権がない。","answer":true,"explanation":"連帯保証人は普通保証人より責任が重く、催告・検索の抗弁権がありません。","memory":"連帯保証＝催告・検索なし。"},{"id":"Q27","category":"共有","point":"管理・保存・変更","question":"共有物の保存行為は各共有者が単独ででき、管理は原則として持分価格の過半数、重大な変更は原則全員同意である。","answer":true,"explanation":"共有では『保存＝単独、管理＝持分過半数、重大変更＝全員同意』の整理が基本です。軽微変更には例外があります。","memory":"共有＝保存単独・管理過半数・重大変更全員。"},{"id":"Q28","category":"区分所有法","point":"2026年改正","question":"2026年4月1日以降、区分所有法上の普通決議は、原則として出席した区分所有者及びその議決権の各過半数で決する。","answer":true,"explanation":"2026年4月施行の改正で、普通決議は出席者多数決が基本になりました。","memory":"2026改正＝普通決議は出席者各過半数。"},{"id":"Q29","category":"不動産登記法","point":"相続登記義務","question":"相続により不動産所有権を取得したことを知った相続人は、原則としてそのことを知った日から3年以内に相続登記を申請しなければならない。","answer":true,"explanation":"2024年4月から相続登記が義務化されています。","memory":"相続登記＝知って3年以内。"},{"id":"Q30","category":"不動産登記法","point":"住所等変更登記","question":"2026年4月1日から、不動産の所有権登記名義人は、住所や氏名等の変更日から原則として2年以内に変更登記を申請する義務がある。","answer":true,"explanation":"2026年4月1日から住所等変更登記が義務化されました。正当な理由なく違反すると5万円以下の過料対象となる可能性があります。","memory":"住所・氏名変更登記＝原則2年以内。"}],"制限行為能力者":[{"id":"Q01","point":"未成年者","question":"未成年者が法律行為をするには、原則として法定代理人の同意が必要である。","answer":true,"explanation":"未成年者の法律行為は原則として法定代理人の同意が必要です。","memory":"未成年者＝原則、法定代理人の同意"},{"id":"Q02","point":"単純有利行為","question":"未成年者が単に権利を得るだけの行為でも必ず法定代理人の同意が必要である。","answer":false,"explanation":"本人に不利益のない行為は例外です。","memory":"単に権利を得る・義務を免れる＝単独可"},{"id":"Q03","point":"処分許可財産","question":"法定代理人が目的を定めて処分を許した財産は、その目的の範囲内で未成年者が処分できる。","answer":true,"explanation":"処分を許された財産には例外があります。","memory":"処分を許された財産＝範囲内で単独可"},{"id":"Q04","point":"営業許可","question":"営業を許された未成年者でも、その営業上の契約を常に取り消せる。","answer":false,"explanation":"営業許可の範囲では成年者と同じです。","memory":"営業許可＝その営業では成年者と同じ"},{"id":"Q05","point":"成年被後見人","question":"成年被後見人の法律行為は、日用品購入など日常生活行為を除き取り消せる。","answer":true,"explanation":"成年被後見人の保護は強く、日常生活行為が主な例外です。","memory":"成年被後見人＝日常生活行為以外は取消し可"},{"id":"Q06","point":"被保佐人","question":"被保佐人は、日用品購入を含むすべての法律行為で保佐人の同意が必要である。","answer":false,"explanation":"被保佐人は重要な財産行為が中心です。","memory":"被保佐人＝重要行為に同意"},{"id":"Q07","point":"被補助人","question":"被補助人は、家庭裁判所が定めた特定の行為について補助人の同意を要することがある。","answer":true,"explanation":"被補助人の同意対象は審判で特定されます。","memory":"被補助人＝同意対象は審判で特定"},{"id":"Q08","point":"取消しの効果","question":"制限行為能力を理由に取り消しても、取消し前の効力はすべて残る。","answer":false,"explanation":"取消しには遡及効があります。","memory":"取消し＝初めから無効扱い"},{"id":"Q09","point":"返還義務","question":"制限行為能力者は、取消し後の返還について現に利益を受けている限度で返還すればよい。","answer":true,"explanation":"返還義務は現存利益の範囲です。","memory":"返還＝現存利益の範囲"},{"id":"Q10","point":"詐術・追認","question":"制限行為能力者は詐術を用いても必ず取消せ、成年後に追認してもいつでも取消しに戻れる。","answer":false,"explanation":"詐術と追認は頻出です。","memory":"詐術＝取消不可、追認＝取消権消滅"}],"意思表示":[{"id":"Q01","point":"意思能力","question":"意思能力を有しない者がした法律行為は無効である。","answer":true,"explanation":"意思能力欠如は無効です。","memory":"意思能力なし＝無効"},{"id":"Q02","point":"心裡留保","question":"心裡留保は相手方の認識にかかわらず常に無効である。","answer":false,"explanation":"原則有効・例外無効です。","memory":"心裡留保＝原則有効"},{"id":"Q03","point":"虚偽表示","question":"相手方と通じてした虚偽表示は無効である。","answer":true,"explanation":"通謀虚偽表示は無効です。","memory":"通謀虚偽表示＝無効"},{"id":"Q04","point":"虚偽表示と第三者","question":"通謀虚偽表示の無効は善意の第三者にも常に対抗できる。","answer":false,"explanation":"善意第三者を保護します。","memory":"虚偽表示＝善意第三者保護"},{"id":"Q05","point":"錯誤","question":"重要な錯誤がある意思表示は、一定の要件で取り消すことができる。","answer":true,"explanation":"現行民法では錯誤は取消しです。","memory":"錯誤＝重要なら取消し"},{"id":"Q06","point":"重過失","question":"錯誤なら表意者に重大な過失があっても常に取消せる。","answer":false,"explanation":"重過失の有無を確認します。","memory":"錯誤＋重過失＝原則取消不可"},{"id":"Q07","point":"詐欺","question":"相手方の詐欺による意思表示は取り消すことができる。","answer":true,"explanation":"詐欺は取消原因です。","memory":"詐欺＝取消し"},{"id":"Q08","point":"第三者詐欺","question":"第三者詐欺は、相手方が全く知らなくても常に取消せる。","answer":false,"explanation":"第三者詐欺では相手方の認識が重要です。","memory":"第三者詐欺＝相手方悪意・有過失"},{"id":"Q09","point":"詐欺・強迫と第三者","question":"詐欺取消しは善意無過失の第三者に対抗できないが、強迫取消しは善意の第三者にも対抗できる。","answer":true,"explanation":"両者の第三者保護を区別します。","memory":"詐欺と強迫＝第三者保護が違う"},{"id":"Q10","point":"到達主義","question":"相手方のある意思表示は、原則として発信した瞬間に効力を生ずる。","answer":false,"explanation":"原則到達主義です。","memory":"意思表示＝原則到達時"}],"代理":[{"id":"Q01","point":"代理の効果","question":"代理人が権限内で顕名してした行為の効果は本人に直接帰属する。","answer":true,"explanation":"有権代理の基本です。","memory":"代理＝効果は本人"},{"id":"Q02","point":"顕名","question":"顕名がなければ相手方が代理だと知っていても本人に効果は帰属しない。","answer":false,"explanation":"顕名原則の例外です。","memory":"顕名なしでも相手方認識あり＝本人"},{"id":"Q03","point":"代理人の行為能力","question":"代理人は行為能力者であることを要しない。","answer":true,"explanation":"制限行為能力者も代理人になれます。","memory":"代理人＝行為能力不要"},{"id":"Q04","point":"意思表示の瑕疵","question":"代理行為の詐欺・錯誤は常に本人だけを基準に判断する。","answer":false,"explanation":"意思表示をした代理人が基準です。","memory":"代理の瑕疵＝代理人基準"},{"id":"Q05","point":"自己契約・双方代理","question":"自己契約・双方代理は原則無権代理扱いだが、本人の許諾等の例外がある。","answer":true,"explanation":"利益相反防止の規定です。","memory":"自己契約・双方代理＝原則無権代理"},{"id":"Q06","point":"代理権濫用","question":"代理権濫用でも形式的に権限内なら相手方が事情を知っていても必ず本人を拘束する。","answer":false,"explanation":"現行民法107条です。","memory":"代理権濫用＋相手方悪意等＝無権代理"},{"id":"Q07","point":"無権代理","question":"無権代理行為は本人が追認しない限り本人に効力を生じない。","answer":true,"explanation":"本人の追認が鍵です。","memory":"無権代理＝追認待ち"},{"id":"Q08","point":"追認","question":"本人が追認しても追認時以後にしか効力を生じない。","answer":false,"explanation":"追認には原則遡及効があります。","memory":"追認＝原則遡及"},{"id":"Q09","point":"相手方の催告・取消し","question":"無権代理の相手方は本人に追認を催告でき、善意なら追認前に契約を取り消せる。","answer":true,"explanation":"相手方保護制度です。","memory":"相手方＝催告・善意なら取消し"},{"id":"Q10","point":"無権代理人責任・表見代理","question":"無権代理では相手方を保護する制度は一切ない。","answer":false,"explanation":"無権代理人責任と表見代理を区別します。","memory":"無権代理＝無権代理人責任＋表見代理"}],"時効":[{"id":"Q01","point":"20年取得時効","question":"所有の意思をもって平穏かつ公然に20年間他人の物を占有すれば、原則として所有権を時効取得する。","answer":true,"explanation":"取得時効の基本です。","memory":"取得時効＝原則20年"},{"id":"Q02","point":"10年取得時効","question":"10年取得時効では善意だけで足り、無過失は不要である。","answer":false,"explanation":"短期取得時効は善意無過失です。","memory":"10年＝善意無過失 explanation":"道路の基本幅員は4mです。","memory":"道路＝原則4m以上"},{"id":"Q02","point":"2項道路","question":"幅員4m未満の道はどのような場合でも建築基準法上の道路にならない。","answer":false,"explanation":"いわゆる2項道路です。","memory":"2項道路＝4m未満でも道路扱いあり"},{"id":"Q03","point":"接道義務","question":"都市計画区域等では、建築物の敷地は原則として道路に2m以上接しなければならない。","answer":true,"explanation":"接道は原則2m以上です。","memory":"接道＝原則2m以上"},{"id":"Q04","point":"新2号建築物","question":"2025年4月以降も木造2階建て住宅はすべて旧4号建築物として扱われる。","answer":false,"explanation":"4号特例見直し後の重要点です。","memory":"新2号＝2階以上又は200㎡超"},{"id":"Q05","point":"新3号建築物","question":"2025年4月以降、平家かつ延べ面積200㎡以下の建築物は新3号建築物に該当する。","answer":true,"explanation":"新3号建築物の基本です。","memory":"新3号＝平家＋200㎡以下"},{"id":"Q06","point":"防火地域等","question":"防火地域と準防火地域にまたがる建物は必ず準防火地域の規定だけが適用される。","answer":false,"explanation":"原則は厳しい側です。","memory":"防火＋準防火＝原則防火地域扱い"},{"id":"Q07","point":"建蔽率","question":"建蔽率は、建築面積の敷地面積に対する割合である。","answer":true,"explanation":"建蔽率と容積率を区別します。","memory":"建蔽率＝建築面積÷敷地面積"},{"id":"Q08","point":"容積率","question":"容積率は、建築面積の敷地面積に対する割合である。","answer":false,"explanation":"容積率の基本です。","memory":"容積率＝延べ面積÷敷地面積"},{"id":"Q09","point":"絶対高さ","question":"第一種・第二種低層住居専用地域及び田園住居地域には、10m又は12mの絶対高さ制限がある。","answer":true,"explanation":"低層系＋田園住居がポイントです。","memory":"絶対高さ10m/12m＝低層住専＋田園住居"},{"id":"Q10","point":"既存不適格","question":"法改正で新基準に適合しなくなった既存建築物はすべて直ちに違反建築物となる。","answer":false,"explanation":"既存不適格の考え方です。","memory":"法改正不適合＝即違反ではない"}],"国土利用計画法":[{"id":"Q01","point":"届出義務者","question":"一定規模以上の土地売買等の契約では、原則として権利取得者が事後届出を行う。","answer":true,"explanation":"届出義務者は買主等の権利取得者です。","memory":"事後届出＝権利取得者"},{"id":"Q02","point":"期限","question":"事後届出は原則契約締結から3か月以内でよい。","answer":false,"explanation":"2週間が頻出数字です。","memory":"国土法＝契約から2週間以内"},{"id":"Q03","point":"市街化区域","question":"市街化区域では、原則として2,000㎡以上の土地取引が事後届出の面積要件となる。","answer":true,"explanation":"市街化区域は2,000㎡です。","memory":"市街化区域＝2,000㎡以上"},{"id":"Q04","point":"その他都市計画区域","question":"市街化区域以外の都市計画区域では原則2,000㎡以上が面積要件である。","answer":false,"explanation":"5,000㎡です。","memory":"その他都市計画区域＝5,000㎡以上"},{"id":"Q05","point":"都市計画区域外","question":"都市計画区域外では、原則10,000㎡以上が面積要件となる。","answer":true,"explanation":"10,000㎡です。","memory":"都市計画区域外＝10,000㎡以上"},{"id":"Q06","point":"届出経由","question":"事後届出は必ず法務局に直接提出する。","answer":false,"explanation":"提出先の流れです。","memory":"市町村長経由→都道府県知事等"},{"id":"Q07","point":"届出内容","question":"事後届出では、利用目的や取引価格などを届け出る。","answer":true,"explanation":"利用目的が重要です。","memory":"届出＝利用目的・取引価格等"},{"id":"Q08","point":"勧告","question":"国土利用計画法には届出後の勧告制度はない。","answer":false,"explanation":"勧告制度があります。","memory":"届出後＝利用目的の勧告あり"},{"id":"Q09","point":"契約効力","question":"事後届出を怠っただけで土地売買契約そのものが当然無効になるわけではない。","answer":true,"explanation":"行政義務と契約効力は別です。","memory":"無届＝契約当然無効ではない"},{"id":"Q10","point":"事前規制","question":"国土利用計画法には事後届出以外の土地取引規制制度は一切ない。","answer":false,"explanation":"注視区域・監視区域等の制度があります。","memory":"国土法＝事後届出以外もある"}],"農地法":[{"id":"Q01","point":"農地判断","question":"農地法上の農地かどうかは、登記簿上の地目だけでなく現況も重要である。","answer":true,"explanation":"現況が重要です。","memory":"農地＝登記地目だけでなく現況"},{"id":"Q02","point":"3条","question":"農地を農地のまま売買する場合は常に農地法5条の許可が必要である。","answer":false,"explanation":"権利移動は3条です。","memory":"3条＝農地のまま権利移動"},{"id":"Q03","point":"4条","question":"農地所有者が自ら農地を農地以外に転用する場合は原則4条許可が必要である。","answer":true,"explanation":"自己転用は4条です。","memory":"4条＝自己転用"},{"id":"Q04","point":"5条","question":"農地を宅地にする目的で買い受ける場合でも3条だけで足りる。","answer":false,"explanation":"転用目的の権利移動は5条です。","memory":"5条＝転用目的の権利移動"},{"id":"Q05","point":"市街化区域特例","question":"市街化区域内の農地転用では、一定の場合にあらかじめ農業委員会への届出をすれば4条・5条許可が不要となる。","answer":true,"explanation":"市街化区域の届出特例です。","memory":"市街化区域内転用＝届出特例"},{"id":"Q06","point":"相続","question":"農地相続には必ず3条許可を事前に受ける必要がある。","answer":false,"explanation":"相続は許可でなく届出の論点です。","memory":"農地相続＝3条許可不要、届出に注意"},{"id":"Q07","point":"3条無許可","question":"3条許可が必要な権利移動を無許可で行うと、その権利移動の効力が認められないことがある。","answer":true,"explanation":"3条許可は効力面でも重要です。","memory":"3条無許可＝権利移動効力に影響"},{"id":"Q08","point":"転用規制","question":"4条・5条は農地を農地のまま耕作することだけを規制する。","answer":false,"explanation":"転用規制の基本です。","memory":"4条・5条＝転用規制"},{"id":"Q09","point":"採草放牧地","question":"農地法は農地だけでなく、一定の採草放牧地の権利移動等も規制対象とする。","answer":true,"explanation":"採草放牧地も対象があります。","memory":"農地法＝採草放牧地も対象あり"},{"id":"Q10","point":"整理","question":"農地法3条・4条・5条は同じ行為を規制しており区別不要である。","answer":false,"explanation":"最重要整理です。","memory":"3＝権利移動、4＝自己転用、5＝転用＋権利移動"}],"盛土規制法":[{"id":"Q01","point":"正式名称","question":"盛土規制法の正式名称は「宅地造成及び特定盛土等規制法」である。","answer":true,"explanation":"2023年施行の改正後名称です。","memory":"盛土規制法＝宅地造成及び特定盛土等規制法"},{"id":"Q02","point":"用途不問","question":"盛土規制法は宅地だけを対象とし農地や森林には適用されない。","answer":false,"explanation":"用途を問わない包括規制です。","memory":"盛土規制＝土地用途を問わない"},{"id":"Q03","point":"規制区域","question":"都道府県知事等は、盛土等により人家等に被害を及ぼし得る区域を規制区域として指定する。","answer":true,"explanation":"区域指定の基本です。","memory":"規制区域＝都道府県知事等が指定"},{"id":"Q04","point":"許可","question":"規制区域内でも一定規模以上の盛土工事に許可制度はない。","answer":false,"explanation":"許可制が中心です。","memory":"一定規模以上の盛土等＝原則許可"},{"id":"Q05","point":"土石堆積","question":"盛土規制法は、恒久的な盛土だけでなく一定の土石の一時的な堆積も規制対象とする。","answer":true,"explanation":"仮置きも対象となり得ます。","memory":"土石の一時堆積も対象"},{"id":"Q06","point":"検査報告","question":"許可を受ければその後の報告や検査制度は一切ない。","answer":false,"explanation":"安全確保の仕組みです。","memory":"許可後＝報告・中間検査・完了検査"},{"id":"Q07","point":"所有者責務","question":"盛土等が行われた土地の所有者等には、その土地を安全な状態に維持する責務がある。","answer":true,"explanation":"責任所在の明確化です。","memory":"土地所有者等＝安全維持責務"},{"id":"Q08","point":"是正命令","question":"盛土規制法では原因行為者に是正措置を命じる制度はない。","answer":false,"explanation":"原因行為者にも責任追及できます。","memory":"危険盛土＝原因行為者にも命令あり"},{"id":"Q09","point":"公共施設用地","question":"法律で定める公共施設用地で行う盛土等には適用除外となるものがある。","answer":true,"explanation":"適用除外があります。","memory":"公共施設用地＝適用除外あり"},{"id":"Q10","point":"改正趣旨","question":"現行法は旧法より対象を狭め、宅地造成以外の盛土を規制対象外とした。","answer":false,"explanation":"スキマのない規制が目的です。","memory":"現行法＝スキマのない規制"}],"土地区画整理法":[{"id":"Q01","point":"組合員","question":"土地区画整理組合では、施行地区内の宅地所有者と借地権者が原則組合員となる。","answer":true,"explanation":"組合員の基本です。","memory":"組合員＝所有者＋借地権者"},{"id":"Q02","point":"建築制限","question":"組合施行なら建築等の許可は必ず組合自身が行う。","answer":false,"explanation":"許可主体に注意します。","memory":"区画整理中の建築＝知事等の許可"},{"id":"Q03","point":"仮換地","question":"仮換地が指定されると原則従前地に代えて仮換地を使用収益する。","answer":true,"explanation":"仮換地の効果です。","memory":"仮換地＝従前地に代えて使用収益"},{"id":"Q04","point":"使用開始日","question":"仮換地指定日と使用収益開始日は必ず同一日である。","answer":false,"explanation":"別日指定があります。","memory":"仮換地＝使用開始日が別日のことあり"},{"id":"Q05","point":"照応","question":"換地は位置・地積・土質・水利・利用状況・環境等が照応するよう定めるのが原則である。","answer":true,"explanation":"照応は総合判断です。","memory":"換地＝照応の原則"},{"id":"Q06","point":"減歩","question":"換地面積は必ず従前地と同一で減歩は認められない。","answer":false,"explanation":"減歩の基本です。","memory":"換地が小さくなる＝減歩"},{"id":"Q07","point":"保留地","question":"保留地は原則換地処分公告日の翌日に施行者が取得する。","answer":true,"explanation":"公告翌日です。","memory":"保留地＝公告翌日に施行者取得"},{"id":"Q08","point":"換地処分","question":"換地処分は工事開始前に必ず行う。","answer":false,"explanation":"原則工事完了後です。","memory":"換地処分＝原則工事完了後"},{"id":"Q09","point":"公告翌日","question":"換地処分公告日の翌日から、換地が従前地とみなされ、清算金確定など重要な効果が生じる。","answer":true,"explanation":"公告翌日を固定します。","memory":"換地処分＝公告翌日が重要"},{"id":"Q10","point":"登記","question":"換地処分後の登記は各地権者だけが個別に行い施行者は関与しない。","answer":false,"explanation":"施行者がまとめて行います。","memory":"換地処分後の登記＝施行者"}],"その他の法令上の制限":[{"id":"Q01","point":"景観法","question":"景観計画区域内では、建築物の建築等について一定の場合に届出が必要となる。","answer":true,"explanation":"景観法の代表的規制です。","memory":"景観計画区域＝一定行為に届出"},{"id":"Q02","point":"自然公園法","question":"自然公園の特別地域では工作物の新築は常に自由である。","answer":false,"explanation":"特別地域の許可制です。","memory":"自然公園特別地域＝許可に注意"},{"id":"Q03","point":"河川法","question":"河川区域内では、土地の占用や工作物の新築等について河川管理者の許可が必要となる場合がある。","answer":true,"explanation":"河川区域の規制です。","memory":"河川区域＝占用・工作物に許可"},{"id":"Q04","point":"道路法","question":"道路を占用して工作物を設けても道路管理者の許可は不要である。","answer":false,"explanation":"道路占用許可です。","memory":"道路占用＝道路管理者の許可"},{"id":"Q05","point":"文化財保護法","question":"周知の埋蔵文化財包蔵地で土木工事等を行う場合、事前の届出が必要となることがある。","answer":true,"explanation":"埋蔵文化財の届出制度です。","memory":"埋蔵文化財包蔵地＝事前届出に注意"},{"id":"Q06","point":"森林法","question":"森林法には民有林の開発行為を規制する許可制度はない。","answer":false,"explanation":"林地開発許可制度です。","memory":"森林開発＝一定規模以上で許可"},{"id":"Q07","point":"公有地拡大推進法","question":"一定の土地を有償譲渡しようとする場合、契約締結前に地方公共団体等への届出が必要となることがある。","answer":true,"explanation":"先買い制度です。","memory":"公拡法＝契約前届出に注意"},{"id":"Q08","point":"生産緑地法","question":"生産緑地地区に指定されても建築や宅地造成に一切制限はない。","answer":false,"explanation":"生産緑地の行為制限です。","memory":"生産緑地＝建築・造成制限"},{"id":"Q09","point":"都市緑地法","question":"特別緑地保全地区では、建築物の新築や土地の形質変更等について許可が必要となる場合がある。","answer":true,"explanation":"緑地保全の許可制です。","memory":"特別緑地保全地区＝許可"},{"id":"Q10","point":"解法","question":"法令上の制限では許可か届出か、主体や期限を区別する必要はない。","answer":false,"explanation":"横断整理が効果的です。","memory":"法令制限＝許可/届出・主体・期限"}]}};
const KEY="takken_short_attack_445_v1",SETKEY="takken_short_attack_settings_v1";
let st={subject:null,topic:null,active:false,queue:[],idx:0,c:0,w:0,answered:false,wrongHist:{},completed:{}};
let cfg={order:"random",chatUrl:""};
const $=id=>document.getElementById(id);

function load(){try{let a=localStorage.getItem(KEY);if(a)st=JSON.parse(a)}catch(e){}try{let b=localStorage.getItem(SETKEY);if(b)cfg=JSON.parse(b)}catch(e){}$("order").value=cfg.order;$("chatUrl").value=cfg.chatUrl||""}
function save(){localStorage.setItem(KEY,JSON.stringify(st));localStorage.setItem(SETKEY,JSON.stringify(cfg))}
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function hideAll(){["subjectHome","topicHome","settings","topicMenu","quiz","done"].forEach(x=>$(x).classList.add("hidden"));$("dock").classList.add("hidden")}

function openSubject(subject){
  st.subject=subject;st.topic=null;save();hideAll();
  $("subjectTitle").textContent=subject+"：問題を選択";$("crumb").textContent="宅建 短期攻略 ＞ "+subject;
  $("subjectNote").textContent=subject==="権利関係"?"最初は「★ 最優先30問」がおすすめです。その後、弱い分野を10問ずつ固めます。":"各テーマは同じ論点の単純反復を避けた基本知識中心です。";
  const bank=DATA[subject];
  $("topicGrid").innerHTML=Object.keys(bank).map(t=>{
    const key=subject+"|"+t, core=t.startsWith("★");
    return `<button class="topic${core?" core":""}" data-topic="${t}">${t}<small>${bank[t].length}問</small>${st.completed[key]?'<small class="done">✓ 1周完了</small>':''}</button>`;
  }).join("");
  document.querySelectorAll("#topicGrid .topic").forEach(b=>b.addEventListener("click",()=>openTopic(b.dataset.topic)));
  $("topicHome").classList.remove("hidden");
}
function openTopic(topic){st.topic=topic;save();hideAll();$("topicCrumb").textContent="宅建 短期攻略 ＞ "+st.subject+" ＞ "+topic;$("topicTitle").textContent=topic+" "+DATA[st.subject][topic].length+"問";$("topicMenu").classList.remove("hidden")}
function backSubjects(){hideAll();$("subjectHome").classList.remove("hidden")}
function backTopics(){openSubject(st.subject)}
function showSettings(){hideAll();$("settings").classList.remove("hidden")}
function saveSettings(){cfg.order=$("order").value;cfg.chatUrl=$("chatUrl").value.trim();save();backSubjects()}

function start(wrongOnly){
  let arr=DATA[st.subject][st.topic];
  if(wrongOnly)arr=arr.filter(q=>st.wrongHist[st.subject+"|"+st.topic+"|"+q.id]);
  if(!arr.length){alert("この分野の誤答履歴はありません。");return}
  st.active=true;st.idx=0;st.c=0;st.w=0;st.answered=false;st.queue=arr.map(q=>q.id);
  if(cfg.order==="random")st.queue=sh(st.queue);
  save();showQuiz();render();
}
function resume(){if(!st.active||!st.subject||!st.topic||!st.queue.length){alert("再開できる途中データがありません。");return}showQuiz();render()}
function showQuiz(){hideAll();$("quiz").classList.remove("hidden");$("dock").classList.remove("hidden")}
function current(){return DATA[st.subject][st.topic].find(q=>q.id===st.queue[st.idx])}

function render(){
  let q=current();if(!q){finish();return}
  st.answered=false;$("qid").textContent=q.id;$("qsubject").textContent=st.subject;$("qtopic").textContent=st.topic;$("point").textContent=q.point;
  $("remaining").textContent=st.queue.length-st.idx;$("correct").textContent=st.c;$("wrong").textContent=st.w;$("question").textContent=q.question;
  $("bar").style.width=(st.idx/st.queue.length*100)+"%";$("result").className="result";$("actions").className="actions";$("dock").classList.remove("hidden");save();window.scrollTo({top:0,behavior:"smooth"});
}
function answer(a){
  if(st.answered)return;st.answered=true;let q=current(),ok=a===q.answer,key=st.subject+"|"+st.topic+"|"+q.id;
  if(ok)st.c++;else{st.w++;st.wrongHist[key]=true}
  $("result").className="result "+(ok?"ok":"ng");$("resultTitle").textContent=ok?"正解です":"不正解です";$("correctAnswer").textContent=q.answer?"○":"×";
  $("explanation").innerHTML="<br><b>解説：</b>"+q.explanation;$("memory").textContent="試験で覚える一言： "+q.memory;
  $("actions").className="actions show";$("dock").classList.add("hidden");save();$("result").scrollIntoView({behavior:"smooth",block:"center"});
}
function next(){st.idx++;if(st.idx>=st.queue.length)finish();else render()}
function finish(){
  st.active=false;st.completed[st.subject+"|"+st.topic]=true;save();hideAll();
  $("doneTitle").textContent=st.subject+" ＞ "+st.topic+"・1周完了";
  $("doneText").textContent=`正解 ${st.c}・不正解 ${st.w}。間違いは同じ周回では繰り返さず、誤答履歴に保存しました。`;
  $("done").classList.remove("hidden");
}
async function openChat(){
  let q=current();if(!cfg.chatUrl){alert("共通設定で宅建解説チャットURLを登録してください。");return}
  let p=`次の宅建一問一答を、令和8年度宅建試験（2026年4月1日現在施行法令）を前提に初学者向けに詳しく解説してください。原則・例外・ひっかけ・過去問での見抜き方を説明し、最後に「試験で覚える一言」を付けてください。\n\n【大分野】${st.subject}\n【分野】${st.topic}\n【論点】${q.point}\n【問題】${q.question}\n【正解】${q.answer?"○":"×"}\n【教材解説】${q.explanation}`;
  try{await navigator.clipboard.writeText(p);window.open(cfg.chatUrl,"_blank")}catch(e){alert("問題文のコピーに失敗しました。")}
}
function resetAll(){if(!confirm("すべての進捗・誤答履歴を削除しますか？"))return;localStorage.removeItem(KEY);st={subject:null,topic:null,active:false,queue:[],idx:0,c:0,w:0,answered:false,wrongHist:{},completed:{}};save();backSubjects()}
load();backSubjects();
</script>
</body></html>
