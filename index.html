<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宅建 借地借家">
<meta name="theme-color" content="#2457d6">
<link rel="manifest" href="./manifest.webmanifest">
<title>宅建 借地借家法 iPhone版</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--sub:#687386;--line:#dce3ed;--blue:#2457d6;--ok:#19733d;--ng:#a92323}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:640px;margin:0 auto;min-height:100dvh;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.hero{padding:8px 3px 4px}h1{font-size:23px;line-height:1.25;margin:0 0 6px}.sub{font-size:13px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 3px 12px rgba(20,35,60,.05)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}select,input{width:100%;font-size:16px;padding:13px;border:1px solid #bec8d6;border-radius:12px;background:#fff;color:var(--text)}
.stack{display:grid;gap:10px}button{font:inherit;font-weight:750;border:0;border-radius:14px;min-height:50px;padding:12px 15px}.primary{background:var(--blue);color:#fff}.soft{background:#eaf0fc;color:#214785}.danger{background:#fff0f0;color:#9b2525}
.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{font-size:12px;background:#eef2f7;padding:5px 8px;border-radius:999px}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:10px}
.progress{height:8px;background:#e7ebf1;border-radius:999px;overflow:hidden;margin-top:10px}#bar{height:100%;width:0;background:var(--blue)}
#question{font-size:22px;line-height:1.65;font-weight:800;margin:17px 0 132px}
.answerDock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(244,247,251,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10}
.answerInner{max-width:612px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{min-height:68px;font-size:28px;border:2px solid}.yes{background:#effaf3;color:#146b38;border-color:#9ad2ae}.no{background:#fff2f2;color:#922020;border-color:#e5a2a2}
.result{display:none;margin-top:12px;border-radius:14px;padding:14px;line-height:1.65}.result.ok{display:block;background:#effaf3;border:1px solid #9ad2ae}.result.ng{display:block;background:#fff2f2;border:1px solid #e5a2a2}.result h2{font-size:19px;margin:0 0 8px}
.actions{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions.show{display:grid}
.hidden{display:none!important}.tip{font-size:12px;color:var(--sub);line-height:1.5}.homeHelp{margin-top:12px;padding:12px;background:#f7f9fc;border-radius:12px;font-size:13px;line-height:1.6}
@media (min-width:700px){#question{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="hero"><h1>宅建 借地借家法</h1><div class="sub">GitHub Pages / iPhone版・30問・誤答反復</div></div>

  <section id="menu" class="card">
    <label>習得モード</label>
    <select id="mode"><option value="normal">通常：1回正解で習得</option><option value="strict">徹底：2回連続正解で習得</option></select>
    <label>問題順</label>
    <select id="order"><option value="random">ランダム</option><option value="id">問題番号順</option></select>
    <label>宅建解説チャットURL</label>
    <input id="chatUrl" placeholder="固定で使うチャットURL">
    <div class="stack" style="margin-top:14px">
      <button class="primary" onclick="start(false)">新しく開始</button>
      <button class="soft" onclick="resume()">続きから再開</button>
      <button class="soft" onclick="start(true)">過去に間違えた問題だけ</button>
      <button class="soft" onclick="toggleHelp()">iPhoneでの使い方</button>
      <button class="danger" onclick="resetAll()">進捗をリセット</button>
    </div>
    <div id="help" class="homeHelp hidden">
      Safariで開いた場合は、共有ボタン →「ホーム画面に追加」でアプリ風に起動できます。<br>
      ※「ホーム画面に追加」はWebページとして開いた場合に利用しやすく、ファイルアプリのプレビューでは出ないことがあります。
    </div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="meta"><span class="pill" id="qid"></span><span class="pill" id="point"></span><span class="pill" id="round"></span></div>
    <div class="stats"><span>残り <b id="remaining"></b></span><span>正解 <b id="correct"></b></span><span>不正解 <b id="wrong"></b></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question"></div>
    <div id="result" class="result">
      <h2 id="resultTitle"></h2>
      <div><b>正解：</b><span id="correctAnswer"></span></div>
      <div id="explanation"></div>
      <div id="memory" style="font-weight:800;margin-top:8px"></div>
    </div>
    <div id="actions" class="actions">
      <button class="soft" onclick="openChat()">詳しい解説</button>
      <button class="primary" onclick="next()">次へ</button>
    </div>
  </section>

  <section id="done" class="card hidden">
    <h2>習得完了</h2>
    <p id="doneText"></p>
    <button class="primary" style="width:100%" onclick="backMenu()">メニューへ</button>
  </section>
</div>

<div id="answerDock" class="answerDock hidden">
  <div class="answerInner">
    <button class="ans yes" onclick="answer(true)">○</button>
    <button class="ans no" onclick="answer(false)">×</button>
  </div>
</div>

<script>
const Q=[{"id": "Q001", "point": "普通借地権の存続期間", "question": "普通借地権の最初の存続期間は、当事者がこれより短い期間を定めても原則として30年となる。", "answer": true, "explanation": "普通借地権の当初存続期間は30年以上です。30年未満を定めても30年となります。", "memory": "普通借地＝最初30年。"}, {"id": "Q002", "point": "普通借地権の更新", "question": "普通借地権を最初に更新する場合、更新後の存続期間を定めなければ20年となる。", "answer": true, "explanation": "最初の更新は20年です。その後の更新は10年が基本です。", "memory": "普通借地＝30→20→10。"}, {"id": "Q003", "point": "普通借地権の更新", "question": "普通借地権の2回目以降の更新では、更新後の期間を定めなければ20年となる。", "answer": false, "explanation": "2回目以降の更新期間は10年です。", "memory": "2回目以降の更新＝10年。"}, {"id": "Q004", "point": "更新拒絶", "question": "普通借地権の期間満了時に建物が存在し、借地人が更新を請求した場合でも、地主が遅滞なく異議を述べ、かつ正当事由があれば更新を拒絶できる。", "answer": true, "explanation": "地主による更新拒絶には、遅滞ない異議と正当事由が重要です。", "memory": "更新拒絶＝異議＋正当事由。"}, {"id": "Q005", "point": "一般定期借地権", "question": "一般定期借地権は、存続期間を50年以上として設定する。", "answer": true, "explanation": "一般定期借地権は50年以上です。", "memory": "一般定期借地＝50年以上。"}, {"id": "Q006", "point": "一般定期借地権の方式", "question": "一般定期借地権を設定する契約は、必ず公正証書でしなければならない。", "answer": false, "explanation": "一般定期借地権は書面等による必要がありますが、公正証書に限定されません。", "memory": "一般定期＝公正証書限定ではない。"}, {"id": "Q007", "point": "事業用定期借地権", "question": "事業用定期借地権は、10年以上50年未満で設定することができ、その契約は公正証書によらなければならない。", "answer": true, "explanation": "事業用定期借地権は10年以上50年未満で、公正証書が必要です。", "memory": "事業用定期＝10年以上50年未満＋公正証書。"}, {"id": "Q008", "point": "建物譲渡特約付借地権", "question": "建物譲渡特約付借地権は、借地権設定後30年以上を経過した日に建物を地主へ譲渡する旨を定めることができる。", "answer": true, "explanation": "設定後30年以上経過した日に建物を地主へ譲渡し、借地権を消滅させる制度です。", "memory": "建物譲渡特約付＝30年以上。"}, {"id": "Q009", "point": "借地権の対抗要件", "question": "借地権者は、借地権の登記がなくても、借地上に自己名義で登記された建物を所有していれば、原則として第三者に借地権を対抗できる。", "answer": true, "explanation": "借地権は、借地上の登記ある建物によって第三者に対抗できる場合があります。", "memory": "借地権＝建物登記で対抗。"}, {"id": "Q010", "point": "借地権の譲渡", "question": "借地人が借地権を第三者へ譲渡する場合、地主の承諾が得られなくても、一定の場合には裁判所の許可を地主の承諾に代えることができる。", "answer": true, "explanation": "地主に不利となるおそれがない等の要件を満たせば、裁判所の許可を承諾に代える制度があります。", "memory": "借地権譲渡＝裁判所許可で承諾代替あり。"}, {"id": "Q011", "point": "普通借家の期間", "question": "普通建物賃貸借について1年未満の期間を定めた場合、その期間は1年に延長される。", "answer": false, "explanation": "1年未満の普通建物賃貸借は、期間の定めのない賃貸借とみなされます。", "memory": "普通借家1年未満＝期間の定めなし。"}, {"id": "Q012", "point": "建物賃貸借の対抗力", "question": "建物の賃借人は、建物の引渡しを受ければ、賃借権の登記がなくても、その後建物を取得した者に賃借権を対抗できる。", "answer": true, "explanation": "建物賃貸借は建物の引渡しが対抗要件です。", "memory": "借家＝引渡しで対抗。"}, {"id": "Q013", "point": "普通借家の法定更新", "question": "普通建物賃貸借が法定更新された場合、更新後も従前と同じ期間の定めがある賃貸借となる。", "answer": false, "explanation": "法定更新後は、原則として期間の定めのない賃貸借となります。", "memory": "借家の法定更新＝期間の定めなし。"}, {"id": "Q014", "point": "賃貸人からの更新拒絶", "question": "普通建物賃貸借で賃貸人が更新を拒絶するには、正当事由が必要である。", "answer": true, "explanation": "賃貸人からの更新拒絶・解約申入れには正当事由が必要です。", "memory": "普通借家の更新拒絶＝正当事由。"}, {"id": "Q015", "point": "定期建物賃貸借", "question": "定期建物賃貸借では、契約を書面等でするだけで足り、賃貸人から『更新がなく期間満了で終了する』旨を事前に説明する必要はない。", "answer": false, "explanation": "定期建物賃貸借では、一定の方式による契約に加え、更新がなく期間満了で終了する旨の事前説明が必要です。", "memory": "定期借家＝契約書＋事前説明。"}, {"id": "Q016", "point": "定期借家の方式", "question": "定期建物賃貸借は、公正証書でなければ有効に成立しない。", "answer": false, "explanation": "定期建物賃貸借は書面等による必要がありますが、公正証書限定ではありません。", "memory": "定期借家＝公正証書限定ではない。"}, {"id": "Q017", "point": "定期借家の中途解約", "question": "床面積200㎡未満の居住用定期建物賃貸借で、転勤・療養・親族の介護などやむを得ない事情により生活の本拠として使用することが困難になった場合、賃借人は一定の場合に中途解約できる。", "answer": true, "explanation": "200㎡未満の居住用定期借家には、やむを得ない事情による中途解約制度があります。", "memory": "居住用200㎡未満＋やむを得ない事情＝中途解約可。"}, {"id": "Q018", "point": "賃料増減請求", "question": "普通建物賃貸借で『賃料を今後一切減額しない』という特約を設ければ、賃借人は常に賃料減額請求をすることができなくなる。", "answer": false, "explanation": "普通借家では、賃料減額請求権を借主に不利に完全排除することはできません。", "memory": "普通借家＝不減額特約で減額請求を完全排除できない。"}, {"id": "Q019", "point": "造作買取請求権", "question": "建物賃借人が賃貸人の同意を得て建物に付加した造作については、賃貸借終了時に一定の場合、賃貸人へ造作買取請求をすることができる。", "answer": true, "explanation": "造作買取請求権が認められる場合があります。特約で排除できる点にも注意が必要です。", "memory": "造作買取請求＝一定の場合あり、特約排除可。"}, {"id": "Q020", "point": "建物買取請求権", "question": "借地人の賃料不払いなど債務不履行を理由として借地契約が解除された場合でも、借地人は常に地主に建物買取請求をすることができる。", "answer": false, "explanation": "借地人の債務不履行による解除の場合、建物買取請求権は原則として認められません。", "memory": "債務不履行解除＝建物買取請求は原則不可。"}, {"id": "Q021", "point": "普通借家の更新通知", "question": "期間の定めがある普通建物賃貸借では、原則として期間満了の1年前から6か月前までの間に更新しない旨等の通知をしなければ、従前と同一条件で更新したものとみなされる。", "answer": true, "explanation": "普通建物賃貸借の更新通知は、原則として満了の1年前から6か月前までの間に行います。更新後の期間は定めがないものとなります。", "memory": "普通借家の更新通知＝満了1年前～6か月前。"}, {"id": "Q022", "point": "賃貸人の解約申入れ", "question": "期間の定めのない建物賃貸借について、賃貸人が解約を申し入れた場合、原則として申入れの日から6か月を経過すると終了する。", "answer": true, "explanation": "賃貸人からの解約申入れでは6か月が基本です。ただし正当事由が必要です。", "memory": "貸主の解約申入れ＝6か月＋正当事由。"}, {"id": "Q023", "point": "正当事由", "question": "建物賃貸人による更新拒絶や解約申入れには、正当事由が必要である。", "answer": true, "explanation": "双方の建物使用の必要性、従前の経過、利用状況、建物の現況、立退料の申出などを考慮して判断されます。", "memory": "普通借家の貸主側終了＝正当事由。"}, {"id": "Q024", "point": "定期借家の説明欠缺", "question": "定期建物賃貸借で法定の事前説明をしなかった場合でも、契約書に『更新なし』と書いてあれば、その定めは有効である。", "answer": false, "explanation": "法定の事前説明をしなかった場合、更新がない旨の定めは無効です。", "memory": "定期借家＝説明なしなら更新なし特約は無効。"}, {"id": "Q025", "point": "定期借家の終了通知", "question": "期間1年以上の定期建物賃貸借では、賃貸人は原則として期間満了の1年前から6か月前までの間に終了通知をしなければ、その終了を賃借人に対抗できない。", "answer": true, "explanation": "期間1年以上の定期借家では、終了通知が必要です。", "memory": "定期借家1年以上＝満了1年前～6か月前に通知。"}, {"id": "Q026", "point": "定期借家1年未満", "question": "定期建物賃貸借では、1年未満の期間を定めることはできない。", "answer": false, "explanation": "定期建物賃貸借には、普通借家の『1年未満＝期間の定めなし』の規定は適用されないため、1年未満でも設定できます。", "memory": "定期借家＝1年未満でも設定可。"}, {"id": "Q027", "point": "借賃増減請求権", "question": "建物の借賃が経済事情の変動等により不相当となった場合、当事者は原則として将来に向かって借賃の増減を請求できる。", "answer": true, "explanation": "税負担、価格変動、近傍同種の賃料などとの比較で不相当となった場合に、将来に向かって増減請求できます。", "memory": "借賃増減＝将来に向かって請求。"}, {"id": "Q028", "point": "建物買取請求権", "question": "普通借地権の存続期間が満了し、契約の更新がない場合、借地権者は原則として地主に建物等を時価で買い取るよう請求できる。", "answer": true, "explanation": "期間満了・更新なしの場合に建物買取請求権が認められます。", "memory": "期間満了＋更新なし＝建物買取請求。"}, {"id": "Q029", "point": "第三者の建物買取請求", "question": "借地上の建物を取得した第三者について、地主が土地賃借権の譲渡を承諾しない場合、その第三者は一定の場合に地主へ建物等の買取りを請求できる。", "answer": true, "explanation": "借地借家法上、第三者の建物買取請求権が認められる場合があります。", "memory": "建物取得第三者＋譲渡不承諾＝買取請求あり。"}, {"id": "Q030", "point": "総合整理", "question": "宅建では、借地は『30→20→10、一般定期50年以上、事業用10年以上50年未満』、借家は『引渡しで対抗、正当事由、定期借家の書面等＋事前説明』を軸に整理するとよい。", "answer": true, "explanation": "数字・対抗要件・更新・終了要件を分けて整理すると得点しやすくなります。", "memory": "借地＝数字、借家＝引渡し・正当事由・定期借家方式。"}];
const KEY="takken_iphone_shakuchishakka30_v1", CHAT_KEY="takken_explanation_chat_url";
let st={active:false,mode:"normal",order:"random",round:1,queue:[],retry:[],idx:0,c:0,w:0,answered:false,streak:{},wrongHist:{}};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(st));localStorage.setItem(CHAT_KEY,$("chatUrl").value.trim())}
function load(){let s=localStorage.getItem(KEY);if(s)try{st=JSON.parse(s)}catch(e){}$("chatUrl").value=localStorage.getItem(CHAT_KEY)||""}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(wrongOnly){let arr=wrongOnly?Q.filter(q=>st.wrongHist[q.id]):Q;if(!arr.length){alert("誤答履歴がありません。");return}st={...st,active:true,mode:$("mode").value,order:$("order").value,round:1,idx:0,c:0,w:0,answered:false,retry:[],streak:st.streak||{},wrongHist:st.wrongHist||{}};st.queue=arr.map(q=>q.id);if(st.order==="random")st.queue=shuffle(st.queue);save();showQuiz();render()}
function resume(){load();if(!st.active||!st.queue.length){alert("再開データがありません。");return}showQuiz();render()}
function showQuiz(){$("menu").classList.add("hidden");$("done").classList.add("hidden");$("quiz").classList.remove("hidden");$("answerDock").classList.remove("hidden")}
function current(){return Q.find(q=>q.id===st.queue[st.idx])}
function render(){let q=current();if(!q){finish();return}st.answered=false;$("qid").textContent=q.id;$("point").textContent=q.point;$("round").textContent=`第${st.round}周`;$("remaining").textContent=st.queue.length-st.idx;$("correct").textContent=st.c;$("wrong").textContent=st.w;$("question").textContent=q.question;$("bar").style.width=(st.idx/st.queue.length*100)+"%";$("result").className="result";$("actions").className="actions";$("answerDock").classList.remove("hidden");save();window.scrollTo({top:0,behavior:"smooth"})}
function answer(a){if(st.answered)return;st.answered=true;let q=current(),ok=a===q.answer;if(ok){st.c++;st.streak[q.id]=(st.streak[q.id]||0)+1}else{st.w++;st.streak[q.id]=0;st.wrongHist[q.id]=true}let mastered=ok&&(st.mode==="normal"||st.streak[q.id]>=2);if(!mastered)st.retry.push(q.id);$("result").className="result "+(ok?"ok":"ng");$("resultTitle").textContent=ok?"正解です":"不正解です";$("correctAnswer").textContent=q.answer?"○":"×";$("explanation").innerHTML="<br><b>解説：</b>"+q.explanation;$("memory").textContent="覚える一言： "+q.memory;$("actions").className="actions show";$("answerDock").classList.add("hidden");save();$("result").scrollIntoView({behavior:"smooth",block:"center"})}
function next(){st.idx++;if(st.idx>=st.queue.length)finish();else render()}
function finish(){if(st.retry.length){st.round++;st.queue=st.order==="random"?shuffle([...new Set(st.retry)]):[...new Set(st.retry)].sort();st.retry=[];st.idx=0;render();return}st.active=false;save();$("quiz").classList.add("hidden");$("answerDock").classList.add("hidden");$("done").classList.remove("hidden");$("doneText").textContent=`正解${st.c}回、不正解${st.w}回、第${st.round}周で完了しました。`}
function backMenu(){$("done").classList.add("hidden");$("quiz").classList.add("hidden");$("answerDock").classList.add("hidden");$("menu").classList.remove("hidden");load()}
function toggleHelp(){$("help").classList.toggle("hidden")}
async function openChat(){let q=current(),url=$("chatUrl").value.trim()||localStorage.getItem(CHAT_KEY)||"";if(!url){alert("先にチャットURLを登録してください。");return}let p=`次の宅建一問一答を詳しく解説してください。借地借家法の数字、普通借地・定期借地、普通借家・定期借家、対抗要件、更新、正当事由のひっかけを重点的に説明してください。\n\n【問題】${q.question}\n【正解】${q.answer?"○":"×"}\n【教材解説】${q.explanation}\n【覚える一言】${q.memory}`;try{await navigator.clipboard.writeText(p);window.open(url,"_blank")}catch(e){alert("コピーできませんでした。Safariの設定をご確認ください。")}}
function resetAll(){if(!confirm("進捗をすべて削除しますか？"))return;localStorage.removeItem(KEY);st={active:false,mode:"normal",order:"random",round:1,queue:[],retry:[],idx:0,c:0,w:0,answered:false,streak:{},wrongHist:{}};alert("リセットしました。")}
load();
</script>
