<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.sub{font-size:13px;color:#687386;line-height:1.6}
.banner{background:#fff8dd;border:1px solid #f0dd9a;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.65}
.card{background:#fff;border:1px solid #dce3ed;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 3px 12px rgba(20,35,60,.05)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}

.subject{text-align:left;background:#fff;border:1px solid #dce3ed;border-radius:18px;padding:18px;min-height:112px;box-shadow:0 3px 12px rgba(20,35,60,.05)}
.subject .num{font-size:12px;color:#2457d6;font-weight:800} .subject .name{font-size:22px;font-weight:850;margin-top:3px}
.subject small{display:block;color:#687386;font-size:12px;margin-top:8px;line-height:1.5}
.topic{text-align:left;background:#fff;border:1px solid #dce3ed;border-radius:15px;padding:13px;min-height:82px;font-weight:800}
.topic small{display:block;color:#687386;font-size:11px;font-weight:500;margin-top:5px}
.done{color:#16813c!important;font-weight:800!important}
button{font:inherit;font-weight:750;border:0;border-radius:14px;min-height:48px;padding:11px 14px}
.primary{background:#2457d6;color:#fff} .soft{background:#eaf0fc;color:#214785} .danger{background:#fff0f0;color:#9b2525}
.row{display:flex;gap:9px;flex-wrap:wrap}
label{display:block;font-size:13px;font-weight:750;margin:12px 0 6px}
select,input{width:100%;font-size:16px;padding:13px;border:1px solid #bec8d6;border-radius:12px;background:#fff}
.hidden{display:none!important}
.meta{display:flex;gap:7px;flex-wrap:wrap} .pill{font-size:12px;background:#eef2f7;padding:5px 8px;border-radius:999px}
.stats{display:flex;justify-content:space-between;font-size:13px;color:#687386;margin-top:10px}
.progress{height:8px;background:#e7ebf1;border-radius:999px;overflow:hidden;margin-top:10px} #bar{height:100%;background:#2457d6}
#question{font-size:22px;line-height:1.65;font-weight:800;margin:18px 0 132px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(244,247,251,.95);border-top:1px solid #dce3ed;z-index:10}

.result{display:none;margin-top:12px;border-radius:14px;padding:14px;line-height:1.65}
.result.ok{display:block;background:#effaf3;border:1px solid #9ad2ae} .result.ng{display:block;background:#fff2f2;border:1px solid #e5a2a2}
.actions{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px} .actions.show{display:grid}

<body>
<div class="app">
  <h1>宅建 一問一答</h1>
  <div class="sub">宅建業法 → 権利関係 → 法令上の制限 の順に選択できます。</div>
  <div class="banner"><b>令和8年度（2026年度）対策</b><br>2026年4月1日現在施行の法令・制度を前提に作成。<b>iPhoneでサブフォルダが開かない問題を避けるため、915問すべてを1つの index.html に内蔵しています。</b></div>

  <section id="subjectHome" class="card">
    <h2>1. 分野を選択</h2>
    <div class="subjectGrid">
      <button class="subject" onclick="openSubject('宅建業法')"><div class="num">1</div><div class="name">宅建業法</div><small>11分野・165問</small></button>
      <button class="subject" onclick="openSubject('権利関係')"><div class="num">2</div><div class="name">権利関係</div><small>18分野・540問</small></button>
      <button class="subject" onclick="openSubject('法令上の制限')"><div class="num">3</div><div class="name">法令上の制限</div><small>7分野・210問</small></button>
    </div>
    <div class="row" style="margin-top:14px"><button class="soft" onclick="showSettings()">共通設定</button><button class="danger" onclick="resetAll()">全進捗リセット</button></div>
  </section>

  <section id="topicHome" class="card hidden">
    <div class="breadcrumb" id="crumb"></div><h2 id="subjectTitle"></h2><div id="topicGrid" class="grid"></div>
    <div class="row" style="margin-top:14px"><button class="soft" onclick="backSubjects()">← 3分野へ戻る</button></div>
  </section>

  <section id="settings" class="card hidden">
    <h2>共通設定</h2>
    <label>習得モード</label><select id="mode"><option value="normal">通常：1回正解で習得</option><option value="strict">徹底：2回連続正解で習得</option></select>
    <label>問題順</label><select id="order"><option value="random">ランダム</option><option value="id">問題番号順</option></select>
    <label>宅建解説チャットURL</label><input id="chatUrl" placeholder="固定で使うChatGPTチャットURL">
    <div class="row" style="margin-top:14px"><button class="primary" onclick="saveSettings()">保存して戻る</button></div>
  </section>

  <section id="topicMenu" class="card hidden">
    <div class="breadcrumb" id="topicCrumb"></div><h2 id="topicTitle"></h2>
    <div class="row"><button class="primary" onclick="start(false)">開始</button><button class="soft" onclick="resume()">続きから</button><button class="soft" onclick="start(true)">誤答だけ</button><button class="soft" onclick="backTopics()">← 問題選択へ</button></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="meta"><span class="pill" id="qid"></span><span class="pill" id="qsubject"></span><span class="pill" id="qtopic"></span><span class="pill" id="point"></span><span class="pill" id="round"></span></div>
    <div class="stats"><span>残り <b id="remaining"></b></span><span>正解 <b id="correct"></b></span><span>不正解 <b id="wrong"></b></span></div>
    <div class="progress"><div id="bar"></div></div><div id="question"></div>
    <div id="result" class="result"><h2 id="resultTitle"></h2><div><b>正解：</b><span id="correctAnswer"></span></div><div id="explanation"></div><div id="memory" style="font-weight:800;margin-top:8px"></div></div>
    <div id="actions" class="actions"><button class="soft" onclick="openChat()">詳しい解説</button><button class="primary" onclick="next()">次へ</button></div>
  </section>

  <section id="done" class="card hidden">
    <h2 id="doneTitle"></h2><p id="doneText"></p>
    <div class="row"><button class="primary" onclick="backTopics()">問題選択へ</button><button class="soft" onclick="backSubjects()">3分野へ</button></div>
  </section>
</div>

<div id="dock" class="dock hidden"><div class="dockin"><button class="ans yes" onclick="answer(true)">○</button><button class="ans no" onclick="answer(false)">×</button></div></div>

<script>
const DATA={"宅建業法":{"宅建業法の基本":[{"point":"宅建業の範囲","question":"自ら宅地・建物を反復継続して売買する行為は、宅地建物取引業に含まれる。","answer":true,"explanation":"自己所有物件でも業として売買すれば宅建業です。","memory":"自ら売買＝宅建業"},{"point":"自己賃貸","question":"自ら所有する建物を賃貸する行為は、宅地建物取引業に含まれる。","answer":false,"explanation":"自己賃貸は宅建業に含まれません。","memory":"自ら貸す＝宅建業ではない"},{"point":"媒介","question":"他人の宅地・建物の売買を反復継続して媒介する行為は、宅地建物取引業に含まれる。","answer":true,"explanation":"売買等の媒介は宅建業です。","memory":"媒介＝宅建業"},{"point":"貸借の媒介","question":"建物賃貸借の媒介を業として行うには、宅建業免許が必要である。","answer":true,"explanation":"貸借の媒介・代理は宅建業です。","memory":"貸借媒介＝免許必要"},{"point":"自己交換","question":"自ら宅地を反復継続して交換する行為は、宅建業に含まれる。","answer":true,"explanation":"自己の売買・交換は宅建業です。","memory":"自ら交換＝宅建業"},{"point":"業として","question":"宅地建物取引業に当たるかは、不特定多数への継続・反復性などを総合して判断する。","answer":true,"explanation":"単発処分か事業としての取引かを社会通念上判断します。","memory":"業＝不特定多数＋継続反復"},{"point":"用途地域内","question":"用途地域内の土地は、道路・公園等の例外を除き、宅建業法上の宅地に含まれる。","answer":true,"explanation":"用途地域内は原則宅地です。","memory":"用途地域内＝原則宅地"},{"point":"建物敷地目的","question":"現在更地でも、建物の敷地に供する目的で取引される土地は宅地に含まれ得る。","answer":true,"explanation":"現況だけでなく目的も見ます。","memory":"建物敷地目的＝宅地"},{"point":"単発農地","question":"都市計画区域外の農地を農地のまま一度だけ売却する行為は、当然に宅建業に当たる。","answer":false,"explanation":"単発処分で宅地にも当たらなければ通常宅建業ではありません。","memory":"農地＋単発＝当然宅建業ではない"},{"point":"免許主義","question":"宅地建物取引業を営むには、原則として宅建業法上の免許が必要である。","answer":true,"explanation":"宅建業は免許制です。","memory":"宅建業＝免許制"},{"point":"国等","question":"国や地方公共団体が行う宅地建物の取引には、宅建業法の免許規定が適用されない。","answer":true,"explanation":"国・地方公共団体には免許規定が適用されません。","memory":"国・地方公共団体＝免許不要"},{"point":"信託会社等","question":"信託会社等には宅建業法上の特例がある。","answer":true,"explanation":"一般業者と異なる特例があります。","memory":"信託会社等＝特例あり"},{"point":"無免許営業","question":"免許を受けていない者が宅建業を営むことはできない。","answer":true,"explanation":"無免許営業は禁止です。","memory":"無免許営業＝禁止"},{"point":"名義貸し","question":"宅建業者が自己の名義を他人に貸して宅建業を営ませることは許されない。","answer":true,"explanation":"名義貸しは禁止です。","memory":"名義貸し＝禁止"},{"point":"取引態様","question":"宅建業者は広告時等に、自ら売主・代理・媒介の別を明示すべき場面がある。","answer":true,"explanation":"取引態様の明示義務があります。","memory":"取引態様＝明示"}],"免許":[{"point":"免許権者","question":"2以上の都道府県に事務所を設置する宅建業者は、国土交通大臣免許を受ける。","answer":true,"explanation":"複数都道府県なら大臣免許です。","memory":"複数都道府県＝大臣"},{"point":"知事免許","question":"1都道府県内だけに事務所を設置する宅建業者は、都道府県知事免許を受ける。","answer":true,"explanation":"1都道府県内なら知事免許です。","memory":"1都道府県内＝知事"},{"point":"有効期間","question":"宅建業免許の有効期間は5年である。","answer":true,"explanation":"現行の有効期間は5年です。","memory":"免許＝5年"},{"point":"更新","question":"有効期間満了後も営業を続けるには更新手続が必要である。","answer":true,"explanation":"自動更新ではありません。","memory":"営業継続＝更新"},{"point":"取消後欠格","question":"一定の重大違反で免許取消処分を受けた者は、一定期間免許を受けられない場合がある。","answer":true,"explanation":"典型的に5年間の欠格期間が問題になります。","memory":"免許取消し＝欠格期間"},{"point":"刑罰","question":"一定の刑に処せられた者は、一定期間免許を受けられない場合がある。","answer":true,"explanation":"刑の種類と経過期間を確認します。","memory":"刑罰＝欠格に注意"},{"point":"破産","question":"破産者で復権を得ない者は欠格事由となる。","answer":true,"explanation":"未復権の破産者は欠格です。","memory":"未復権破産者＝欠格"},{"point":"専任宅建士不足","question":"必要数の専任宅建士を置いていないことは免許を受けられない理由となり得る。","answer":true,"explanation":"専任宅建士は免許要件です。","memory":"専任不足＝免許不可"},{"point":"死亡承継","question":"個人宅建業者が死亡した場合、その免許は相続人に当然承継される。","answer":false,"explanation":"免許は当然承継されません。","memory":"免許＝当然承継なし"},{"point":"合併承継","question":"法人が合併で消滅した場合、免許は存続会社へ当然移転する。","answer":false,"explanation":"免許は当然承継されません。","memory":"合併でも自動承継なし"},{"point":"変更届","question":"商号や事務所所在地等の免許申請事項に変更があれば変更届が必要となる。","answer":true,"explanation":"変更事項は届出対象です。","memory":"免許事項変更＝届出"},{"point":"廃業","question":"宅建業を廃止した場合は免許権者への届出が必要である。","answer":true,"explanation":"廃業等の届出制度があります。","memory":"廃業＝届出"},{"point":"免許換え","question":"知事免許業者が他都道府県にも事務所を設ける場合、免許換えが必要となる。","answer":true,"explanation":"免許権者が変わります。","memory":"他県進出＝免許換え"},{"point":"大臣から知事","question":"大臣免許業者が事務所を1都道府県内だけにした場合、知事免許への免許換えが問題となる。","answer":true,"explanation":"事務所範囲に応じて免許権者が変わります。","memory":"大臣→1県＝知事"},{"point":"契約効力","question":"無免許営業であったことだけを理由に、締結した売買契約が当然無効になるとは限らない。","answer":true,"explanation":"行政法違反と私法上の効力は別です。","memory":"無免許≠契約当然無効"}],"宅地建物取引士":[{"point":"資格成 const KEY="takken_integrated_915_v2",SETKEY="takken_integrated_settings_v2";
let st={subject:null,topic:null,active:false,round:1,queue:[],retry:[],idx:0,c:0,w:0,answered:false,streak:{},wrongHist:{},completed:{}};
let cfg={mode:"normal",order:"random",chatUrl:""};
const $=id=>document.getElementById(id);
function load(){try{let a=localStorage.getItem(KEY);if(a)st=JSON.parse(a)}catch(e){}try{let b=localStorage.getItem(SETKEY);if(b)cfg=JSON.parse(b)}catch(e){}$("mode").value=cfg.mode;$("order").value=cfg.order;$("chatUrl").value=cfg.chatUrl||""}
function save(){localStorage.setItem(KEY,JSON.stringify(st));localStorage.setItem(SETKEY,JSON.stringify(cfg))}
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function hideAll(){["subjectHome","topicHome","settings","topicMenu","quiz","done"].forEach(x=>$(x).classList.add("hidden"));$("dock").classList.add("hidden")}
function openSubject(subject){st.subject=subject;st.topic=null;save();hideAll();$("subjectTitle").textContent=subject+"：問題を選択";$("crumb").textContent="宅建 一問一答 ＞ "+subject;const bank=DATA[subject];$("topicGrid").innerHTML=Object.keys(bank).map(t=>{const key=subject+"|"+t;return `<button class="topic" data-topic="${t}">${t}<small>${bank[t].length}問</small>${st.completed[key]?'<small class="done">✓ 習得完了</small>':''}</button>`}).join("");document.querySelectorAll("#topicGrid .topic").forEach(b=>b.addEventListener("click",()=>openTopic(b.dataset.topic)));$("topicHome").classList.remove("hidden")}
function openTopic(topic){st.topic=topic;save();hideAll();$("topicCrumb").textContent="宅建 一問一答 ＞ "+st.subject+" ＞ "+topic;$("topicTitle").textContent=topic+" "+DATA[st.subject][topic].length+"問";$("topicMenu").classList.remove("hidden")}
function backSubjects(){hideAll();$("subjectHome").classList.remove("hidden")}
function backTopics(){openSubject(st.subject)}
function showSettings(){hideAll();$("settings").classList.remove("hidden")}
function saveSettings(){cfg.mode=$("mode").value;cfg.order=$("order").value;cfg.chatUrl=$("chatUrl").value.trim();save();backSubjects()}
function start(wrongOnly){let arr=DATA[st.subject][st.topic];if(wrongOnly)arr=arr.filter(q=>st.wrongHist[st.subject+"|"+st.topic+"|"+q.id]);if(!arr.length){alert("この分野の誤答履歴はありません。");return}st.active=true;st.round=1;st.idx=0;st.c=0;st.w=0;st.answered=false;st.retry=[];st.queue=arr.map(q=>q.id);if(cfg.order==="random")st.queue=sh(st.queue);save();showQuiz();render()}
function resume(){if(!st.active||!st.subject||!st.topic||!st.queue.length){alert("再開できる途中データがありません。");return}showQuiz();render()}
function showQuiz(){hideAll();$("quiz").classList.remove("hidden");$("dock").classList.remove("hidden")}
function current(){return DATA[st.subject][st.topic].find(q=>q.id===st.queue[st.idx])}
function render(){let q=current();if(!q){finish();return}st.answered=false;$("qid").textContent=q.id;$("qsubject").textContent=st.subject;$("qtopic").textContent=st.topic;$("point").textContent=q.point;$("round").textContent=`第${st.round}周`;$("remaining").textContent=st.queue.length-st.idx;$("correct").textContent=st.c;$("wrong").textContent=st.w;$("question").textContent=q.question;$("bar").style.width=(st.idx/st.queue.length*100)+"%";$("result").className="result";$("actions").className="actions";$("dock").classList.remove("hidden");save();window.scrollTo({top:0,behavior:"smooth"})}
function answer(a){if(st.answered)return;st.answered=true;let q=current(),ok=a===q.answer,key=st.subject+"|"+st.topic+"|"+q.id;if(ok){st.c++;st.streak[key]=(st.streak[key]||0)+1}else{st.w++;st.streak[key]=0;st.wrongHist[key]=true}let mastered=ok&&(cfg.mode==="normal"||st.streak[key]>=2);if(!mastered)st.retry.push(q.id);$("result").className="result "+(ok?"ok":"ng");$("resultTitle").textContent=ok?"正解です":"不正解です";$("correctAnswer").textContent=q.answer?"○":"×";$("explanation").innerHTML="<br><b>解説：</b>"+q.explanation;$("memory").textContent="試験で覚える一言： "+q.memory;$("actions").className="actions show";$("dock").classList.add("hidden");save();$("result").scrollIntoView({behavior:"smooth",block:"center"})}
function next(){st.idx++;if(st.idx>=st.queue.length)finish();else render()}
function finish(){if(st.retry.length){st.round++;st.queue=cfg.order==="random"?sh([...new Set(st.retry)]):[...new Set(st.retry)].sort();st.retry=[];st.idx=0;render();return}st.active=false;st.completed[st.subject+"|"+st.topic]=true;save();hideAll();$("doneTitle").textContent=st.subject+" ＞ "+st.topic+"・習得完了";$("doneText").textContent=`正解 ${st.c} 回、不正解 ${st.w} 回、第 ${st.round} 周で完了しました。`;$("done").classList.remove("hidden")}
async function openChat(){let q=current();if(!cfg.chatUrl){alert("共通設定で宅建解説チャットURLを登録してください。");return}let p=`次の宅建一問一答を令和8年度宅建試験（2026年4月1日現在施行法令）を前提に詳しく解説してください。\n\n【大分野】${st.subject}\n【分野】${st.topic}\n【論点】${q.point}\n【問題】${q.question}\n【正解】${q.answer?"○":"×"}\n【教材解説】${q.explanation}`;try{await navigator.clipboard.writeText(p);window.open(cfg.chatUrl,"_blank")}catch(e){alert("問題文のコピーに失敗しました。")}}
function resetAll(){if(!confirm("3分野すべての進捗・誤答履歴を削除しますか？"))return;localStorage.removeItem(KEY);st={subject:null,topic:null,active:false,round:1,queue:[],retry:[],idx:0,c:0,w:0,answered:false,streak:{},wrongHist:{},completed:{}};save();backSubjects()}
load();backSubjects();
</script>
