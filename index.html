<html lang="ja">
<head>

<title>宅建 短期攻略 3分野300問</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}.app{max-width:780px;margin:auto;padding:14px 14px 36px}
h1{font-size:25px;margin:6px 0 2px}h2{margin:4px 0 12px}h3{margin:18px 0 9px}.sub{font-size:13px;color:#687386;line-height:1.6}
.banner{background:#fff8dd;border:1px solid #f0dd9a;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.65}
.card{background:#fff;border:1px solid #dce3ed;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 3px 12px rgba(20,35,60,.05)}
.subject-grid{display:grid;grid-template-columns:1fr;gap:12px}.subject{text-align:left;background:#fff;border:1px solid #dce3ed;border-radius:18px;padding:18px;min-height:102px}
.subject b{font-size:20px}.subject small{display:block;color:#687386;font-size:12px;font-weight:500;margin-top:6px;line-height:1.5}.subject .count{display:inline-block;margin-top:8px;background:#eef2f7;padding:4px 8px;border-radius:999px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.topic{text-align:left;background:#fff;border:1px solid #dce3ed;border-radius:15px;padding:13px;min-height:88px;font-weight:800}
.topic small{display:block;color:#687386;font-size:11px;font-weight:500;margin-top:5px}button{font:inherit;font-weight:750;border:0;border-radius:14px;min-height:48px;padding:11px 14px;cursor:pointer}
.primary{background:#2457d6;color:#fff}.soft{background:#eaf0fc;color:#214785}.warnb{background:#fff5d6;color:#785c00}.danger{background:#fff0f0;color:#9b2525}.gray{background:#eef1f5;color:#42516a}
.row{display:flex;gap:9px;flex-wrap:wrap}label{font-size:13px;font-weight:750}select{font-size:16px;padding:11px;border:1px solid #bec8d6;border-radius:12px;background:#fff}
.hidden{display:none!important}.meta{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:12px;background:#eef2f7;padding:5px 8px;border-radius:999px}.pill.A{background:#fff2cc}
.stats{display:flex;justify-content:space-between;font-size:13px;color:#687386;margin-top:10px}.progress{height:8px;background:#e7ebf1;border-radius:999px;overflow:hidden;margin-top:10px}#bar{height:100%;background:#2457d6}
#question{font-size:22px;line-height:1.65;font-weight:800;margin:18px 0 135px;white-space:pre-wrap}.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(244,247,251,.96);border-top:1px solid #dce3ed;z-index:10}
.dockin{max-width:752px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{min-height:68px;font-size:28px;border:2px solid}.yes{background:#effaf3;color:#146b38;border-color:#9ad2ae}.no{background:#fff2f2;color:#922020;border-color:#e5a2a2}
.result{display:none;margin-top:12px;border-radius:14px;padding:14px;line-height:1.7}.result.ok{display:block;background:#effaf3;border:1px solid #9ad2ae}.result.ng{display:block;background:#fff2f2;border:1px solid #e5a2a2}
.actions{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions.show{display:grid}.src{font-size:12px;color:#687386;margin-top:10px;line-height:1.55}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.topline button{min-height:38px;padding:7px 10px;font-size:13px}
@media(min-width:700px){.subject-grid{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<div class="topline"><div><h1>宅建 短期攻略</h1><div class="sub">3分野・合計300問／iPhone対応</div></div></div>
<div class="banner"><b>短期攻略の使い方</b><br>各分野で「★最優先」→「全100問」→「誤答だけ」の順がおすすめです。<br>同じ周回で同じ問題は繰り返しません。</div>

<section id="subjects" class="card"><h2>分野を選択</h2><div id="subjectGrid" class="subject-grid"></div></section>

<section id="subjectMenu" class="card hidden">
<div class="topline"><h2 id="subjectTitle"></h2><button class="gray" onclick="showSubjects()">3分野へ</button></div>
<div class="row" style="margin-bottom:12px">
<button class="primary" id="aBtn" onclick="startSubjectMode('A')">★ 最優先</button>
<button class="soft" onclick="startSubjectMode('ALL')">全100問</button>
<button class="warnb" onclick="startWrongSubject()">誤答だけ</button>
</div>
<h3>分野別</h3><div id="categoryGrid" class="grid"></div>
<div class="row" style="margin-top:14px"><label>順番 <select id="order"><option value="random">ランダム</option><option value="id">番号順</option></select></label><button class="danger" onclick="resetSubject()">この分野の進捗リセット</button></div>
</section>

<section id="quiz" class="card hidden">
<div class="topline"><div class="meta"><span class="pill" id="qid"></span><span class="pill" id="priority"></span><span class="pill" id="subj"></span><span class="pill" id="cat"></span><span class="pill" id="point"></span></div><button class="gray" onclick="backSubject()">分野メニュー</button></div>
<div class="stats"><span>残り <b id="remaining"></b></span><span>正解 <b id="correct"></b></span><span>不正解 <b id="wrong"></b></span></div>
<div class="progress"><div id="bar"></div></div><div id="question"></div>
<div id="result" class="result"><h2 id="rt"></h2><div><b>正解：</b><span id="ca"></span></div><div id="ex"></div><div id="mem" style="font-weight:800;margin-top:8px"></div><div id="src" class="src"></div></div>
<div id="actions" class="actions"><button class="soft" onclick="backSubject()">分野メニュー</button><button class="primary" onclick="next()">次へ</button></div>
</section>

<section id="done" class="card hidden"><h2>1周完了</h2><p id="doneText"></p><div class="row"><button class="primary" onclick="backSubject()">分野メニュー</button><button class="warnb" onclick="startWrongSubject()">誤答だけ復習</button><button class="gray" onclick="showSubjects()">3分野へ</button></div></section>
</div>

<div id="dock" class="dock hidden"><div class="dockin"><button class="ans yes" onclick="answer(true)">○</button><button class="ans no" onclick="answer(false)">×</button></div></div>

<script>
const Q=[{"id":"BUS-B01","category":"基本・免許","point":"宅建業の範囲","question":"自己所有の建物を反復継続して他人に賃貸する行為は、宅地建物取引業に該当する。","answer":false,"explanation":"自ら貸主となって宅地・建物を賃貸する行為は、宅建業法上の『宅地建物取引業』には含まれません。売買・交換を自ら行う場合とは区別します。","memory":"自ら貸すだけ＝宅建業ではない。","source":"収集No.270／令和5年 問38 肢ア","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"B01"},{"id":"BUS-B02","category":"基本・免許","point":"免許権者","question":"1つの都道府県内だけに宅建業法上の事務所を置く場合、原則としてその都道府県知事の免許を受ける。","answer":true,"explanation":"事務所が1都道府県内だけなら知事免許、2以上の都道府県にまたがれば国土交通大臣免許です。","memory":"1県＝知事、2県以上＝大臣。","source":"国交省免許制度／収集No.182","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000242.html","subject":"宅建業法","original_id":"B02"},{"id":"BUS-B03","category":"基本・免許","point":"本店の扱い","question":"甲県に本店、乙県に支店があり、宅建業を営むのが乙県の支店だけでも、本店は宅建業法上の事務所と扱われるため国土交通大臣免許が必要となる。","answer":true,"explanation":"支店だけで宅建業を営む場合でも、本店は主たる事務所として扱われます。結果として2都道府県に事務所を有することになります。","memory":"支店だけ営業でも本店を数える。","source":"収集No.182／令和7年 問41 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"B03"},{"id":"BUS-B04","category":"基本・免許","point":"免許有効期間","question":"宅地建物取引業の免許の有効期間は5年間である。","answer":true,"explanation":"免許の有効期間は5年間です。","memory":"免許＝5年。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000242.html","subject":"宅建業法","original_id":"B04"},{"id":"BUS-B05","category":"基本・免許","point":"更新申請","question":"免許の更新申請は、有効期間満了日の90日前から30日前までに行う。","answer":true,"explanation":"引き続き宅建業を営む場合、更新申請は満了日の90日前から30日前までが原則です。","memory":"更新＝90日前～30日前。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000242.html","subject":"宅建業法","original_id":"B05"},{"id":"BUS-B06","category":"基本・免許","point":"更新処分待ち","question":"適法に免許更新を申請したが満了日までに処分がされない場合、従前の免許は満了日に当然失効する。","answer":false,"explanation":"更新申請が適法にされていれば、処分があるまで従前の免許は引き続き効力を有します。","memory":"更新申請済み＝処分まで免許継続。","source":"収集No.152／令和6年 問38 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"B06"},{"id":"BUS-B07","category":"基本・免許","point":"変更届","question":"事務所の所在地など免許申請書の一定の記載事項に変更が生じたときは、原則30日以内に変更の届出を行う。","answer":true,"explanation":"事務所の新設等、一定の変更事項は30日以内の届出が必要です。","memory":"変更届＝30日以内。","source":"収集No.208／令和5年 問32 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"B07"},{"id":"BUS-B08","category":"基本・免許","point":"廃業届","question":"法人が株主総会決議で解散した場合、清算人が解散の日から30日以内に廃業等の届出をする。","answer":true,"explanation":"法人の解散では清算人が30日以内に届出をします。旧役員が60日以内、ではありません。","memory":"法人解散＝清算人・30日。","source":"収集No.87／令和7年 問41 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"B08"},{"id":"BUS-B09","category":"基本・免許","point":"免許の承継","question":"個人の宅建業者が法人化して新会社の代表取締役になれば、その新会社は個人の免許を承継できる。","answer":false,"explanation":"宅建業免許は承継されません。新会社は別途免許を受ける必要があります。","memory":"法人化しても免許は引き継げない。","source":"収集No.218／平成29年 問44 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"B09"},{"id":"BUS-B10","category":"基本・免許","point":"欠格事由","question":"禁錮・拘禁刑など一定の刑に処せられた者は、刑の執行終了等から原則5年を経過しなければ免許の欠格事由から外れない。","answer":true,"explanation":"一定の刑罰を受けた者には5年間の欠格期間があります。法人では役員等の欠格も法人の免許に影響します。","memory":"一定の刑＝原則5年。","source":"収集No.129／令和元年 問43 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"B10"},{"id":"BUS-T01","category":"宅建士・事務所","point":"専任宅建士の人数","question":"事務所では、宅建業に従事する者5人につき1人以上の割合で成年者である専任宅建士を置く。","answer":true,"explanation":"事務所の法定割合は5人に1人以上です。","memory":"事務所＝5人に1人。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.hrr.mlit.go.jp/kensei/sangyo/fudousan/license.html","subject":"宅建業法","original_id":"T01"},{"id":"BUS-T02","category":"宅建士・事務所","point":"案内所の専任宅建士","question":"一団の分譲の案内所で契約締結も申込み受付もしない場合でも、専任宅建士を1人以上置かなければならない。","answer":false,"explanation":"一定の案内所で専任宅建士が必要なのは、契約締結又は契約の申込みを受ける場所などです。","memory":"契約行為なしの案内所＝専任宅建士不要。","source":"収集No.162／令和3年12月 問41 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T02"},{"id":"BUS-T03","category":"宅建士・事務所","point":"35条説明者","question":"35条の重要事項説明を行う宅建士は、その事務所の専任宅建士でなければならない。","answer":false,"explanation":"専任である必要はありません。その宅建業者の業務に従事する宅建士であれば重要事項説明を行えます。","memory":"35条説明＝専任でなくてよい。","source":"収集No.202／令和3年10月 問26 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T03"},{"id":"BUS-T04","category":"宅建士・事務所","point":"35条・37条の記名","question":"35条書面や37条書面に記名する宅建士も、専任宅建士である必要はない。","answer":true,"explanation":"35条書面・37条書面の記名についても、専任性は要求されません。","memory":"記名も専任不要。","source":"収集No.335／平成27年 問29 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T04"},{"id":"BUS-T05","category":"宅建士・事務所","point":"登録の移転","question":"甲県登録の宅建士が乙県の宅建業者の専任宅建士に就任する場合、必ず乙県へ登録を移転しなければならない。","answer":false,"explanation":"登録の移転は可能ですが義務ではありません。勤務先の所在地と登録都道府県が一致している必要はありません。","memory":"登録移転＝できる、義務ではない。","source":"収集No.284／令和4年 問33 肢イ","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T05"},{"id":"BUS-T06","category":"宅建士・事務所","point":"取引士証の有効期間","question":"登録を他県へ移転して新しい宅建士証の交付を受けると、有効期間はその交付日から新たに5年間となる。","answer":false,"explanation":"登録移転に伴う新しい宅建士証の有効期間は、従前の宅建士証の残存期間と同じです。","memory":"登録移転しても有効期限はリセットされない。","source":"収集No.315／平成28年 問38 肢ア","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T06"},{"id":"BUS-T07","category":"宅建士・事務所","point":"法定講習","question":"宅建試験合格から1年を超えて宅建士証の交付を受ける場合、原則として申請前6か月以内の法定講習を受ける。","answer":true,"explanation":"試験合格後1年以内の交付なら法定講習は不要ですが、それを超える場合は原則受講が必要です。","memory":"合格後1年超＝6か月以内講習。","source":"収集No.128／平成29年 問30 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T07"},{"id":"BUS-T08","category":"宅建士・事務所","point":"従業者証明書","question":"宅建士証を携帯している宅建士は、従業者証明書を携帯しなくてもよい。","answer":false,"explanation":"宅建士証と従業者証明書は別物です。宅建士であっても業務従事中は従業者証明書が必要です。","memory":"取引士証≠従業者証明書。","source":"収集No.312／平成25年 問41 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T08"},{"id":"BUS-T09","category":"宅建士・事務所","point":"従業者名簿","question":"一時的に事務の補助のため雇用した者でも宅建業に従事するなら、従業者名簿への記載対象となる。","answer":true,"explanation":"一時的な補助者も、宅建業に従事するなら従業者名簿の対象です。","memory":"短期雇用でも従事者なら名簿へ。","source":"収集No.333／平成29年 問35 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T09"},{"id":"BUS-T10","category":"宅建士・事務所","point":"事務所の掲示・備付け","question":"宅建業者の事務所では標識と報酬額を掲示し、従業者名簿・帳簿を備えるが、免許証そのものの掲示義務はない。","answer":true,"explanation":"免許証の掲示義務はありません。標識には免許証番号等が記載されます。","memory":"事務所＝標識・報酬表・名簿・帳簿。免許証掲示なし。","source":"収集No.183／令和4年 問26 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"T10"},{"id":"BUS-G01","category":"営業保証金・保証協会","point":"営業保証金額","question":"営業保証金は、主たる事務所1,000万円、従たる事務所1か所につき500万円である。","answer":true,"explanation":"営業保証金の基本額です。","memory":"営業保証金＝本店1000・支店500。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.hrr.mlit.go.jp/kensei/sangyo/fudousan/license.html","subject":"宅建業法","original_id":"G01"},{"id":"BUS-G02","category":"営業保証金・保証協会","point":"供託先","question":"営業保証金は本店・支店ごとにそれぞれ最寄りの供託所へ供託する。","answer":false,"explanation":"支店分も含め、主たる事務所の最寄りの供託所にまとめて供託します。","memory":"営業保証金＝本店最寄りにまとめて。","source":"収集No.168／平成24年 問33 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G02"},{"id":"BUS-G03","category":"営業保証金・保証協会","point":"地方債の評価","question":"地方債証券を営業保証金に充てる場合、額面金額の90％で評価される。","answer":true,"explanation":"地方債証券は額面の90％評価です。","memory":"地方債＝90％。","source":"収集No.177／平成24年 問33 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G03"},{"id":"BUS-G04","category":"営業保証金・保証協会","point":"本店移転・金銭のみ","question":"本店移転で最寄り供託所が変わり、営業保証金を金銭のみで供託している場合、従前の供託所に保管替えを請求する。","answer":true,"explanation":"金銭のみなら保管替えです。","memory":"金銭だけ＝保管替え。","source":"収集No.252／令和6年 問27 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G04"},{"id":"BUS-G05","category":"営業保証金・保証協会","point":"本店移転・有価証券あり","question":"営業保証金に有価証券が含まれる場合、本店移転で供託所が変わったときは新供託所に全額を新たに供託し、その後旧供託所から取り戻す。","answer":true,"explanation":"有価証券を含む場合は保管替えができません。","memory":"債券あり＝新供託→旧供託取戻し。","source":"収集No.214・246","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G05"},{"id":"BUS-G06","category":"営業保証金・保証協会","point":"還付対象","question":"家賃収納代行業務によって生じた債権も、営業保証金から還付を受けられる。","answer":false,"explanation":"還付対象は宅建業に関する取引から生じた債権です。家賃収納代行は宅建業ではありません。","memory":"営業保証金の還付＝宅建取引の債権だけ。","source":"収集No.220／平成30年 問43 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G06"},{"id":"BUS-G07","category":"営業保証金・保証協会","point":"保証協会分担金","question":"保証協会の弁済業務保証金分担金は、主たる事務所60万円、従たる事務所1か所につき30万円である。","answer":true,"explanation":"保証協会加入時の基本額です。","memory":"保証協会＝本店60・支店30。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.hrr.mlit.go.jp/kensei/sangyo/fudousan/license.html","subject":"宅建業法","original_id":"G07"},{"id":"BUS-G08","category":"営業保証金・保証協会","point":"分担金の納付方法","question":"宅建業者が保証協会へ納付する弁済業務保証金分担金は、有価証券でも納付できる。","answer":false,"explanation":"分担金は金銭で納付します。一方、保証協会が供託する弁済業務保証金には一定の有価証券を充てることができます。","memory":"分担金＝現金だけ。","source":"収集No.144／平成23年 問43 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G08"},{"id":"BUS-G09","category":"営業保証金・保証協会","point":"一部事務所廃止","question":"保証協会の社員が一部の事務所を廃止して分担金の返還を受ける場合、還付請求権者への公告が必ず必要である。","answer":false,"explanation":"一部事務所廃止による分担金返還では公告不要です。社員の地位を失った場合とは区別します。","memory":"保証協会・一部廃止＝公告不要。","source":"収集No.112／平成30年 問44 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G09"},{"id":"BUS-G10","category":"営業保証金・保証協会","point":"社員資格喪失","question":"還付充当金を納付せず保証協会の社員資格を失った宅建業者は、資格喪失後1週間以内に営業保証金を供託する必要がある。","answer":true,"explanation":"資格を失った後は営業保証金制度へ移るため、1週間以内の供託が必要です。供託しても社員資格が自動回復するわけではありません。","memory":"保証協会を失ったら1週間で営業保証金。","source":"収集No.120／令和元年 問33 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"G10"},{"id":"BUS-M01","category":"媒介契約","point":"書面交付","question":"宅地・建物の売買又は交換の媒介契約を締結した宅建業者は、一般媒介でも所定事項を記載した媒介契約書面を交付する。","answer":true,"explanation":"一般媒介も書面交付の対象です。","memory":"売買・交換の媒介＝一般でも書面。","source":"収集No.225","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M01"},{"id":"BUS-M02","category":"媒介契約","point":"価額の記載","question":"一般媒介契約では、媒介契約書面に売買すべき価額を記載しなくてもよい。","answer":false,"explanation":"売買すべき価額は媒介契約の種類を問わず記載事項です。","memory":"価額＝一般でも記載。","source":"収集No.225／令和4年 問31 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M02"},{"id":"BUS-M03","category":"媒介契約","point":"宅建士記名","question":"媒介契約書面には、媒介を担当する宅建士の記名が必要である。","answer":false,"explanation":"媒介契約書面の作成・交付義務は宅建業者にあり、宅建士の記名義務はありません。","memory":"媒介契約書＝宅建士記名不要。","source":"収集No.239／平成28年 問27 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M03"},{"id":"BUS-M04","category":"媒介契約","point":"専任媒介の期間","question":"専任媒介契約で有効期間を6か月と定めると、契約全体が無効になる。","answer":false,"explanation":"3か月を超える部分だけが制限され、期間は3か月となります。契約全体が無効になるわけではありません。","memory":"専任6か月→無効ではなく3か月。","source":"収集No.240／令和元年 問31 肢イ","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M04"},{"id":"BUS-M05","category":"媒介契約","point":"更新","question":"専任媒介契約は依頼者の申出により更新できるが、更新後も3か月を超えることはできない。","answer":true,"explanation":"更新も依頼者の申出が必要で、更新後の期間も3か月上限です。","memory":"更新も依頼者申出・3か月。","source":"収集No.254／平成25年 問28 肢ウ","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M05"},{"id":"BUS-M06","category":"媒介契約","point":"自動更新","question":"依頼者があらかじめ希望していれば、専任媒介契約を自動更新する特約は有効である。","answer":false,"explanation":"専任媒介契約の更新には、その都度依頼者の申出が必要です。自動更新特約は認められません。","memory":"専任媒介＝自動更新NG。","source":"収集No.281／令和2年10月 問29 肢ウ","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M06"},{"id":"BUS-M07","category":"媒介契約","point":"業務処理報告","question":"一般媒介契約では、法律上の業務処理状況の定期報告義務はない。","answer":true,"explanation":"定期報告義務は専任媒介・専属専任媒介の規制です。","memory":"一般媒介＝定期報告義務なし。","source":"収集No.138／令和3年10月 問38 肢イ","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M07"},{"id":"BUS-M08","category":"媒介契約","point":"指定流通機構","question":"指定流通機構に登録した物件の売買契約が成立したときは、引渡し前でも遅滞なく契約成立を通知する。","answer":true,"explanation":"引渡しの完了は条件ではありません。登録番号・取引価格・契約成立日などを通知します。","memory":"REINS成約通知＝契約成立後すぐ。","source":"収集No.125／平成28年 問27 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M08"},{"id":"BUS-M09","category":"媒介契約","point":"建物状況調査","question":"既存建物の媒介では、建物状況調査を実施する者のあっせんの有無を媒介契約書面に記載する。","answer":true,"explanation":"既存住宅媒介の重要ポイントです。","memory":"既存建物＝調査あっせんの有無を媒介契約書へ。","source":"収集No.267／令和元年 問31 肢エ","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M09"},{"id":"BUS-M10","category":"媒介契約","point":"建物状況調査実施者","question":"建物状況調査を実施できる者は、建築士であれば講習を受けていなくてもよい。","answer":false,"explanation":"建築士であり、かつ国土交通大臣が定める講習を修了した者である必要があります。","memory":"状況調査＝建築士＋講習修了。","source":"収集No.255・267","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"M10"},{"id":"BUS-I01","category":"35条重要事項説明","point":"時期","question":"重要事項説明は、売買・賃貸借契約が成立した後に行っても、相手方が同意していればよい。","answer":false,"explanation":"35条の説明は契約成立までに行わなければなりません。","memory":"35条＝契約前。","source":"収集No.311／平成23年 問33 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I01"},{"id":"BUS-I02","category":"35条重要事項説明","point":"説明と書面交付のタイミング","question":"35条書面を先に交付し、後日、契約締結前に宅建士が重要事項説明をすることは可能である。","answer":true,"explanation":"書面交付と説明が必ず同時である必要はありません。いずれも契約成立前に適切に行うことが必要です。","memory":"35書面と説明は同時でなくてもよい。","source":"収集No.27／平成23年 問33 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I02"},{"id":"BUS-I03","category":"35条重要事項説明","point":"説明場所","question":"重要事項説明は宅建業者の事務所で行わなければならない。","answer":false,"explanation":"説明場所に法定の限定はありません。","memory":"35条＝場所の指定なし。","source":"収集No.133／令和2年10月 問41 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I03"},{"id":"BUS-I04","category":"35条重要事項説明","point":"専任性","question":"重要事項説明は専任宅建士でなければ行えない。","answer":false,"explanation":"専任である必要はありません。","memory":"35条説明＝宅建士なら専任不要。","source":"収集No.202","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I04"},{"id":"BUS-I05","category":"35条重要事項説明","point":"売買代金","question":"宅地の売買の媒介では、売買代金の額・支払時期・支払方法は35条の法定説明事項である。","answer":false,"explanation":"代金の額・支払時期・支払方法は37条書面の事項です。35条では代金等以外の金銭の額・目的などが問題になります。","memory":"代金そのもの＝35条ではなく37条。","source":"収集No.234／令和4年 問36 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I05"},{"id":"BUS-I06","category":"35条重要事項説明","point":"宅地の貸借と法令制限","question":"宅地の貸借の媒介では、建築基準法の道路斜線制限がある場合、その概要を説明する必要がある。","answer":true,"explanation":"宅地の貸借では法令上の制限が重要事項説明の対象になります。","memory":"宅地貸借＝法令制限を説明。","source":"収集No.223／平成27年 問31 肢ア","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I06"},{"id":"BUS-I07","category":"35条重要事項説明","point":"建物貸借と建築制限","question":"建物の貸借の媒介では、準防火地域の建築物の構造制限について必ず説明しなければならない。","answer":false,"explanation":"建物貸借では、建築基準法上のこの種の制限は35条の法定説明事項ではありません。","memory":"建物貸借＝建築基準法制限は原則説明不要。","source":"収集No.244／平成27年 問31 肢ウ","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I07"},{"id":"BUS-I08","category":"35条重要事項説明","point":"水害ハザードマップ","question":"建物の貸借でも、水害ハザードマップに物件位置が含まれるときは、その概ねの位置を示して説明する。","answer":true,"explanation":"洪水・雨水出水・高潮の水害ハザードマップに関する説明は取引類型を問わず重要です。","memory":"水害マップ＝売買でも貸借でも。","source":"収集No.171／令和6年 問37 肢ア","priority":"A","origin":"312問由来","verify_url":"https://www.mlit.go.jp/totikensangyo/const/sosei_const_fr3_000074.html","subject":"宅建業法","original_id":"I08"},{"id":"BUS-I09","category":"35条重要事項説明","point":"管理委託先","question":"建物の貸借で管理が管理会社に委託されている場合、区分所有建物でなくても管理会社の商号・所在地等を説明する。","answer":true,"explanation":"貸借では管理委託先の情報が重要事項になります。","memory":"貸借＋管理委託＝管理会社情報を説明。","source":"収集No.289／令和元年 問41 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I09"},{"id":"BUS-I10","category":"35条重要事項説明","point":"住宅性能評価","question":"住宅性能評価を受けた新築住宅である旨は、建物の貸借でも35条説明が必要である。","answer":false,"explanation":"この事項は建物の売買・交換で問題となるもので、建物貸借では法定説明事項ではありません。","memory":"住宅性能評価＝貸借では不要。","source":"収集No.307／令和元年 問28 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"I10"},{"id":"BUS-C01","category":"37条書面","point":"交付時期","question":"37条書面は契約成立後、遅滞なく交付する。","answer":true,"explanation":"35条は契約前、37条は契約成立後です。","memory":"37条＝契約成立後。","source":"収集No.117ほか","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C01"},{"id":"BUS-C02","category":"37条書面","point":"業者間取引","question":"売主・買主の双方が宅建業者である場合、37条書面の交付は不要である。","answer":false,"explanation":"業者間でも37条書面の交付義務は免除されません。","memory":"37条＝業者間でも必要。","source":"収集No.117／平成30年 問28 肢イ","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C02"},{"id":"BUS-C03","category":"37条書面","point":"宅建士記名","question":"37条書面には宅建士の記名が必要だが、その宅建士が専任である必要はない。","answer":true,"explanation":"宅建士の記名は必要ですが専任性は不要です。","memory":"37条＝宅建士記名、専任不要。","source":"収集No.335","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C03"},{"id":"BUS-C04","category":"37条書面","point":"代金等以外の金銭","question":"代金・借賃以外に授受する金銭の定めがあるときは、額・目的・授受時期を37条書面に記載する。","answer":true,"explanation":"代金等以外の金銭に関する定めは37条の重要記載事項です。","memory":"代金外金銭＝額・目的・時期。","source":"収集No.115／令和3年10月 問37 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C04"},{"id":"BUS-C05","category":"37条書面","point":"不可抗力の負担","question":"天災その他不可抗力による損害の負担について定めがあるときは、貸借でも37条書面に記載する。","answer":true,"explanation":"取引類型を問わず、定めがあれば記載します。","memory":"不可抗力負担の定め＝37条。","source":"収集No.111／平成23年 問34 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C05"},{"id":"BUS-C06","category":"37条書面","point":"解除に関する定め","question":"買換え特約やローン特約など契約解除に関する定めがあるときは、37条書面に記載する。","answer":true,"explanation":"解除に関する定めは37条書面の記載事項です。","memory":"解除特約＝37条。","source":"収集No.291／平成26年 問42 肢ウ","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C06"},{"id":"BUS-C07","category":"37条書面","point":"契約不適合責任","question":"契約不適合責任に関する特約がある場合、相手方が宅建業者なら37条書面への記載を省略できる。","answer":false,"explanation":"業者間でも省略できません。","memory":"契約不適合特約＝業者間でも37条。","source":"収集No.194／平成25年 問36 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C07"},{"id":"BUS-C08","category":"37条書面","point":"責任履行措置","question":"契約不適合責任の履行について保証保険などの措置の定めがあるときは、その内容を37条書面に記載する。","answer":true,"explanation":"責任履行措置の定めがある場合は37条記載事項です。","memory":"保証保険等の定め＝37条。","source":"収集No.209／平成26年 問40 肢ア","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C08"},{"id":"BUS-C09","category":"37条書面","point":"手付金保全","question":"手付金等の保全措置の概要は、37条書面の必須記載事項である。","answer":false,"explanation":"手付金等の保全措置の概要は35条で説明する事項であり、37条の必須記載事項ではありません。","memory":"手付金保全＝35条、37条ではない。","source":"収集No.137／平成24年 問31 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C09"},{"id":"BUS-C10","category":"37条書面","point":"代金の支払条件","question":"売買代金の額・支払時期・支払方法は37条書面の記載事項である。","answer":true,"explanation":"代金の支払条件は契約内容として37条で明確にします。","memory":"代金額・時期・方法＝37条。","source":"収集No.234","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"C10"},{"id":"BUS-A01","category":"業務規制・広告","point":"広告開始時期","question":"建築確認が必要な未完成建物について、建築確認申請中である旨を表示すれば確認前でも販売広告をできる。","answer":false,"explanation":"必要な建築確認等の処分を受ける前は広告できません。","memory":"許可・確認前広告＝NG。","source":"収集No.206／平成27年 問37 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A01"},{"id":"BUS-A02","category":"業務規制・広告","point":"無免許広告","question":"宅建業免許を申請中の者は、契約を免許取得後に行う予定なら宅地売買の広告をしてもよい。","answer":false,"explanation":"無免許営業を目的とする広告自体が禁止されます。","memory":"免許前は広告もNG。","source":"収集No.155／平成26年 問27 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A02"},{"id":"BUS-A03","category":"業務規制・広告","point":"業務停止中の広告","question":"業務全部停止期間中でも、契約締結を停止期間後にするなら広告はできる。","answer":false,"explanation":"広告も宅建業務の一部なので、業務停止期間中はできません。","memory":"業務停止＝広告も停止。","source":"収集No.193／平成28年 問32 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A03"},{"id":"BUS-A04","category":"業務規制・広告","point":"誇大広告","question":"著しく事実に相違する広告は、問い合わせや契約が一件もなくても宅建業法違反となり得る。","answer":true,"explanation":"誇大広告は広告をした時点で違反となり、監督処分・罰則の対象になり得ます。","memory":"誇大広告＝成約ゼロでも違反。","source":"収集No.308／平成26年 問30 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A04"},{"id":"BUS-A05","category":"業務規制・広告","point":"取引態様","question":"広告では『売主・貸主・代理・媒介（仲介）』など取引態様を明示する。","answer":true,"explanation":"取引態様の明示は基本規制です。","memory":"広告＝取引態様を明示。","source":"収集No.119／令和2年12月 問47 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A05"},{"id":"BUS-A06","category":"業務規制・広告","point":"徒歩分数","question":"道路距離80mを1分として計算し15分50秒となる場合、徒歩15分と表示できる。","answer":false,"explanation":"1分未満の端数は切り上げるため16分表示です。","memory":"徒歩分数＝端数切上げ。","source":"収集No.122／令和7年 問47 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A06"},{"id":"BUS-A07","category":"業務規制・広告","point":"管理費表示","question":"住戸ごとに管理費が異なり全戸分を表示しにくい場合、最高額だけを表示すればよい。","answer":false,"explanation":"全てを示すのが困難な場合は最低額と最高額を表示します。","memory":"管理費省略表示＝最低＋最高。","source":"収集No.140／令和4年 問47 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A07"},{"id":"BUS-A08","category":"業務規制・広告","point":"リフォーム表示","question":"中古住宅を『改装済み』と広告するなら、改装の内容と時期を明示する。","answer":true,"explanation":"改装済みである旨を表示する場合には、その内容と時期を明示します。","memory":"改装済み表示＝内容＋時期。","source":"収集No.251／平成24年 問47 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A08"},{"id":"BUS-A09","category":"業務規制・広告","point":"迷惑勧誘","question":"相手方から午後3時の訪問は迷惑だと事前に告げられていても、深夜でなければ午後3時に訪問勧誘してよい。","answer":false,"explanation":"相手方が迷惑を覚える時間だと分かっているのに勧誘する行為は禁止されます。","memory":"相手が迷惑と言った時間＝訪問NG。","source":"収集No.331／平成24年 問41 肢エ","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A09"},{"id":"BUS-A10","category":"業務規制・広告","point":"値引き勧誘","question":"売買代金を値引きして契約締結を誘引すること自体は、直ちに宅建業法違反となるわけではない。","answer":true,"explanation":"値引きによる誘引自体は禁止行為ではありません。手付貸与や威迫などとは区別します。","memory":"値引き＝それ自体は違反でない。","source":"収集No.314／平成24年 問41 肢ウ","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"A10"},{"id":"BUS-R01","category":"8種制限","point":"適用範囲","question":"自ら売主となる場合の8種制限は、売主が宅建業者で買主が宅建業者ではない場合に適用される。","answer":true,"explanation":"非業者買主を保護するための規制です。業者間取引には原則適用されません。","memory":"8種制限＝業者売主×非業者買主。","source":"収集問題群・8種制限","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R01"},{"id":"BUS-R02","category":"8種制限","point":"クーリングオフの場所","question":"買主が宅建業者の事務所で買受けの申込みをした場合、その後レストランで契約しても原則クーリング・オフできない。","answer":true,"explanation":"クーリング・オフできるかは原則として申込み場所で判断します。","memory":"申込みが事務所＝クーリングオフ不可。","source":"収集No.163／平成24年 問37 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R02"},{"id":"BUS-R03","category":"8種制限","point":"クーリングオフ期間","question":"クーリング・オフは、所定の告知を受けた日から8日を経過するまでは行うことができる。","answer":true,"explanation":"8日間が基本です。","memory":"クーリングオフ＝8日。","source":"宅建業法37条の2","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/content/001881261.pdf","subject":"宅建業法","original_id":"R03"},{"id":"BUS-R04","category":"8種制限","point":"クーリングオフ後の返金","question":"クーリング・オフで解除されたとき、宅建業者は受領済みの手付金その他の金銭を速やかに返還する。","answer":true,"explanation":"解除後は速やかな返還義務があります。","memory":"クーリングオフ＝受領金は速やかに返す。","source":"収集No.313／令和4年 問38 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R04"},{"id":"BUS-R05","category":"8種制限","point":"手付の性質","question":"宅建業者が自ら売主となり非業者買主から受ける手付は、原則として解約手付として扱われる。","answer":true,"explanation":"名目にかかわらず解約手付としての効力が問題になります。","memory":"業者売主の手付＝解約手付。","source":"収集No.226／令和元年 問37 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R05"},{"id":"BUS-R06","category":"8種制限","point":"手付解除","question":"買主が履行に着手する前なら、業者売主は正当な理由がなくても手付の倍額を現実に提供して解除できる。","answer":true,"explanation":"相手方が履行に着手する前であれば、倍返しによる手付解除ができます。","memory":"売主の手付解除＝倍返し・正当理由不要。","source":"収集No.226","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R06"},{"id":"BUS-R07","category":"8種制限","point":"手付額上限","question":"業者売主が非業者買主から受ける手付額は、代金の20％を超えることができない。","answer":true,"explanation":"手付額の上限は20％です。","memory":"手付＝20％以下。","source":"宅建業法39条","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/content/001881261.pdf","subject":"宅建業法","original_id":"R07"},{"id":"BUS-R08","category":"8種制限","point":"完成物件の保全","question":"完成物件では、手付金等が代金の10％以下かつ1,000万円以下なら、原則として保全措置なしで受領できる。","answer":true,"explanation":"完成物件は『10％以下かつ1,000万円以下』が保全措置不要の基準です。","memory":"完成＝10％以下＆1000万円以下。","source":"収集No.154／平成23年 問37 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R08"},{"id":"BUS-R09","category":"8種制限","point":"未完成物件の保全","question":"未完成物件では、手付金等が代金の5％以下かつ1,000万円以下なら、原則として保全措置なしで受領できる。","answer":true,"explanation":"未完成物件は5％基準です。","memory":"未完成＝5％以下＆1000万円以下。","source":"収集No.229／平成27年 問36 肢ウ","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R09"},{"id":"BUS-R10","category":"8種制限","point":"契約不適合特約","question":"業者売主は、契約不適合責任について民法より買主に不利な特約を自由に定めることができる。","answer":false,"explanation":"原則として民法より買主に不利な特約は無効です。引渡しから2年以上の通知期間を定める特約などには例外があります。","memory":"業者売主の契約不適合＝買主不利特約は原則無効。","source":"収集No.275・295","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"R10"},{"id":"BUS-F01","category":"報酬","point":"売買媒介の速算式","question":"売買代金が400万円を超える通常の媒介では、税抜代金×3％＋6万円を基礎に消費税を加える速算式を使える。","answer":true,"explanation":"400万円超の売買媒介で用いる基本速算式です。","memory":"400万円超＝3％＋6万円＋税。","source":"国交省報酬制度","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/content/001750045.pdf","subject":"宅建業法","original_id":"F01"},{"id":"BUS-F02","category":"報酬","point":"代理報酬","question":"売買・交換の代理で依頼者一方から受ける報酬上限は、通常の媒介報酬上限の2倍までである。","answer":true,"explanation":"代理は媒介の2倍を上限とするのが基本です。","memory":"代理＝媒介上限の2倍。","source":"国交省報酬制度","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/content/001750045.pdf","subject":"宅建業法","original_id":"F02"},{"id":"BUS-F03","category":"報酬","point":"賃貸媒介の合計上限","question":"通常の賃貸借媒介では、貸主・借主双方から受ける報酬合計は原則として借賃1か月分の1.1倍以内である。","answer":true,"explanation":"消費税込みで1.1か月分が基本上限です。","memory":"賃貸媒介合計＝1.1か月。","source":"国交省報酬告示","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/notice/noticedata/sgml/1970/26197000/26197000.html","subject":"宅建業法","original_id":"F03"},{"id":"BUS-F04","category":"報酬","point":"居住用賃貸","question":"居住用建物の媒介で、依頼時に特段の承諾がない場合、一方の依頼者から受けられる報酬は原則借賃0.55か月分以内である。","answer":true,"explanation":"居住用建物は一方0.55か月分が原則です。承諾がある場合の例外に注意します。","memory":"居住用＝一方0.55か月原則。","source":"収集No.28／令和6年 問28 肢ア","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"F04"},{"id":"BUS-F05","category":"報酬","point":"免税事業者","question":"消費税免税事業者の報酬上限計算では、一定の場合に税抜報酬額の1.04倍相当まで受領できる。","answer":true,"explanation":"免税事業者は仕入れに係る消費税等相当額として0.04倍を限度に加算できる運用です。","memory":"免税業者＝原則1.04倍。","source":"収集No.28","priority":"B","origin":"312問由来","verify_url":"https://www.mlit.go.jp/totikensangyo/const/content/001753240.pdf","subject":"宅建業法","original_id":"F05"},{"id":"BUS-F06","category":"報酬","point":"低廉な空家等","question":"価格800万円以下の低廉な空家等の売買媒介では、一定要件のもと依頼者一方から税込33万円まで受けられる特例がある。","answer":true,"explanation":"2024年7月以降の特例です。使用状態は問いません。","memory":"800万円以下＝税込33万円特例。","source":"収集No.266／現行告示","priority":"A","origin":"312問由来","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html","subject":"宅建業法","original_id":"F06"},{"id":"BUS-F07","category":"報酬","point":"長期の空家等","question":"長期の空家等の貸借媒介では、一定要件のもと貸主である依頼者から借賃1か月分の2.2倍まで受けられる特例がある。","answer":true,"explanation":"2024年7月以降の特例です。双方から受ける合計額も2.2か月分以内です。","memory":"長期空家等＝貸主から最大2.2か月。","source":"国交省報酬改正","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/policy/shingikai/content/001965126.pdf","subject":"宅建業法","original_id":"F07"},{"id":"BUS-F08","category":"報酬","point":"特別費用","question":"依頼者の特別の依頼による遠隔地の現地調査費用で、事前に費用負担の承諾を得ていれば、報酬とは別に実費を受領できることがある。","answer":true,"explanation":"通常の媒介業務に含まれない特別の依頼・費用で、事前承諾がある場合に別途受領できます。","memory":"特別依頼＋事前承諾＝実費別途可。","source":"収集No.175／平成25年 問37 肢ウ","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"F08"},{"id":"BUS-F09","category":"報酬","point":"差額報酬","question":"売主が手取り額を決め、実際の売却額との差額を宅建業者が受け取る契約なら、報酬上限規制は適用されない。","answer":false,"explanation":"その差額も実質的に報酬として扱われ、法定上限の範囲内でなければなりません。","memory":"手取り方式でも報酬上限あり。","source":"収集No.325／平成28年 問33 肢ア","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"F09"},{"id":"BUS-F10","category":"報酬","point":"案内所の報酬額掲示","question":"契約締結を行う分譲案内所にも、国土交通大臣が定める報酬額を掲示しなければならない。","answer":false,"explanation":"報酬額の掲示義務があるのは事務所です。案内所では標識等の別規制が問題になります。","memory":"報酬額掲示＝事務所だけ。","source":"収集No.272／令和3年10月 問29 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"F10"},{"id":"BUS-S01","category":"監督・瑕疵","point":"不正免許","question":"不正の手段で宅建業免許を受けた場合、免許権者は免許を取り消さなければならない。","answer":true,"explanation":"任意ではなく必要的取消しとなる典型です。","memory":"不正免許＝必ず取消し。","source":"収集No.123／令和3年12月 問28 肢ア","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"S01"},{"id":"BUS-S02","category":"監督・瑕疵","point":"指示違反と業務停止","question":"指示処分に従わない宅建業者には業務停止を命じることができ、業務停止処分に違反した場合は免許取消しの対象となる。","answer":true,"explanation":"監督処分の流れとして重要です。","memory":"指示違反→停止、停止違反→取消し。","source":"収集No.318／令和6年 問31 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"S02"},{"id":"BUS-S03","category":"監督・瑕疵","point":"所在地知事の権限","question":"甲県知事免許の宅建業者が乙県内で法違反をした場合、乙県知事がその乙県内の業務について業務停止処分をすることがある。","answer":true,"explanation":"業務地の都道府県知事にも一定の監督権限があります。","memory":"免許権者以外の業務地知事も停止可。","source":"収集No.324／平成26年 問44 肢ア","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"S03"},{"id":"BUS-S04","category":"監督・瑕疵","point":"聴聞","question":"宅建業者への指示処分・業務停止処分などでは、法定の聴聞手続が問題となる。","answer":true,"explanation":"監督処分では聴聞が重要な手続です。","memory":"監督処分＝聴聞。","source":"収集No.332・126","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"S04"},{"id":"BUS-S05","category":"監督・瑕疵","point":"新築住宅の資力確保","question":"宅建業者が自ら売主として新築住宅を非業者買主に引き渡す場合、原則として供託又は保険による資力確保措置が必要である。","answer":true,"explanation":"住宅瑕疵担保履行法の基本です。","memory":"新築住宅・業者売主＝供託か保険。","source":"国交省住宅瑕疵担保履行法","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/jutakukentiku/jutaku-kentiku.files/kashitanpocorner/jigyousya/obligation.html","subject":"宅建業法","original_id":"S05"},{"id":"BUS-S06","category":"監督・瑕疵","point":"媒介業者の義務","question":"新築住宅の売買を媒介しただけの宅建業者にも、住宅瑕疵担保保証金の供託又は保険加入義務がある。","answer":false,"explanation":"資力確保義務は自ら売主として新築住宅を販売する宅建業者に課されます。媒介しただけの業者には課されません。","memory":"瑕疵担保履行法＝媒介だけなら資力確保義務なし。","source":"収集No.262／令和元年 問45 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"S06"},{"id":"BUS-S07","category":"監督・瑕疵","point":"業者間新築住宅","question":"新築住宅の買主が宅建業者である場合でも、売主宅建業者には住宅瑕疵担保履行法上の資力確保義務がある。","answer":false,"explanation":"同法では買主宅建業者は保護対象から除外されます。","memory":"新築でも業者間＝資力確保義務なし。","source":"収集No.60／令和2年10月 問45 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"S07"},{"id":"BUS-S08","category":"監督・瑕疵","point":"基準日と届出","question":"住宅瑕疵担保履行法の基準日は毎年3月31日で、資力確保措置の状況は基準日から3週間以内に届け出る。","answer":true,"explanation":"現在は年1回、3月31日基準です。","memory":"瑕疵担保＝3/31・3週間以内。","source":"収集No.167／現行国交省","priority":"A","origin":"312問由来","verify_url":"https://www.mlit.go.jp/jutakukentiku/jutaku-kentiku.files/kashitanpocorner/jigyousya/obligation.html","subject":"宅建業法","original_id":"S08"},{"id":"BUS-S09","category":"監督・瑕疵","point":"未届出等の契約制限","question":"必要な資力確保措置や届出をしない場合、基準日の翌日から50日を経過した日以後、新たな新築住宅の売買契約が制限される。","answer":true,"explanation":"未措置・未届出のまま一定期間経過後は新規契約が禁止されます。","memory":"未措置・未届出＝50日後から新規契約NG。","source":"国交省住宅瑕疵担保履行法","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/jutakukentiku/jutaku-kentiku.files/kashitanpocorner/jigyousya/","subject":"宅建業法","original_id":"S09"},{"id":"BUS-S10","category":"監督・瑕疵","point":"供託超過額の取戻し","question":"住宅販売瑕疵担保保証金が法定基準額を超過しても、免許行政庁の承認なしに超過額を自由に取り戻すことはできない。","answer":true,"explanation":"超過額の取戻しには承認等の手続が必要です。","memory":"瑕疵担保供託の取戻し＝承認が必要。","source":"収集No.146／令和4年 問45 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"宅建業法","original_id":"S10"},{"id":"RGT-R01","category":"制限行為能力者・意思表示","point":"未成年者","question":"未成年者が法定代理人の同意を得ずにした契約は、原則として取り消すことができる。","answer":true,"explanation":"未成年者が単独で行った法律行為は、単に権利を得る・義務を免れる行為などを除き、原則として取消しの対象です。","memory":"未成年者の無断契約＝原則取消し可。","source":"民法5条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"R01"},{"id":"RGT-R02","category":"制限行為能力者・意思表示","point":"成年被後見人","question":"成年被後見人が日用品の購入その他日常生活に関する行為をした場合でも、成年後見人は取り消すことができる。","answer":false,"explanation":"日用品の購入その他日常生活に関する行為は取消しの対象外です。","memory":"成年被後見人でも日常生活行為は取消せない。","source":"民法9条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"R02"},{"id":"RGT-R03","category":"制限行為能力者・意思表示","point":"詐術","question":"被補助人が、補助人の同意が必要な行為について詐術を用いて相手方に『同意を得ている』と信じさせた場合、その行為を制限行為能力を理由に取り消すことはできない。","answer":true,"explanation":"制限行為能力者が詐術を用いて相手方を誤信させた場合、取消権は認められません。","memory":"制限行為能力者＋詐術＝取消し不可。","source":"収集No.160／平成28年 問2 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"R03"},{"id":"RGT-R04","category":"制限行為能力者・意思表示","point":"心裡留保","question":"本人が真意ではないと知りながらした意思表示は、相手方がその真意でないことを知っていた又は知ることができた場合、無効となる。","answer":true,"explanation":"心裡留保は原則有効ですが、相手方が悪意又は有過失なら無効です。","memory":"心裡留保＝原則有効、相手方悪意・有過失なら無効。","source":"民法93条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"R04"},{"id":"RGT-R05","category":"制限行為能力者・意思表示","point":"虚偽表示","question":"相手方と通じてした虚偽表示は無効だが、その無効は善意の第三者には対抗できない。","answer":true,"explanation":"通謀虚偽表示は当事者間では無効ですが、善意の第三者は保護されます。","memory":"虚偽表示＝無効、善意第三者には対抗不可。","source":"収集No.153／平成27年 問2 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"R05"},{"id":"RGT-R06","category":"制限行為能力者・意思表示","point":"錯誤","question":"重要な錯誤による意思表示の効果は、現行民法では『無効』ではなく『取消し』である。","answer":true,"explanation":"2020年施行の改正民法では、錯誤の効果は取消しです。旧民法の『無効』と混同しないことが重要です。","memory":"錯誤＝無効ではなく取消し。","source":"収集No.181／令和7年 問3 肢ウ","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"R06"},{"id":"RGT-R07","category":"制限行為能力者・意思表示","point":"錯誤と第三者","question":"錯誤を理由とする取消しは、善意かつ無過失の第三者には対抗できない。","answer":true,"explanation":"民法95条4項により、善意無過失の第三者は保護されます。","memory":"錯誤取消し＝善意無過失の第三者を保護。","source":"収集No.181／令和7年 問3 肢ウ","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"R07"},{"id":"RGT-R08","category":"制限行為能力者・意思表示","point":"詐欺","question":"詐欺を理由に意思表示を取り消した場合でも、取消し前に現れた善意かつ無過失の第三者には、その取消しを対抗できない。","answer":true,"explanation":"詐欺取消しでは善意無過失の第三者が保護されます。","memory":"詐欺取消し＝善意無過失第三者には対抗不可。","source":"収集No.169／平成28年 問3 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"R08"},{"id":"RGT-R09","category":"制限行為能力者・意思表示","point":"強迫","question":"強迫を理由に意思表示を取り消した場合、善意無過失の第三者であっても、原則として取消しを対抗できる。","answer":true,"explanation":"民法96条3項の第三者保護は詐欺の場合の規定で、強迫には適用されません。","memory":"強迫取消し＝第三者にも対抗できる。","source":"民法96条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"R09"},{"id":"RGT-R10","category":"制限行為能力者・意思表示","point":"取消しの効果","question":"強迫を理由に売買契約を取り消すと、原則として契約は初めから無効であったものとみなされる。","answer":true,"explanation":"取り消された行為は初めから無効であったものとみなされます。","memory":"取消し＝初めから無効扱い。","source":"収集No.46／平成29年 問2 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"R10"},{"id":"RGT-A01","category":"代理","point":"代理行為の瑕疵","question":"代理人がした意思表示の効力が詐欺・強迫・事情の知不知などに左右される場合、原則として代理人を基準に判断する。","answer":true,"explanation":"代理行為の意思表示の瑕疵や善意・悪意は、原則として実際に意思表示をした代理人を基準にします。","memory":"代理の善意悪意＝原則代理人基準。","source":"収集No.288／平成26年 問2 肢エ","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"A01"},{"id":"RGT-A02","category":"代理","point":"本人の指図","question":"本人が代理人に特定の行為を委託し、本人自身が知っていた事情について、本人は代理人が知らなかったことを理由に主張できる。","answer":false,"explanation":"本人が特定行為を委託した場合、本人が知っていた事情について代理人の善意を利用することはできません。","memory":"本人が知っていた事情を代理人の善意で逃げない。","source":"民法101条","priority":"B","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"A02"},{"id":"RGT-A03","category":"代理","point":"無権代理","question":"無権代理行為は、本人が追認すれば、原則として契約時にさかのぼって効力を生ずる。","answer":true,"explanation":"追認には遡及効があります。ただし第三者の権利を害することはできません。","memory":"無権代理＋追認＝原則契約時に遡る。","source":"民法116条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"A03"},{"id":"RGT-A04","category":"代理","point":"無権代理人の責任","question":"無権代理人は、相手方が無権代理であることを知っていた場合でも、常に履行又は損害賠償の責任を負う。","answer":false,"explanation":"相手方が無権代理であることを知っていた場合など、無権代理人の責任が否定される場合があります。","memory":"無権代理人責任＝相手方悪意なら原則なし。","source":"民法117条","priority":"B","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"A04"},{"id":"RGT-A05","category":"代理","point":"無権代理人の相続","question":"無権代理人が本人を単独相続した場合、本人が追認を拒絶していたなどの特段の事情がなければ、本人が自ら行為したのと同様の効果が生じる。","answer":true,"explanation":"無権代理人が本人を単独相続した場面では、本人の地位と無権代理人の地位が同一人に帰属し、判例上本人自ら行為したのと同様の効果が認められます。","memory":"無権代理人が本人を単独相続＝原則有効化。","source":"収集No.298／平成30年 問10 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"A05"},{"id":"RGT-A06","category":"代理","point":"表見代理","question":"代理権がない者の行為でも、本人側に代理権があるような外観形成について一定の帰責性があり、相手方が善意無過失なら、表見代理が成立することがある。","answer":true,"explanation":"表見代理は、外観への信頼を保護する制度です。","memory":"表見代理＝本人側の外観＋相手方善意無過失。","source":"民法109条・110条・112条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"A06"},{"id":"RGT-A07","category":"代理","point":"代理権消滅後","question":"代理権が消滅した後の行為でも、相手方が代理権消滅を知らず、知らないことに過失がなければ、表見代理が成立することがある。","answer":true,"explanation":"代理権消滅後の表見代理が民法112条に定められています。","memory":"代理権消滅後も善意無過失なら表見代理あり得る。","source":"民法112条","priority":"B","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"A07"},{"id":"RGT-A08","category":"代理","point":"復代理","question":"代理人が適法に選任した復代理人は、本人を代理する。","answer":true,"explanation":"復代理人は代理人自身ではなく本人を代理します。","memory":"復代理人＝本人の代理人。","source":"民法106条","priority":"B","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"A08"},{"id":"RGT-A09","category":"代理","point":"復代理人の受領物","question":"復代理人が委任事務で受領した金銭を代理人に引き渡しても、本人に対する受領物引渡義務が当然に消滅するとは限らない。","answer":true,"explanation":"判例上、復代理人は本人に対する義務も負い、代理人への引渡しだけで当然に本人への義務が消えるわけではありません。","memory":"復代理人は本人にも直接責任を負う。","source":"収集No.73／平成29年 問1 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"A09"},{"id":"RGT-A10","category":"代理","point":"自己契約・双方代理","question":"代理人が本人と自己との契約を本人の代理人として締結する自己契約は、本人があらかじめ許諾した場合でも常に無効である。","answer":false,"explanation":"自己契約・双方代理は原則禁止ですが、本人があらかじめ許諾した場合などは認められます。","memory":"自己契約・双方代理＝原則禁止、本人許諾なら可。","source":"民法108条","priority":"B","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"A10"},{"id":"RGT-P01","category":"時効","point":"取得時効20年","question":"所有の意思をもって平穏かつ公然に他人の物を20年間占有すれば、占有開始時の善意・無過失を問わず所有権の取得時効が成立し得る。","answer":true,"explanation":"20年の取得時効では善意無過失は不要です。","memory":"取得時効＝20年なら善意無過失不要。","source":"民法162条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"P01"},{"id":"RGT-P02","category":"時効","point":"取得時効10年","question":"占有開始時に善意かつ無過失なら、10年間の占有で所有権の取得時効が成立し得る。","answer":true,"explanation":"10年取得時効では占有開始時の善意無過失が必要です。","memory":"10年時効＝開始時善意無過失。","source":"民法162条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"P02"},{"id":"RGT-P03","category":"時効","point":"間接占有","question":"自己が所有の意思をもって占有していた土地を他人に賃貸した期間は、取得時効の占有期間に算入できない。","answer":false,"explanation":"賃貸していても賃貸人は間接占有を続けています。占有期間は継続します。","memory":"他人に貸していても占有は続く。","source":"ユーザー学習済み・平成4年 問1相当","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"P03"},{"id":"RGT-P04","category":"時効","point":"催告","question":"内容証明郵便で支払を催告しただけで、消滅時効は更新する。","answer":false,"explanation":"催告は原則6か月の完成猶予を生じさせますが、それだけで更新にはなりません。","memory":"催告＝6か月完成猶予、更新ではない。","source":"ユーザー学習済み・平成21年 問3相当","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"P04"},{"id":"RGT-P05","category":"時効","point":"承認","question":"債務者が債務の存在を承認した場合、時効は更新する。","answer":true,"explanation":"権利の承認は時効更新事由です。","memory":"承認＝時効更新。","source":"民法152条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"P05"},{"id":"RGT-P06","category":"時効","point":"援用権者","question":"消滅時効を援用できる者には、債務者だけでなく保証人・物上保証人・第三取得者など正当な利益を有する者も含まれる。","answer":true,"explanation":"時効消滅について正当な利益を有する者は援用できます。","memory":"時効援用＝保証人・物上保証人・第三取得者も。","source":"収集No.78／令和2年12月 問5 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"P06"},{"id":"RGT-P07","category":"時効","point":"主債務者の放棄","question":"主たる債務者が時効完成後に時効利益を放棄しても、保証人は独自に時効を援用できる。","answer":true,"explanation":"主債務者の時効利益放棄の効力は保証人に及びません。","memory":"主債務者の放棄≠保証人の放棄。","source":"収集No.185／平成30年 問4 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"P07"},{"id":"RGT-P08","category":"時効","point":"時効完成前の第三者","question":"土地の取得時効が完成した者は、時効完成前から登記を備えていた第三者に対し、自己の登記がなくても時効取得を主張できる。","answer":true,"explanation":"判例上、時効完成前の第三者に対しては登記なく対抗できます。","memory":"時効完成前の第三者＝登記不要。","source":"収集No.238・292","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"P08"},{"id":"RGT-P09","category":"時効","point":"時効完成後の第三者","question":"取得時効完成後に元所有者から不動産を取得して登記を備えた第三者に対し、時効取得者は登記なく所有権を対抗できる。","answer":false,"explanation":"時効完成後の第三者との関係では対抗問題となり、時効取得者も登記が必要です。","memory":"時効完成後の第三者＝登記勝負。","source":"判例・民法177条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"P09"},{"id":"RGT-P10","category":"時効","point":"不法行為の20年","question":"不法行為の加害者が海外に住んでいる間は、不法行為時から20年の期間は進行しない。","answer":false,"explanation":"加害者の海外居住だけで20年の期間が停止するわけではありません。","memory":"海外在住でも20年は進む。","source":"収集No.269／平成26年 問8 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"P10"},{"id":"RGT-D01","category":"債務不履行・解除・危険負担","point":"解除の帰責性","question":"債務不履行による契約解除には、現在も必ず債務者の故意・過失が必要である。","answer":false,"explanation":"現行民法では解除について債務者の帰責事由は要件ではありません。損害賠償とは区別します。","memory":"解除＝帰責事由不要。","source":"民法541条・542条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"D01"},{"id":"RGT-D02","category":"債務不履行・解除・危険負担","point":"催告解除","question":"債務者が履行しない場合、相当期間を定めて催告し、その期間内に履行がなければ、原則として解除できる。","answer":true,"explanation":"催告解除の基本です。ただし不履行が軽微な場合など例外があります。","memory":"催告→相当期間→不履行＝原則解除。","source":"民法541条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"D02"},{"id":"RGT-D03","category":"債務不履行・解除・危険負担","point":"無催告解除","question":"債務の全部の履行が不能である場合など、一定の場合には催告せずに解除できる。","answer":true,"explanation":"全部履行不能や履行拒絶などでは無催告解除が認められます。","memory":"全部不能など＝無催告解除。","source":"民法542条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"D03"},{"id":"RGT-D04","category":"債務不履行・解除・危険負担","point":"解除と損害賠償","question":"契約を解除した場合、解除を理由に損害賠償請求をすることはできない。","answer":false,"explanation":"解除しても損害賠償請求は妨げられません。","memory":"解除＋損害賠償は両立する。","source":"収集No.222／令和元年 問3 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"D04"},{"id":"RGT-D05","category":"債務不履行・解除・危険負担","point":"他人物売買","question":"他人の物を売買した場合、買主が他人物であることを知っていても、売主が所有権を取得して移転できなければ契約解除できることがある。","answer":true,"explanation":"他人物売買も契約自体は有効で、売主が権利を移転できなければ買主は解除等の救済を受け得ます。","memory":"他人物売買＝契約有効、移転不能なら解除可。","source":"収集No.71／平成28年 問6 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"D05"},{"id":"RGT-D06","category":"債務不履行・解除・危険負担","point":"危険負担","question":"双務契約で、双方の責めに帰することができない事由により一方の債務が履行不能となったとき、相手方は反対給付の履行を拒むことができる。","answer":true,"explanation":"現行民法536条では、反対給付債務が当然消滅するのではなく履行拒絶権として整理されています。","memory":"危険負担＝反対給付を拒める。","source":"民法536条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"D06"},{"id":"RGT-D07","category":"債務不履行・解除・危険負担","point":"債権者の責め","question":"債権者の責めに帰すべき事由で履行不能となった場合、債権者は反対給付の履行を拒むことができる。","answer":false,"explanation":"債権者の責めに帰すべき事由による履行不能では、反対給付を拒むことはできません。","memory":"債権者原因の不能＝反対給付拒否できない。","source":"民法536条2項","priority":"B","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"D07"},{"id":"RGT-D08","category":"債務不履行・解除・危険負担","point":"損害賠償の帰責性","question":"債務者に帰責事由がない場合でも、債務不履行による損害賠償責任は必ず生じる。","answer":false,"explanation":"損害賠償は、契約その他の債務発生原因及び取引上の社会通念に照らして債務者に帰責できない場合には原則負いません。","memory":"損害賠償＝帰責性が重要。","source":"民法415条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"D08"},{"id":"RGT-D09","category":"債務不履行・解除・危険負担","point":"手付解除","question":"解約手付による解除は、相手方が契約の履行に着手した後でも行うことができる。","answer":false,"explanation":"相手方が履行に着手するまでが手付解除の限界です。","memory":"手付解除＝相手方の履行着手まで。","source":"収集No.265／平成29年 問5 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"D09"},{"id":"RGT-D10","category":"債務不履行・解除・危険負担","point":"売買代金の支払拒絶","question":"売買目的物について第三者が権利を主張し、買主が権利を取得できないおそれがある場合、売主が相当の担保を供しない限り、買主は代金支払を拒めることがある。","answer":true,"explanation":"第三者の権利主張により買主の権利取得が危うい場合の代金支払拒絶権です。","memory":"第三者が権利主張＝買主は代金支払を拒める場合あり。","source":"収集No.143／令和3年10月 問7 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"D10"},{"id":"RGT-E01","category":"弁済・相殺・債権譲渡","point":"受領権者としての外観","question":"受領権限のない者に弁済しても、弁済者が善意無過失で、その者が受領権者らしい外観を有していた場合には弁済が有効となることがある。","answer":true,"explanation":"受領権者としての外観を有する者への善意無過失の弁済は有効です。","memory":"ニセ受領権者でも善意無過失なら弁済有効あり。","source":"収集No.197／令和元年 問7 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"E01"},{"id":"RGT-E02","category":"弁済・相殺・債権譲渡","point":"第三者弁済","question":"債務の性質が第三者弁済を許さない場合などを除き、第三者が弁済することもできる。","answer":true,"explanation":"第三者弁済は原則認められますが、一定の制限があります。","memory":"第三者弁済＝原則可。","source":"民法474条","priority":"B","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"E02"},{"id":"RGT-E03","category":"弁済・相殺・債権譲渡","point":"相殺の期限","question":"自働債権の弁済期が到来していなければ、原則として相殺できない。","answer":true,"explanation":"相殺する側の債権（自働債権）は弁済期にある必要があります。","memory":"相殺＝自分の債権が期限到来していること。","source":"収集No.326／平成30年 問9 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"E03"},{"id":"RGT-E04","category":"弁済・相殺・債権譲渡","point":"不法行為債権と相殺","question":"不法行為の被害者が加害者に対して有する損害賠償債権を自働債権として相殺することは、原則として認められる。","answer":true,"explanation":"不法行為債権を受働債権として加害者側から相殺することには制限がありますが、被害者側から自働債権として相殺することは可能です。","memory":"不法行為＝被害者側からの相殺は可。","source":"収集No.180／平成30年 問9 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"E04"},{"id":"RGT-E05","category":"弁済・相殺・債権譲渡","point":"譲渡制限特約","question":"債権に譲渡制限特約があっても、債権譲渡そのものは原則として有効である。","answer":true,"explanation":"現行民法では譲渡制限特約があっても譲渡の効力は妨げられません。","memory":"譲渡禁止特約があっても譲渡自体は原則有効。","source":"収集No.287・94","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"E05"},{"id":"RGT-E06","category":"弁済・相殺・債権譲渡","point":"悪意重過失の譲受人","question":"譲渡制限特約を知り、又は重大な過失で知らなかった譲受人に対しては、債務者は履行を拒むことができる場合がある。","answer":true,"explanation":"譲渡は有効でも、悪意・重過失の譲受人に対する債務者の履行拒絶が認められます。","memory":"譲渡は有効、悪意重過失の譲受人には履行拒絶あり。","source":"収集No.109／令和3年10月 問6 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"E06"},{"id":"RGT-E07","category":"弁済・相殺・債権譲渡","point":"将来債権","question":"将来発生する債権でも、譲渡時に債権の内容が特定できる場合には譲渡することができる。","answer":true,"explanation":"将来債権の譲渡は現行民法上明文で認められています。","memory":"将来債権＝特定できれば譲渡可。","source":"収集No.145／平成28年 問5 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"E07"},{"id":"RGT-E08","category":"弁済・相殺・債権譲渡","point":"債務者対抗要件","question":"指名債権の譲渡を債務者に対抗するには、原則として譲渡人から債務者への通知又は債務者の承諾が必要である。","answer":true,"explanation":"債務者対抗要件の基本です。","memory":"債務者への対抗＝通知か承諾。","source":"民法467条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"E08"},{"id":"RGT-E09","category":"弁済・相殺・債権譲渡","point":"第三者対抗要件","question":"債権譲渡を第三者に対抗するには、原則として確定日付のある証書による通知又は承諾が必要である。","answer":true,"explanation":"第三者との優劣では確定日付が重要です。","memory":"第三者対抗＝確定日付。","source":"民法467条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"E09"},{"id":"RGT-E10","category":"弁済・相殺・債権譲渡","point":"債権譲渡後の相殺","question":"債権譲渡の通知を受ける前に取得した反対債権など、一定の場合には債務者は譲受人に対して相殺を主張できる。","answer":true,"explanation":"譲渡前からの相殺期待は一定範囲で保護されます。","memory":"譲渡通知前に持つ反対債権＝相殺できる場合あり。","source":"収集No.278／平成23年 問5 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"E10"},{"id":"RGT-S01","category":"売買・契約不適合","point":"追完請求","question":"売買目的物が契約内容に適合しない場合、買主は原則として修補・代替物の引渡し等の追完を請求できる。","answer":true,"explanation":"契約不適合責任の基本救済の一つが追完請求です。","memory":"契約不適合＝まず追完請求。","source":"民法562条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"S01"},{"id":"RGT-S02","category":"売買・契約不適合","point":"代金減額","question":"買主が相当期間を定めて追完を催告し、その期間内に追完がない場合、原則として不適合の程度に応じた代金減額を請求できる。","answer":true,"explanation":"代金減額請求は追完との関係を押さえます。","memory":"追完なし→代金減額。","source":"民法563条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"S02"},{"id":"RGT-S03","category":"売買・契約不適合","point":"損害賠償と解除","question":"契約不適合がある場合、買主は損害賠償請求と契約解除を併用できることがある。","answer":true,"explanation":"解除できる場合でも損害賠償請求が排除されるわけではありません。","memory":"契約不適合＝解除と損害賠償は両立可。","source":"収集No.222／令和元年 問3 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"S03"},{"id":"RGT-S04","category":"売買・契約不適合","point":"通知期間","question":"種類・品質の契約不適合について、買主は原則として不適合を知った時から1年以内に売主へ通知しなければならない。","answer":true,"explanation":"民法566条の通知期間です。","memory":"契約不適合通知＝知ってから1年。","source":"収集No.100／令和元年 問3 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"S04"},{"id":"RGT-S05","category":"売買・契約不適合","point":"売主悪意","question":"引渡し時に売主が契約不適合を知っていた場合でも、買主が知ってから1年以内に通知しなければ必ず責任追及できなくなる。","answer":false,"explanation":"売主が不適合を知り、又は重大な過失で知らなかった場合、1年の通知制限は適用されません。","memory":"売主悪意・重過失＝1年通知制限なし。","source":"収集No.100","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"S05"},{"id":"RGT-S06","category":"売買・契約不適合","point":"免責特約","question":"売主が知りながら買主に告げなかった契約不適合についても、免責特約を定めておけば責任を免れる。","answer":false,"explanation":"売主が知りながら告げなかった事実については、免責特約によって責任を免れることはできません。","memory":"知って隠した不適合＝免責特約不可。","source":"民法572条／収集No.100","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"S06"},{"id":"RGT-S07","category":"売買・契約不適合","point":"他人物売買","question":"売買の目的物が他人の所有物である場合、その売買契約は当然に無効となる。","answer":false,"explanation":"他人物売買も契約自体は有効です。売主には権利を取得して買主に移転する義務が生じます。","memory":"他人物売買＝契約は有効。","source":"民法561条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"S07"},{"id":"RGT-S08","category":"売買・契約不適合","point":"手付解除","question":"買主が解約手付を交付した場合、売主は相手方が履行に着手する前なら、手付の倍額を現実に提供して解除できる。","answer":true,"explanation":"民法557条の手付解除です。","memory":"売主の手付解除＝倍返し。","source":"収集No.265／平成29年 問5 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"S08"},{"id":"RGT-S09","category":"売買・契約不適合","point":"手付解除の期限","question":"解約手付による解除は、相手方が履行に着手した後でも、違約金を支払えばできる。","answer":false,"explanation":"手付解除は相手方が履行に着手するまでです。","memory":"手付解除＝履行着手後は不可。","source":"収集No.265","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"S09"},{"id":"RGT-S10","category":"売買・契約不適合","point":"売主保証人","question":"売主の債務を保証した者は、特段の反対意思がない限り、売主の債務不履行による解除後の既払代金返還義務についても保証責任を負うことがある。","answer":true,"explanation":"判例上、保証の範囲は解除後の原状回復義務にも及び得ます。","memory":"売主保証＝解除後の代金返還にも及び得る。","source":"収集No.204／令和2年10月 問7 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"S10"},{"id":"RGT-B01","category":"物権変動・不動産登記","point":"物権変動の成立","question":"不動産の所有権は、売買契約当事者間では登記がなくても意思表示だけで移転し得る。","answer":true,"explanation":"民法176条により物権変動は意思表示のみで効力を生じます。登記は第三者対抗要件です。","memory":"当事者間＝登記なしでも所有権移転。","source":"民法176条・177条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"B01"},{"id":"RGT-B02","category":"物権変動・不動産登記","point":"第三者対抗要件","question":"不動産の物権変動を第三者に対抗するには、原則として登記が必要である。","answer":true,"explanation":"民法177条の基本です。","memory":"第三者に勝つには登記。","source":"民法177条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"B02"},{"id":"RGT-B03","category":"物権変動・不動産登記","point":"賃貸人地位","question":"対抗要件を備えた土地賃借人に対し、土地を取得した新所有者が賃貸人の地位を主張するには、原則として所有権移転登記が必要である。","answer":true,"explanation":"新所有者が賃貸人たる地位を賃借人に対抗するには登記が必要です。","memory":"新所有者→賃借人に賃貸人主張＝登記必要。","source":"収集No.230／平成24年 問6 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"B03"},{"id":"RGT-B04","category":"物権変動・不動産登記","point":"取得時効","question":"時効完成前から権利を取得していた第三者に対しては、時効取得者は登記なく所有権を対抗できる。","answer":true,"explanation":"時効完成前の第三者との関係は登記対抗問題になりません。","memory":"時効完成前第三者＝登記不要。","source":"収集No.238・292","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"B04"},{"id":"RGT-B05","category":"物権変動・不動産登記","point":"建物滅失登記","question":"登記された建物が滅失したときは、表題部所有者又は所有権登記名義人は原則1か月以内に滅失登記を申請する。","answer":true,"explanation":"表示に関する登記の基本期限です。","memory":"建物滅失＝1か月以内。","source":"収集No.124／令和5年 問14 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"B05"},{"id":"RGT-B06","category":"物権変動・不動産登記","point":"遺贈登記","question":"相続人ではない者への遺贈による所有権移転登記は、受遺者が単独で申請できる。","answer":false,"explanation":"相続人以外への遺贈は原則共同申請です。相続人への遺贈との違いが重要です。","memory":"相続人以外への遺贈＝原則共同申請。","source":"収集No.232／令和6年 問14 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"B06"},{"id":"RGT-B07","category":"物権変動・不動産登記","point":"相続登記義務","question":"相続により不動産を取得した相続人は、原則としてその取得を知った日から3年以内に相続登記を申請する義務がある。","answer":true,"explanation":"2024年4月1日から相続登記は義務化されています。","memory":"相続登記＝知ってから3年。","source":"法務省・相続登記義務化","priority":"A","origin":"現行法補強","verify_url":"https://www.moj.go.jp/MINJI/minji05_00599.html","subject":"権利関係","original_id":"B07"},{"id":"RGT-B08","category":"物権変動・不動産登記","point":"住所等変更登記","question":"不動産所有者の住所・氏名が変わった場合、2026年4月1日以降は原則として変更日から2年以内に変更登記を申請する義務がある。","answer":true,"explanation":"2026年4月1日から住所・氏名変更登記が義務化されました。","memory":"住所・氏名変更登記＝2年以内。","source":"法務省・住所等変更登記義務化／収集No.274","priority":"A","origin":"現行法補強","verify_url":"https://www.moj.go.jp/MINJI/jushohenko/","subject":"権利関係","original_id":"B08"},{"id":"RGT-B09","category":"物権変動・不動産登記","point":"住所変更登記の申請","question":"登記名義人の住所変更登記は、登記名義人が単独で申請できる。","answer":true,"explanation":"住所・氏名等の変更登記は登記名義人の単独申請です。","memory":"住所変更登記＝単独申請。","source":"収集No.274／令和6年 問14 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"B09"},{"id":"RGT-B10","category":"物権変動・不動産登記","point":"附属書類の閲覧","question":"登記簿の附属書類は、どの書類でも誰でも無条件に閲覧できる。","answer":false,"explanation":"土地所在図・地積測量図・地役権図面・建物図面・各階平面図などを除き、正当な理由が認められる部分に限るものがあります。","memory":"登記附属書類＝全部が自由閲覧ではない。","source":"収集No.299／平成27年 問14 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"B10"},{"id":"RGT-M01","category":"抵当権・保証・連帯","point":"抵当権の性質","question":"抵当権者は、目的不動産の引渡しを受けずに担保権を設定できる。","answer":true,"explanation":"抵当権は目的物の占有を設定者に残したまま設定する担保物権です。","memory":"抵当権＝占有を移さない。","source":"民法369条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"M01"},{"id":"RGT-M02","category":"抵当権・保証・連帯","point":"物上代位","question":"抵当建物が火災で滅失した場合、抵当権者は一定の要件のもと火災保険金請求権に物上代位できる。","answer":true,"explanation":"目的物の価値が保険金請求権等に転化した場合、抵当権の効力が及び得ます。","memory":"抵当物滅失→保険金に物上代位あり。","source":"収集No.334／平成24年 問7 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"M02"},{"id":"RGT-M03","category":"抵当権・保証・連帯","point":"物上代位の差押え","question":"抵当権者が物上代位するには、原則として払渡し又は引渡し前に差押えが必要である。","answer":true,"explanation":"物上代位では差押えのタイミングが重要です。","memory":"物上代位＝払渡し前に差押え。","source":"民法372条・304条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"M03"},{"id":"RGT-M04","category":"抵当権・保証・連帯","point":"抵当権消滅請求","question":"抵当不動産の第三取得者は、一定の手続により抵当権消滅請求をすることができる。","answer":true,"explanation":"第三取得者が各抵当権者に書面を送付して行う制度です。","memory":"第三取得者＝抵当権消滅請求可。","source":"収集No.231／平成28年 問4 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"M04"},{"id":"RGT-M05","category":"抵当権・保証・連帯","point":"保証契約の方式","question":"保証契約は書面又は電磁的記録でしなければ、その効力を生じない。","answer":true,"explanation":"保証は方式が必要です。","memory":"保証契約＝書面または電磁的記録。","source":"民法446条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"M05"},{"id":"RGT-M06","category":"抵当権・保証・連帯","point":"個人根保証","question":"個人が賃貸借契約から生じる一切の債務を根保証する場合、極度額の定めがなければ保証契約は無効となる。","answer":true,"explanation":"2020年施行の改正民法で、個人根保証契約には極度額が必須となりました。","memory":"個人根保証＝極度額必須。","source":"収集No.62・104／法務省債権法改正","priority":"A","origin":"現行法補強","verify_url":"https://www.moj.go.jp/content/001254263.pdf","subject":"権利関係","original_id":"M06"},{"id":"RGT-M07","category":"抵当権・保証・連帯","point":"法人根保証","question":"法人が根保証人となる場合でも、民法上、必ず極度額を定めなければ保証契約は無効となる。","answer":false,"explanation":"個人根保証の極度額要件は保証人が個人である場合の規制です。","memory":"極度額必須＝個人根保証。","source":"収集No.104／令和2年10月 問2 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"M07"},{"id":"RGT-M08","category":"抵当権・保証・連帯","point":"賃貸借保証の範囲","question":"建物賃貸借の保証人の責任は、賃料だけに限られ、原状回復・損害賠償債務には及ばない。","answer":false,"explanation":"保証の内容によっては、賃貸借契約から生じる損害賠償等にも及びます。ただし個人根保証では極度額規制を必ず確認します。","memory":"賃貸借保証＝賃料だけとは限らない＋個人なら極度額。","source":"収集No.62／平成25年 問7 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"M08"},{"id":"RGT-M09","category":"抵当権・保証・連帯","point":"主債務の時効","question":"主たる債務者が時効完成後に時効利益を放棄しても、保証人は時効を援用できる。","answer":true,"explanation":"保証人自身の利益は主債務者の放棄によって失われません。","memory":"主債務者が時効放棄しても保証人は援用可。","source":"収集No.185／平成30年 問4 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"M09"},{"id":"RGT-M10","category":"抵当権・保証・連帯","point":"使用者責任の求償","question":"使用者が被用者の不法行為について被害者に全額賠償した場合、使用者は常にその全額を被用者へ求償できる。","answer":false,"explanation":"使用者の被用者に対する求償は、信義則上相当と認められる限度に制限されることがあります。","memory":"使用者→被用者求償＝常に全額ではない。","source":"収集No.286／平成24年 問9 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"M10"},{"id":"RGT-L01","category":"借地借家法","point":"普通借地権の当初期間","question":"普通借地権の存続期間を契約で20年と定めても、原則として30年となる。","answer":true,"explanation":"普通借地権の最初の存続期間は30年以上です。30年未満の定めは30年となります。","memory":"普通借地＝最初30年以上。","source":"収集No.256ほか","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L01"},{"id":"RGT-L02","category":"借地借家法","point":"更新期間","question":"普通借地権を最初に更新し、更新後の期間を定めなかった場合、更新期間は20年となる。","answer":true,"explanation":"最初の更新は20年、その後の更新は10年が基本です。","memory":"借地更新＝最初20年、次から10年。","source":"収集No.57・203","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L02"},{"id":"RGT-L03","category":"借地借家法","point":"一般定期借地権","question":"一般定期借地権は、存続期間を50年以上として設定する。","answer":true,"explanation":"更新なし・建物再築による延長なし・建物買取請求なしの特約を置く一般定期借地権は50年以上です。","memory":"一般定期借地＝50年以上。","source":"収集No.196／平成28年 問11 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L03"},{"id":"RGT-L04","category":"借地借家法","point":"事業用定期借地権","question":"事業用定期借地権等は、専ら居住用建物の所有を目的として設定できる。","answer":false,"explanation":"事業用定期借地権等は専ら事業の用に供する建物の所有を目的とし、居住用は対象外です。","memory":"事業用定期借地＝居住用NG。","source":"収集No.196","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L04"},{"id":"RGT-L05","category":"借地借家法","point":"建物譲渡特約付借地権","question":"建物譲渡特約付借地権では、借地権設定後30年以上を経過した日に建物を相当の対価で地主へ譲渡する特約を定める。","answer":true,"explanation":"建物譲渡特約付借地権は30年以上経過後の建物譲渡で借地権を消滅させる仕組みです。","memory":"建物譲渡特約付＝30年以上。","source":"収集No.142／令和3年10月 問11 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L05"},{"id":"RGT-L06","category":"借地借家法","point":"一時使用目的借地","question":"一時使用目的の借地権には、借地借家法上の建物買取請求権などの保護規定が全面的に適用される。","answer":false,"explanation":"臨時設備など一時使用目的が明らかな借地には、借地借家法の一定の規定が適用されません。","memory":"一時使用借地＝通常の強い借地保護は外れる。","source":"収集No.259／平成24年 問11 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L06"},{"id":"RGT-L07","category":"借地借家法","point":"定期建物賃貸借","question":"定期建物賃貸借は、書面等による契約と、契約前の更新がない旨の説明が重要である。","answer":true,"explanation":"定期建物賃貸借は方式と事前説明がポイントです。","memory":"定期借家＝書面＋事前説明。","source":"借地借家法38条","priority":"A","origin":"現行法補強","verify_url":"","subject":"権利関係","original_id":"L07"},{"id":"RGT-L08","category":"借地借家法","point":"定期建物賃貸借の終了通知","question":"期間1年以上の定期建物賃貸借では、貸主が期間満了の1年前から6か月前までの間に終了通知をしないと、その時点では満了を借主に対抗できない。","answer":true,"explanation":"通知をしなかったから普通借家として自動更新されるわけではなく、通知後6か月経過で終了を対抗できる点が重要です。","memory":"定期借家1年以上＝1年前～6か月前に終了通知。","source":"収集No.149／令和3年10月 問12 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L08"},{"id":"RGT-L09","category":"借地借家法","point":"普通借家の更新拒絶","question":"建物賃貸借で貸主が更新を拒絶するには、原則として正当事由が必要である。","answer":true,"explanation":"貸主側の更新拒絶・解約申入れでは正当事由が重要です。","memory":"普通借家・貸主更新拒絶＝正当事由。","source":"収集No.86ほか","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L09"},{"id":"RGT-L10","category":"借地借家法","point":"造作買取請求","question":"建物賃貸借では、借主の造作買取請求権を行使しない旨の特約をあらかじめ定めることができる。","answer":true,"explanation":"造作買取請求権は特約で排除できます。","memory":"造作買取請求権＝特約で排除可。","source":"収集No.72・213","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"L10"},{"id":"RGT-C01","category":"共有・区分所有・相続","point":"共有物分割禁止","question":"共有者は、5年を超えない期間で共有物を分割しない旨の契約をすることができる。","answer":true,"explanation":"不分割特約は5年以内で設定でき、更新も可能です。","memory":"共有物の不分割特約＝最長5年。","source":"収集No.39／平成23年 問3 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"C01"},{"id":"RGT-C02","category":"共有・区分所有・相続","point":"保存行為","question":"各共有者は、共有物の不法占拠者に対する妨害排除請求を単独で行うことができる。","answer":true,"explanation":"保存行為は各共有者が単独で行えます。","memory":"共有物の保存行為＝単独可。","source":"収集No.317／平成23年 問3 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"C02"},{"id":"RGT-C03","category":"共有・区分所有・相続","point":"軽微変更","question":"共有物に形状又は効用の著しい変更を伴わない軽微な変更は、持分価格の過半数で決められる。","answer":true,"explanation":"2023年施行の共有制度見直しで、軽微な変更は全員同意ではなく持分価格の過半数で決定できます。","memory":"共有物の軽微変更＝持分過半数。","source":"法務省・共有制度見直し","priority":"A","origin":"現行法補強","verify_url":"https://www.moj.go.jp/content/001369525","subject":"権利関係","original_id":"C03"},{"id":"RGT-C04","category":"共有・区分所有・相続","point":"所在不明共有者","question":"所在等不明共有者がいる場合、一定の要件のもと、裁判所の決定により他の共有者がその持分を取得する制度がある。","answer":true,"explanation":"所有者不明土地対策として導入された制度です。","memory":"所在不明共有者持分＝裁判所決定で取得制度あり。","source":"収集No.273／令和6年 問3 肢4","priority":"A","origin":"312問由来","verify_url":"https://www.moj.go.jp/content/001369525","subject":"権利関係","original_id":"C04"},{"id":"RGT-C05","category":"共有・区分所有・相続","point":"規約閲覧","question":"区分所有建物の規約の保管者は、利害関係人から請求があったとき、正当な理由がなければ規約の閲覧を拒めない。","answer":true,"explanation":"2026年改正後もこの基本ルールは維持されています。デジタル規約の提供方法も整備されています。","memory":"規約閲覧＝正当理由なく拒否できない。","source":"収集No.45／平成23年 問13 肢1","priority":"A","origin":"312問由来","verify_url":"https://www.moj.go.jp/MINJI/minji07_00324.html","subject":"権利関係","original_id":"C05"},{"id":"RGT-C06","category":"共有・区分所有・相続","point":"書面決議","question":"区分所有法上、集会で決議すべき事項について書面又は電磁的方法で決議するには、原則として区分所有者全員の承諾が必要である。","answer":true,"explanation":"2026年4月1日施行後も、書面又は電磁的方法による決議には全員承諾が必要という基本は維持されています。","memory":"集会なしの書面決議＝全員承諾。","source":"収集No.279／令和3年10月 問13 肢1","priority":"A","origin":"312問由来","verify_url":"https://www.moj.go.jp/content/001386322.pdf","subject":"権利関係","original_id":"C06"},{"id":"RGT-C07","category":"共有・区分所有・相続","point":"管理所有","question":"共用部分は原則として区分所有者の共有だが、規約により管理者を所有者とする管理所有を定めることができる。","answer":true,"explanation":"管理所有が認められています。","memory":"共用部分＝規約で管理所有可。","source":"収集No.319／令和7年 問13 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"C07"},{"id":"RGT-C08","category":"共有・区分所有・相続","point":"相続の単純承認","question":"共同相続人のうち1人が単純承認した後でも、他の共同相続人全員が一致すれば限定承認をすることができる。","answer":false,"explanation":"限定承認は共同相続人全員で行う必要があり、一人でも単純承認すると限定承認はできません。","memory":"限定承認＝共同相続人全員。","source":"収集No.131／平成28年 問10 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"C08"},{"id":"RGT-C09","category":"共有・区分所有・相続","point":"遺産分割の効力","question":"遺産分割の効力は原則として相続開始時にさかのぼるが、第三者の権利を害することはできない。","answer":true,"explanation":"民法909条の基本です。","memory":"遺産分割＝相続開始時に遡る、第三者保護あり。","source":"収集No.207／令和5年 問1 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"C09"},{"id":"RGT-C10","category":"共有・区分所有・相続","point":"預貯金債権","question":"遺産に属する預貯金債権は、相続開始と同時に当然に法定相続分で分割され、各相続人が自由に単独行使できる。","answer":false,"explanation":"最高裁判例により、預貯金債権は遺産分割の対象となり、当然分割されるものではありません。","memory":"預貯金＝当然分割されない。","source":"収集No.188／令和元年 問6 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"権利関係","original_id":"C10"},{"id":"LAW-U01","category":"都市計画法","point":"都市計画区域","question":"都市計画区域は、必ず市町村の行政区域と一致して指定される。","answer":false,"explanation":"都市計画区域は行政区域と一致する必要はなく、複数市町村にまたがることもあります。","memory":"都市計画区域≠行政区域。","source":"現行法補強","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U01"},{"id":"LAW-U02","category":"都市計画法","point":"準都市計画区域","question":"準都市計画区域には、市街化区域と市街化調整区域との区域区分を定めることができる。","answer":false,"explanation":"区域区分は都市計画区域についての制度で、準都市計画区域には定めません。","memory":"準都市計画区域＝線引きしない。","source":"収集No.74／平成30年 問16 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U02"},{"id":"LAW-U03","category":"都市計画法","point":"都市計画の優先関係","question":"市町村が定めた都市計画が都道府県の都市計画と抵触する場合、抵触部分は都道府県の都市計画が優先する。","answer":true,"explanation":"上位計画との整合が必要で、抵触部分では都道府県都市計画が優先します。","memory":"抵触したら都道府県が優先。","source":"収集No.116／平成27年 問16 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U03"},{"id":"LAW-U04","category":"都市計画法","point":"開発許可","question":"市街化調整区域では、開発行為の規模が小さければ常に開発許可は不要である。","answer":false,"explanation":"市街化調整区域は規模にかかわらず原則として開発許可の対象となります。","memory":"調整区域＝規模に関係なく原則許可。","source":"都市計画法29条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U04"},{"id":"LAW-U05","category":"都市計画法","point":"非常災害","question":"非常災害のため必要な応急措置として行う開発行為は、市街化調整区域内でも原則として開発許可不要である。","answer":true,"explanation":"非常災害の応急措置として行う一定の開発行為は許可対象外です。","memory":"非常災害の応急措置＝開発許可不要。","source":"収集No.300／平成23年 問17 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U05"},{"id":"LAW-U06","category":"都市計画法","point":"工事廃止","question":"開発許可を受けた者が開発行為に関する工事を廃止するときは、都道府県知事の許可を受けなければならない。","answer":false,"explanation":"廃止については許可ではなく届出です。","memory":"開発工事の廃止＝許可ではなく届出。","source":"収集No.310／令和3年12月 問16 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U06"},{"id":"LAW-U07","category":"都市計画法","point":"工事完了後の建築制限","question":"用途地域等の定めがない開発区域では、工事完了公告後も、原則として都道府県知事の許可なく予定建築物以外を新築できない。","answer":true,"explanation":"用途地域等がない区域では、予定建築物以外の新築が原則制限されます。","memory":"開発区域・用途指定なし＝予定建築物以外は原則許可要。","source":"収集No.51／平成30年 問17 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U07"},{"id":"LAW-U08","category":"都市計画法","point":"準都市計画区域の市街地開発事業","question":"準都市計画区域では、用途地域が定められていても市街地開発事業を都市計画に定めることはできない。","answer":true,"explanation":"準都市計画区域では市街地開発事業を定めることはできません。","memory":"準都市計画区域＝市街地開発事業なし。","source":"収集No.108／平成26年 問15 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U08"},{"id":"LAW-U09","category":"都市計画法","point":"都市計画区域外の開発","question":"都市計画区域・準都市計画区域外で1ha以上の開発行為は、原則として開発許可の対象となる。","answer":true,"explanation":"区域外でも一定規模以上は許可対象です。","memory":"区域外＝原則1ha以上で許可。","source":"都市計画法29条2項","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U09"},{"id":"LAW-U10","category":"都市計画法","point":"準都市計画区域の開発","question":"準都市計画区域では、政令上3,000㎡以上の開発行為が原則として許可対象となる。","answer":true,"explanation":"条例で対象規模が引き下げられる場合があります。","memory":"準都市計画区域＝原則3,000㎡以上。","source":"都市計画法施行令","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U10"},{"id":"LAW-U11","category":"都市計画法","point":"市街化区域の開発","question":"市街化区域の開発許可対象面積は全国一律3,000㎡以上であり、条例で引き下げられない。","answer":false,"explanation":"条例により1,000㎡まで引き下げることができます。","memory":"市街化区域＝条例で1,000㎡まで引下げ可。","source":"都市計画法施行令","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U11"},{"id":"LAW-U12","category":"都市計画法","point":"農林漁業用施設の例外","question":"市街化区域内でも、農林漁業者の居住用建築物のための開発行為は常に許可不要である。","answer":false,"explanation":"農林漁業用施設等の例外は市街化区域では適用されません。","memory":"農林漁業例外＝市街化区域では使えない。","source":"都市計画法29条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U12"},{"id":"LAW-U13","category":"都市計画法","point":"完了公告前の建築","question":"開発許可区域内では、工事完了公告前は原則として建築物を建築してはならない。","answer":true,"explanation":"工事完了公告前の建築等は原則制限されます。","memory":"完了公告前＝原則建築不可。","source":"都市計画法37条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U13"},{"id":"LAW-U14","category":"都市計画法","point":"開発許可申請者","question":"開発許可の申請者は、必ず土地所有者本人でなければならない。","answer":false,"explanation":"開発行為をしようとする者が申請者であり、土地所有者本人に限定されません。","memory":"申請者＝土地所有者限定ではない。","source":"都市計画法30条","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U14"},{"id":"LAW-U15","category":"都市計画法","point":"区域区分","question":"区域区分とは、都市計画区域を市街化区域と市街化調整区域とに区分することをいう。","answer":true,"explanation":"いわゆる線引きです。","memory":"区域区分＝市街化区域＋市街化調整区域。","source":"都市計画法7条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"U15"},{"id":"LAW-B01","category":"建築基準法","point":"接道義務","question":"都市計画区域・準都市計画区域内の建築物の敷地は、原則として幅員4m以上の道路に2m以上接しなければならない。","answer":true,"explanation":"建築基準法43条の基本です。","memory":"接道＝4m道路に2m以上。","source":"建築基準法43条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B01"},{"id":"LAW-B02","category":"建築基準法","point":"2項道路","question":"幅員4m未満でも一定の要件を満たす既存道路は、建築基準法上の道路として扱われることがある。","answer":true,"explanation":"いわゆる2項道路です。","memory":"4m未満でも2項道路あり。","source":"建築基準法42条2項","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B02"},{"id":"LAW-B03","category":"建築基準法","point":"セットバック","question":"2項道路では、原則として道路中心線から2m後退した線が道路境界線とみなされる。","answer":true,"explanation":"反対側が崖地等の場合など例外があります。","memory":"2項道路＝原則中心から2m後退。","source":"建築基準法42条2項","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B03"},{"id":"LAW-B04","category":"建築基準法","point":"建ぺい率","question":"建ぺい率は、建築面積の敷地面積に対する割合である。","answer":true,"explanation":"建築面積÷敷地面積で計算します。","memory":"建ぺい率＝建築面積÷敷地面積。","source":"建築基準法53条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B04"},{"id":"LAW-B05","category":"建築基準法","point":"容積率","question":"容積率は、延べ面積の敷地面積に対する割合である。","answer":true,"explanation":"延べ面積÷敷地面積で計算します。","memory":"容積率＝延べ面積÷敷地面積。","source":"建築基準法52条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B05"},{"id":"LAW-B06","category":"建築基準法","point":"前面道路幅員","question":"指定容積率が高くても、前面道路幅員による容積率制限の方が低ければ、原則として低い方が適用される。","answer":true,"explanation":"指定容積率と道路幅員による限度を比較します。","memory":"容積率＝厳しい方。","source":"建築基準法52条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B06"},{"id":"LAW-B07","category":"建築基準法","point":"防火地域","question":"防火地域内で建築物の屋上に設ける看板は、主要部分を不燃材料で造り又は覆わなければならない。","answer":true,"explanation":"防火地域の看板等の防火規制です。","memory":"防火地域の屋上看板＝不燃材料。","source":"収集No.64／令和元年 問17 肢3","priority":"B","origin"
