const KEY="takken_rights_540_v1",SETKEY="takken_rights_settings_v1";
let st={topic:null,active:false,round:1,queue:[],retry:[],idx:0,c:0,w:0,answered:false,streak:{},wrongHist:{},completed:{}},cfg={mode:"normal",order:"random",chatUrl:""};
const $=id=>document.getElementById(id);
function load(){try{let a=localStorage.getItem(KEY);if(a)st=JSON.parse(a)}catch(e){}try{let b=localStorage.getItem(SETKEY);if(b)cfg=JSON.parse(b)}catch(e){}$("mode").value=cfg.mode;$("order").value=cfg.order;$("chatUrl").value=cfg.chatUrl||""}
function save(){localStorage.setItem(KEY,JSON.stringify(st));localStorage.setItem(SETKEY,JSON.stringify(cfg))}
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function hide(){["home","settings","topicMenu","quiz","done"].forEach(x=>$(x).classList.add("hidden"));$("dock").classList.add("hidden")}
function renderGrid(){$("grid").innerHTML=TOPICS.map(t=>`<button class="topic" onclick="openTopic('${t}')">${t}<small>30問${NOTES[t]?'<br>'+NOTES[t]:''}</small>${st.completed[t]?'<small style="color:#16813c;font-weight:800">✓ 習得完了</small>':''}</button>`).join("")}
function openTopic(t){st.topic=t;save();hide();$("topicTitle").textContent=t+" 30問";$("topicNote").textContent=NOTES[t]||"";$("topicMenu").classList.remove("hidden")}
function backHome(){hide();renderGrid();$("home").classList.remove("hidden")} function backTopic(){openTopic(st.topic)}
function showSettings(){hide();$("settings").classList.remove("hidden")} function saveSettings(){cfg.mode=$("mode").value;cfg.order=$("order").value;cfg.chatUrl=$("chatUrl").value.trim();save();backHome()}
function start(wrongOnly){let arr=BANK[st.topic];if(wrongOnly)arr=arr.filter(q=>st.wrongHist[st.topic+"|"+q.id]);if(!arr.length){alert("誤答履歴がありません。");return}st.active=true;st.round=1;st.idx=0;st.c=0;st.w=0;st.answered=false;st.retry=[];st.queue=arr.map(q=>q.id);if(cfg.order==="random")st.queue=sh(st.queue);save();showQuiz();render()}
function resume(){if(!st.active||!st.queue.length){alert("再開データがありません。");return}showQuiz();render()} function showQuiz(){hide();$("quiz").classList.remove("hidden");$("dock").classList.remove("hidden")}
function current(){return BANK[st.topic].find(q=>q.id===st.queue[st.idx])}
function render(){let q=current();if(!q){finish();return}st.answered=false;$("qid").textContent=q.id;$("qtopic").textContent=st.topic;$("point").textContent=q.point;$("round").textContent=`第${st.round}周`;$("remaining").textContent=st.queue.length-st.idx;$("correct").textContent=st.c;$("wrong").textContent=st.w;$("question").textContent=q.question;$("bar").style.width=(st.idx/st.queue.length*100)+"%";$("result").className="result";$("actions").className="actions";$("dock").classList.remove("hidden");save();window.scrollTo({top:0,behavior:"smooth"})}
function answer(a){if(st.answered)return;st.answered=true;let q=current(),ok=a===q.answer,key=st.topic+"|"+q.id;if(ok){st.c++;st.streak[key]=(st.streak[key]||0)+1}else{st.w++;st.streak[key]=0;st.wrongHist[key]=true}let mastered=ok&&(cfg.mode==="normal"||st.streak[key]>=2);if(!mastered)st.retry.push(q.id);$("result").className="result "+(ok?"ok":"ng");$("resultTitle").textContent=ok?"正解です":"不正解です";$("correctAnswer").textContent=q.answer?"○":"×";$("explanation").innerHTML="<br><b>解説：</b>"+q.explanation;$("memory").textContent="試験で覚える一言： "+q.memory;$("actions").className="actions show";$("dock").classList.add("hidden");save();$("result").scrollIntoView({behavior:"smooth",block:"center"})}
function next(){st.idx++;if(st.idx>=st.queue.length)finish();else render()}
function finish(){if(st.retry.length){st.round++;st.queue=cfg.order==="random"?sh([...new Set(st.retry)]):[...new Set(st.retry)].sort();st.retry=[];st.idx=0;render();return}st.active=false;st.completed[st.topic]=true;save();hide();$("doneTitle").textContent=st.topic+"・習得完了";$("doneText").textContent=`正解 ${st.c} 回、不正解 ${st.w} 回、第 ${st.round} 周で完了しました。`;$("done").classList.remove("hidden")}
async function openChat(){let q=current();if(!cfg.chatUrl){alert("共通設定で解説チャットURLを登録してください。");return}let p=`次の宅建一問一答を令和8年度宅建試験（2026年4月1日現在施行法令）を前提に詳しく解説してください。旧民法・旧制度と混同しないよう、原則・例外・ひっかけを説明してください。\n\n【分野】${st.topic}\n【論点】${q.point}\n【問題】${q.question}\n【正解】${q.answer?"○":"×"}\n【教材解説】${q.explanation}`;try{await navigator.clipboard.writeText(p);window.open(cfg.chatUrl,"_blank")}catch(e){alert("コピーに失敗しました。")}}
function resetAll(){if(!confirm("すべての進捗を削除しますか？"))return;localStorage.removeItem(KEY);st={topic:null,active:false,round:1,queue:[],retry:[],idx:0,c:0,w:0,answered:false,streak:{},wrongHist:{},completed:{}};save();backHome()}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));load();renderGrid();
</script></body></html>
