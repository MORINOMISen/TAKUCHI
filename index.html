:"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B07"},{"id":"LAW-B08","category":"建築基準法","point":"用途地域","question":"工業専用地域では、住宅を建築することができない。","answer":true,"explanation":"工業専用地域は住宅建築不可です。","memory":"工業専用地域＝住宅不可。","source":"建築基準法48条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B08"},{"id":"LAW-B09","category":"建築基準法","point":"用途地域","question":"ホテル・旅館は、第二種中高層住居専用地域では原則として建築できない。","answer":true,"explanation":"用途制限上、原則建築できません。","memory":"二種中高層＝ホテル旅館不可。","source":"収集No.320／平成29年 問19 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B09"},{"id":"LAW-B10","category":"建築基準法","point":"田園住居地域","question":"田園住居地域では北側斜線制限が適用される。","answer":true,"explanation":"田園住居地域は北側斜線制限の対象です。","memory":"田園住居＝北側斜線あり。","source":"収集No.195／令和2年12月 問18 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B10"},{"id":"LAW-B11","category":"建築基準法","point":"ホルムアルデヒド","question":"居室の内装にはホルムアルデヒドを発散する建築材料を一切使用できない。","answer":false,"explanation":"使用が全面禁止ではなく、材料区分や使用面積、換気設備等の規制があります。","memory":"ホルムアルデヒド＝全面禁止ではない。","source":"収集No.139／令和3年10月 問17 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B11"},{"id":"LAW-B12","category":"建築基準法","point":"非常用進入口","question":"高さ31m以下の部分にあるすべての階に、必ず非常用進入口を設けなければならない。","answer":false,"explanation":"一定の建築物・階について必要ですが、『すべての階』ではありません。","memory":"非常用進入口＝全階一律ではない。","source":"収集No.304／平成30年 問18 肢1","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B12"},{"id":"LAW-B13","category":"建築基準法","point":"2025年改正","question":"2025年4月以降、木造2階建て住宅は旧4号特例の対象として、構造関係規定の審査が原則省略される。","answer":false,"explanation":"2025年4月から旧4号特例が縮小され、木造2階建て等は新2号建築物として審査対象が広がりました。","memory":"2025改正＝木造2階建ては旧4号特例のままではない。","source":"国交省2025改正","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/report/press/content/001841001.pdf","subject":"法令上の制限","original_id":"B13"},{"id":"LAW-B14","category":"建築基準法","point":"大規模修繕等","question":"2025年4月以降、一定の木造戸建住宅でも大規模の修繕・模様替に建築確認が必要となる場合がある。","answer":true,"explanation":"改正により確認対象が見直されています。","memory":"2025改正＝木造戸建の大規模修繕も確認に注意。","source":"国交省2025改正","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/report/press/content/001841001.pdf","subject":"法令上の制限","original_id":"B14"},{"id":"LAW-B15","category":"建築基準法","point":"確認前広告","question":"建築確認が必要な未完成建物は、確認申請中と表示すれば宅建業法上の広告を開始できる。","answer":false,"explanation":"必要な建築確認等を受ける前の広告は禁止されます。","memory":"確認申請中でも広告NG。","source":"収集No.206／平成27年 問37 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B15"},{"id":"LAW-B16","category":"建築基準法","point":"建物貸借の35条","question":"建物の貸借では、準防火地域の建築物構造制限は35条の法定説明事項ではない。","answer":true,"explanation":"建物貸借では、この種の建築基準法上の制限は法定説明事項から外れます。","memory":"建物貸借＝準防火構造制限は35条不要。","source":"収集No.244／平成27年 問31 肢ウ","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B16"},{"id":"LAW-B17","category":"建築基準法","point":"宅地貸借の35条","question":"宅地の貸借では、道路斜線制限など一定の建築基準法上の制限を重要事項として説明する必要がある。","answer":true,"explanation":"宅地貸借では法令上の制限の説明範囲が広いです。","memory":"宅地貸借＝道路斜線など説明。","source":"収集No.223／平成27年 問31 肢ア","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B17"},{"id":"LAW-B18","category":"建築基準法","point":"用途制限","question":"用途地域ごとの建築物用途制限は、建築物の用途によって異なる。","answer":true,"explanation":"『どの地域に何を建てられるか』が得点ポイントです。","memory":"用途地域＝用途ごとに可否。","source":"建築基準法48条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B18"},{"id":"LAW-B19","category":"建築基準法","point":"特例許可","question":"用途地域内で本来建築できない用途でも、法定の特例許可等により建築できる場合がある。","answer":true,"explanation":"用途制限には特例許可の制度があります。","memory":"用途制限＝例外許可あり。","source":"建築基準法48条","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B19"},{"id":"LAW-B20","category":"建築基準法","point":"接道","question":"建築物の敷地が建築基準法上の道路に接していなくても、建築確認さえ受ければ常に建築できる。","answer":false,"explanation":"接道義務を満たさない敷地は原則建築できません。例外認定・許可等は別です。","memory":"接道しない土地＝原則建築不可。","source":"建築基準法43条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"B20"},{"id":"LAW-N01","category":"国土利用計画法","point":"事後届出面積","question":"市街化区域で2,000㎡以上の土地売買等の契約を締結した場合、原則として事後届出が必要である。","answer":true,"explanation":"市街化区域の基準は2,000㎡以上です。","memory":"国土法＝市街化区域2,000㎡。","source":"国交省土地取引規制","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/totikensangyo_tk2_000019.html","subject":"法令上の制限","original_id":"N01"},{"id":"LAW-N02","category":"国土利用計画法","point":"事後届出面積","question":"市街化区域以外の都市計画区域では、5,000㎡以上が事後届出の基準である。","answer":true,"explanation":"基準は5,000㎡以上です。","memory":"国土法＝その他都市計画区域5,000㎡。","source":"国交省土地取引規制","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/totikensangyo_tk2_000019.html","subject":"法令上の制限","original_id":"N02"},{"id":"LAW-N03","category":"国土利用計画法","point":"事後届出面積","question":"都市計画区域外では、10,000㎡以上が事後届出の基準である。","answer":true,"explanation":"基準は10,000㎡以上です。","memory":"国土法＝区域外10,000㎡。","source":"収集No.173／令和3年12月 問22 肢1","priority":"A","origin":"312問由来","verify_url":"https://www.mlit.go.jp/totikensangyo/totikensangyo_tk2_000019.html","subject":"法令上の制限","original_id":"N03"},{"id":"LAW-N04","category":"国土利用計画法","point":"届出義務者","question":"事後届出を行うのは、原則として土地に関する権利を取得する者である。","answer":true,"explanation":"買主など権利取得者が届出義務者です。","memory":"事後届出＝買主側。","source":"国交省Q&A","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/content/001361073.pdf","subject":"法令上の制限","original_id":"N04"},{"id":"LAW-N05","category":"国土利用計画法","point":"届出期限","question":"事後届出は、原則として契約締結の日から2週間以内に行う。","answer":true,"explanation":"契約日から起算して2週間以内です。","memory":"事後届出＝契約から2週間。","source":"国交省Q&A","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/content/001361073.pdf","subject":"法令上の制限","original_id":"N05"},{"id":"LAW-N06","category":"国土利用計画法","point":"相続","question":"相続による土地取得は、通常、国土利用計画法の事後届出の対象となる土地売買等の契約には当たらない。","answer":true,"explanation":"事後届出は対価を伴う契約による権利移転・設定が基本です。相続は契約ではありません。","memory":"相続＝国土法の事後届出不要。","source":"収集No.293／令和5年 問22 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"N06"},{"id":"LAW-N07","category":"国土利用計画法","point":"一団の土地","question":"個々の契約面積が基準未満でも、買主が一体として利用する一団の土地の合計が基準以上なら、届出が必要となる場合がある。","answer":true,"explanation":"買いの一団の考え方です。","memory":"小分けでも買いの一団なら合算に注意。","source":"国交省Q&A","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/content/001361073.pdf","subject":"法令上の制限","original_id":"N07"},{"id":"LAW-N08","category":"国土利用計画法","point":"分割売却","question":"市街化区域内の2,000㎡の土地を1,000㎡ずつ異なる2人に売却した場合、各買主は当然に事後届出を要する。","answer":false,"explanation":"各買主が取得する土地は1,000㎡で基準未満です。買主が異なれば通常は一団として合算しません。","memory":"国土法＝買主ごとに判定。","source":"収集No.190／令和元年 問22 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"N08"},{"id":"LAW-N09","category":"国土利用計画法","point":"監視区域","question":"監視区域では、都道府県等が定める面積以上の土地取引について事前届出制度が適用される。","answer":true,"explanation":"監視区域は事前届出制です。","memory":"監視区域＝事前届出。","source":"国交省土地取引規制","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/totikensangyo_tk2_000019.html","subject":"法令上の制限","original_id":"N09"},{"id":"LAW-N10","category":"国土利用計画法","point":"規制区域","question":"規制区域では、一定の土地取引は許可制となり、許可を得ずに締結した契約は効力を生じない。","answer":true,"explanation":"規制区域は最も厳しい制度です。","memory":"規制区域＝許可制・無許可契約は効力なし。","source":"国交省土地取引規制","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/totikensangyo_tk2_000019.html","subject":"法令上の制限","original_id":"N10"},{"id":"LAW-F01","category":"農地法","point":"農地の判定","question":"農地法上の農地かどうかは、登記簿上の地目だけでなく現況で判断される。","answer":true,"explanation":"現に耕作の目的に供されている土地かどうかが基本です。","memory":"農地＝登記地目より現況。","source":"収集No.305／令和2年12月 問21 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F01"},{"id":"LAW-F02","category":"農地法","point":"3条許可","question":"農地を農地のまま売買する場合、原則として農地法3条の許可が必要である。","answer":true,"explanation":"権利移動で農地転用を伴わない場合の基本です。","memory":"農地→農地の権利移動＝3条。","source":"農地法3条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F02"},{"id":"LAW-F03","category":"農地法","point":"4条許可","question":"自己所有の農地を自ら宅地に転用する場合、原則として農地法4条の許可が必要である。","answer":true,"explanation":"自己転用は4条です。","memory":"自己転用＝4条。","source":"農地法4条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F03"},{"id":"LAW-F04","category":"農地法","point":"5条許可","question":"農地を宅地に転用する目的で売買する場合、原則として農地法5条の許可が必要である。","answer":true,"explanation":"権利移動＋転用は5条です。","memory":"売買＋転用＝5条。","source":"農地法5条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F04"},{"id":"LAW-F05","category":"農地法","point":"市街化区域の転用","question":"市街化区域内の農地を転用目的で権利移転する場合、あらかじめ農業委員会に届出をすれば5条許可は不要となる。","answer":true,"explanation":"市街化区域内の特例です。","memory":"市街化区域の転用＝許可でなく事前届出。","source":"収集No.106／平成30年 問22 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F05"},{"id":"LAW-F06","category":"農地法","point":"相続","question":"相続により農地を取得する場合、農地法3条許可は不要だが、農業委員会への届出が必要である。","answer":true,"explanation":"相続は許可不要ですが届出が必要です。","memory":"相続＝3条許可不要・届出必要。","source":"収集No.136／令和3年10月 問21 肢1","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F06"},{"id":"LAW-F07","category":"農地法","point":"贈与","question":"親から子へ農地を贈与する場合、親子間であれば農地法3条許可は不要である。","answer":false,"explanation":"贈与も農地の権利移動であり、原則3条許可が必要です。","memory":"親子贈与でも3条。","source":"収集No.280／令和2年12月 問21 肢2","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F07"},{"id":"LAW-F08","category":"農地法","point":"賃貸借の対抗力","question":"農地の賃貸借は、登記がなくても農地の引渡しがあれば第三者に対抗できる。","answer":true,"explanation":"農地法上の特則です。","memory":"農地賃貸借＝引渡しで対抗。","source":"収集No.248／令和4年 問21 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F08"},{"id":"LAW-F09","category":"農地法","point":"5条申請","question":"農地法5条の許可申請は、原則として当事者が連署して申請する。","answer":true,"explanation":"一定の例外を除き、当事者連署が原則です。","memory":"5条申請＝原則連署。","source":"収集No.40／令和6年 問21 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F09"},{"id":"LAW-F10","category":"農地法","point":"公共団体の取得","question":"都道府県が市街化調整区域内の農地を取得して病院を建設する場合、法定の協議が成立すれば5条許可があったものとみなされることがある。","answer":true,"explanation":"国・都道府県等の転用には協議によるみなし許可の制度があります。","memory":"国・県の転用＝協議でみなし許可あり。","source":"収集No.323／令和3年10月 問21 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F10"},{"id":"LAW-F11","category":"農地法","point":"大規模転用","question":"市街化区域外の4ha超の農地転用は、現在も必ず農林水産大臣の許可を受ける。","answer":false,"explanation":"権限移譲後、原則として都道府県知事等の許可制度です。旧制度との混同に注意します。","memory":"4ha超＝必ず農水大臣、ではない。","source":"収集No.148／令和2年12月 問21 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F11"},{"id":"LAW-F12","category":"農地法","point":"無許可の効力","question":"3条許可が必要な農地売買で許可を受けていない場合、原則として所有権移転の効力は生じない。","answer":true,"explanation":"3条許可は権利移転の効力に関わります。","memory":"3条無許可＝権利移転の効力なし。","source":"農地法3条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F12"},{"id":"LAW-F13","category":"農地法","point":"転用届出の時期","question":"市街化区域内の農地転用の届出は、転用後に行えば足りる。","answer":false,"explanation":"あらかじめ届出が必要です。","memory":"市街化区域転用＝事前届出。","source":"農地法4条・5条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F13"},{"id":"LAW-F14","category":"農地法","point":"採草放牧地","question":"農地法3条は農地だけに適用され、採草放牧地の権利移動には一切適用されない。","answer":false,"explanation":"採草放牧地の権利移動にも一定の規制があります。","memory":"農地法＝採草放牧地も対象あり。","source":"農地法3条","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F14"},{"id":"LAW-F15","category":"農地法","point":"転用","question":"農地法上の転用とは、農地を農地以外のものにすることをいう。","answer":true,"explanation":"宅地・駐車場等への変更が典型です。","memory":"転用＝農地→農地以外。","source":"農地法","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"F15"},{"id":"LAW-M01","category":"盛土規制法","point":"規制区域","question":"盛土規制法では、都道府県知事等が基礎調査を踏まえて宅地造成等工事規制区域等を指定する。","answer":true,"explanation":"規制区域指定が制度の出発点です。","memory":"盛土規制＝まず区域指定。","source":"国交省盛土規制法","priority":"A","origin":"現行法補強","verify_url":"https://www.cbr.mlit.go.jp/kensei/morido/q_and_a.html","subject":"法令上の制限","original_id":"M01"},{"id":"LAW-M02","category":"盛土規制法","point":"許可","question":"規制区域内で対象規模の盛土・切土等を行う場合、原則として事前に都道府県知事等の許可が必要である。","answer":true,"explanation":"対象規模以上の工事は事前許可制です。","memory":"対象規模の盛土等＝事前許可。","source":"国交省盛土規制法","priority":"A","origin":"現行法補強","verify_url":"https://www.cbr.mlit.go.jp/kensei/morido/q_and_a.html","subject":"法令上の制限","original_id":"M02"},{"id":"LAW-M03","category":"盛土規制法","point":"土地所有者の責務","question":"過去の工事の工事主と現在の土地所有者が異なる場合でも、現在の所有者等には土地を安全な状態に維持する努力義務がある。","answer":true,"explanation":"土地所有者等に常時安全な状態を維持する努力義務があります。","memory":"現在の所有者にも安全維持の努力義務。","source":"収集No.76／令和4年 問19 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M03"},{"id":"LAW-M04","category":"盛土規制法","point":"勧告","question":"都道府県知事等は、災害防止上必要がある場合、土地所有者・管理者・占有者等に必要な措置を勧告できる。","answer":true,"explanation":"勧告・改善命令の制度があります。","memory":"危険な盛土＝所有者等に勧告あり。","source":"収集No.36／令和7年 問19 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M04"},{"id":"LAW-M05","category":"盛土規制法","point":"基礎調査の立入り","question":"基礎調査のため必要がある場合、都道府県知事等は他人の土地に立ち入って測量・調査を行わせることができる。","answer":true,"explanation":"正当な理由なく立入りを拒むことはできない仕組みです。","memory":"基礎調査＝必要なら土地立入り可。","source":"収集No.176／令和6年 問19 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M05"},{"id":"LAW-M06","category":"盛土規制法","point":"擁壁除却の届出","question":"規制区域内で高さ2mを超える擁壁を除却する工事は、一定の場合を除き工事着手の14日前までに届出が必要である。","answer":true,"explanation":"除却工事の事前届出規定です。","memory":"擁壁除却＝14日前届出。","source":"収集No.113／平成28年 問20 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M06"},{"id":"LAW-M07","category":"盛土規制法","point":"計画変更","question":"許可を受けた盛土等工事の計画を変更する場合、軽微な変更を除き、単なる届出だけで足りる。","answer":false,"explanation":"重要な計画変更は変更許可が必要です。軽微な変更は届出です。","memory":"重要変更＝変更許可、軽微＝届出。","source":"収集No.186／平成26年 問19 肢4","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M07"},{"id":"LAW-M08","category":"盛土規制法","point":"標識","question":"許可を受けた工事主は、工事区域の見やすい場所に所定事項を記載した標識を掲げる。","answer":true,"explanation":"現場での標識掲示義務があります。","memory":"許可工事＝現場に標識。","source":"収集No.192／令和7年 問19 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M08"},{"id":"LAW-M09","category":"盛土規制法","point":"虚偽許可","question":"偽りその他不正な手段で許可を受けた者に対し、都道府県知事等は許可を取り消すことができる。","answer":true,"explanation":"不正許可に対する取消しです。","memory":"不正取得の許可＝取消し可。","source":"収集No.258／平成23年 問20 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M09"},{"id":"LAW-M10","category":"盛土規制法","point":"造成宅地防災区域","question":"造成宅地防災区域の指定理由がなくなったと認めるとき、都道府県知事はその指定を解除する。","answer":true,"explanation":"防災措置等で指定理由がなくなれば解除します。","memory":"造成宅地防災区域＝理由消滅で解除。","source":"収集No.159／平成23年 問20 肢1","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M10"},{"id":"LAW-M11","category":"盛土規制法","point":"公共施設用地","question":"道路・公園・河川など公共施設用地で行う工事は、盛土規制法の適用除外となるものがある。","answer":true,"explanation":"法律上の公共施設用地は適用除外です。","memory":"公共施設用地＝適用除外あり。","source":"国交省対象外工事","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/toshi/content/11_morido_taisyougai_yoko.pdf","subject":"法令上の制限","original_id":"M11"},{"id":"LAW-M12","category":"盛土規制法","point":"非常災害","question":"国や地方公共団体が非常災害のため必要な応急措置として行う一定の工事は、許可不要となる。","answer":true,"explanation":"災害のおそれがないと認められる一定工事として扱われます。","memory":"国・自治体の非常災害応急工事＝許可不要あり。","source":"国交省対象外工事","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/toshi/content/11_morido_taisyougai_yoko.pdf","subject":"法令上の制限","original_id":"M12"},{"id":"LAW-M13","category":"盛土規制法","point":"許可不要工事","question":"高さ2m以下かつ面積500㎡超の盛土・切土で、厚さが30cm以下なら一定の場合に許可不要となる。","answer":true,"explanation":"現行省令の許可不要工事の整理に含まれます。","memory":"薄い盛土切土＝一定の許可不要あり。","source":"国交省対象外工事","priority":"C","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/toshi/content/11_morido_taisyougai_yoko.pdf","subject":"法令上の制限","original_id":"M13"},{"id":"LAW-M14","category":"盛土規制法","point":"切土600㎡・崖3m","question":"規制区域内で面積600㎡、切土により高さ3mの崖が生じる工事は、一定の例外を除き許可対象となる。","answer":true,"explanation":"許可対象規模に該当します。","memory":"600㎡・切土3m崖＝許可対象。","source":"収集No.200／平成26年 問19 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M14"},{"id":"LAW-M15","category":"盛土規制法","point":"切土500㎡・崖1.5m","question":"規制区域内で切土面積500㎡、崖高1.5m、盛土なしの場合は、他の許可要件に該当しなければ許可不要となる。","answer":true,"explanation":"面積・高さの許可対象規模に達していないケースです。","memory":"500㎡・切土1.5m＝原則許可不要。","source":"収集No.224／令和3年10月 問19 肢1","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"M15"},{"id":"LAW-K01","category":"土地区画整理法","point":"施行者","question":"土地区画整理事業は、地方公共団体だけでなく、個人・組合・区画整理会社等が施行者となることがある。","answer":true,"explanation":"施行者は複数類型あります。","memory":"区画整理＝施行者は自治体だけではない。","source":"土地区画整理法","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K01"},{"id":"LAW-K02","category":"土地区画整理法","point":"換地","question":"換地とは、従前の宅地に代えて整理後の土地を交付する仕組みである。","answer":true,"explanation":"区画整理の中心概念です。","memory":"換地＝従前地に代わる整理後の土地。","source":"土地区画整理法","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K02"},{"id":"LAW-K03","category":"土地区画整理法","point":"仮換地","question":"仮換地が指定されると、従前地の所有権そのものが直ちに仮換地へ移転する。","answer":false,"explanation":"所有権そのものは従前地に残り、使用収益の対象が仮換地へ移ります。","memory":"仮換地＝所有権移転ではない。","source":"土地区画整理法99条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K03"},{"id":"LAW-K04","category":"土地区画整理法","point":"仮換地の使用収益","question":"仮換地指定後、従前地の権利者は原則として仮換地を従前地と同様に使用収益できる。","answer":true,"explanation":"仮換地指定の主要な効果です。","memory":"仮換地＝使用収益先が移る。","source":"土地区画整理法99条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K04"},{"id":"LAW-K05","category":"土地区画整理法","point":"使用開始日","question":"仮換地の使用収益開始日は、必ず仮換地指定の効力発生日と同じ日にしなければならない。","answer":false,"explanation":"工事の都合等により別に使用収益開始日を定めることがあります。","memory":"仮換地指定日＝使用開始日とは限らない。","source":"収集No.249／平成30年 問21 肢4","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K05"},{"id":"LAW-K06","category":"土地区画整理法","point":"保留地","question":"組合施行の土地区画整理事業でも、事業費に充てるため一定の土地を保留地として定めることができる。","answer":true,"explanation":"保留地を処分して事業費に充てる仕組みがあります。","memory":"区画整理＝保留地あり。","source":"収集No.227／平成24年 問21 肢3","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K06"},{"id":"LAW-K07","category":"土地区画整理法","point":"区画整理会社と保留地","question":"区画整理会社が施行する場合、換地計画で保留地を定めることはできない。","answer":false,"explanation":"区画整理会社施行でも一定の保留地を定めることができます。","memory":"区画整理会社でも保留地可。","source":"収集No.61／平成23年 問21 肢3","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K07"},{"id":"LAW-K08","category":"土地区画整理法","point":"換地処分","question":"換地処分は、原則として関係権利者への通知によって行われる。","answer":true,"explanation":"施行者が関係権利者に通知して換地処分を行います。","memory":"換地処分＝通知。","source":"土地区画整理法103条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K08"},{"id":"LAW-K09","category":"土地区画整理法","point":"換地処分の効力","question":"換地処分の公告があった日の翌日から、換地は従前の宅地とみなされる。","answer":true,"explanation":"権利関係が換地へ移る重要時点です。","memory":"換地の効力＝公告翌日。","source":"土地区画整理法104条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K09"},{"id":"LAW-K10","category":"土地区画整理法","point":"清算金","question":"換地の不均衡を金銭で調整するため清算金を定めることがある。","answer":true,"explanation":"土地価値の差を清算金で調整します。","memory":"換地の差＝清算金で調整。","source":"土地区画整理法94条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K10"},{"id":"LAW-K11","category":"土地区画整理法","point":"減歩","question":"土地区画整理では、公共施設用地や保留地を生み出すため、従前地より換地面積が小さくなることがある。","answer":true,"explanation":"いわゆる減歩です。","memory":"区画整理＝減歩あり。","source":"土地区画整理法","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K11"},{"id":"LAW-K12","category":"土地区画整理法","point":"建築行為の制限","question":"土地区画整理事業の施行地区内で、事業の施行の障害となるおそれのある一定の建築行為等には許可が必要となる。","answer":true,"explanation":"事業期間中の建築行為等に制限があります。","memory":"施行地区内の建築＝許可に注意。","source":"土地区画整理法76条","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K12"},{"id":"LAW-K13","category":"土地区画整理法","point":"組合総会","question":"土地区画整理組合の総会は、定款に特別の定めがなければ組合員の半数以上の出席がなければ開けない。","answer":true,"explanation":"総会成立の定足数に関する基本です。","memory":"組合総会＝原則半数以上出席。","source":"収集No.141／令和2年10月 問20 肢2","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K13"},{"id":"LAW-K14","category":"土地区画整理法","point":"仮換地と登記","question":"仮換地が指定された時点で、仮換地について所有権移転登記が当然にされる。","answer":false,"explanation":"仮換地指定は登記上の所有権移転ではありません。","memory":"仮換地＝登記上の所有権はまだ従前地。","source":"土地区画整理法","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K14"},{"id":"LAW-K15","category":"土地区画整理法","point":"換地不交付","question":"換地計画では、特別の事情により宅地について換地を定めず、金銭清算とする場合がある。","answer":true,"explanation":"小宅地等について換地を定めないケースがあります。","memory":"換地＝必ず全員に土地を渡すとは限らない。","source":"土地区画整理法91条","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"K15"},{"id":"LAW-O01","category":"その他の法令上の制限","point":"宅地貸借の35条","question":"宅地の貸借では、法令上の制限の説明範囲は建物の貸借より広い。","answer":true,"explanation":"宅地貸借では建築基準法等の法令制限が35条説明事項になります。","memory":"宅地貸借＝法令制限を広く説明。","source":"収集No.223・244","priority":"A","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O01"},{"id":"LAW-O02","category":"その他の法令上の制限","point":"文化財保護法","question":"周知の埋蔵文化財包蔵地で土木工事等を行う場合、文化財保護法上の届出等が必要となることがある。","answer":true,"explanation":"宅建では法令制限の一つとして出題されます。","memory":"埋蔵文化財＝工事前届出に注意。","source":"文化財保護法93条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O02"},{"id":"LAW-O03","category":"その他の法令上の制限","point":"自然公園法","question":"国立公園の特別地域内では、工作物の新築など一定の行為に環境大臣の許可が必要となることがある。","answer":true,"explanation":"特別地域内の行為規制です。","memory":"国立公園特別地域＝一定行為は許可。","source":"自然公園法20条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O03"},{"id":"LAW-O04","category":"その他の法令上の制限","point":"森林法","question":"地域森林計画の対象民有林で一定規模を超える開発行為を行う場合、都道府県知事の許可が必要となることがある。","answer":true,"explanation":"林地開発許可制度です。","memory":"民有林の大規模開発＝林地開発許可。","source":"森林法10条の2","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O04"},{"id":"LAW-O05","category":"その他の法令上の制限","point":"河川法","question":"河川区域内で土地の掘削や工作物の新築等を行う場合、河川管理者の許可が必要となることがある。","answer":true,"explanation":"河川区域では土地利用に許可規制があります。","memory":"河川区域＝掘削・工作物は許可に注意。","source":"河川法24条・26条・27条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O05"},{"id":"LAW-O06","category":"その他の法令上の制限","point":"道路法","question":"道路区域内で工作物等を設置して道路を占用するには、道路管理者の許可が必要となる。","answer":true,"explanation":"道路占用許可の基本です。","memory":"道路占用＝道路管理者の許可。","source":"道路法32条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O06"},{"id":"LAW-O07","category":"その他の法令上の制限","point":"土砂災害防止法","question":"土砂災害特別警戒区域では、一定の開発行為に都道府県知事の許可が必要となることがある。","answer":true,"explanation":"住宅宅地分譲等の特定開発行為が規制されます。","memory":"特別警戒区域＝一定開発は許可。","source":"土砂災害防止法10条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O07"},{"id":"LAW-O08","category":"その他の法令上の制限","point":"生産緑地法","question":"生産緑地地区内では、建築物の新築等が原則として自由にできる。","answer":false,"explanation":"生産緑地地区では建築等に制限があります。","memory":"生産緑地＝建築等に制限。","source":"生産緑地法8条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O08"},{"id":"LAW-O09","category":"その他の法令上の制限","point":"都市緑地法","question":"特別緑地保全地区内で建築物の新築等を行う場合、都道府県知事等の許可が必要となることがある。","answer":true,"explanation":"緑地保全のため行為制限があります。","memory":"特別緑地保全地区＝一定行為は許可。","source":"都市緑地法14条","priority":"C","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O09"},{"id":"LAW-O10","category":"その他の法令上の制限","point":"急傾斜地法","question":"急傾斜地崩壊危険区域内では、のり切り・切土・盛土など一定の行為に都道府県知事の許可が必要となることがある。","answer":true,"explanation":"崩壊防止のための行為制限です。","memory":"急傾斜地危険区域＝切盛土等は許可に注意。","source":"急傾斜地法7条","priority":"B","origin":"312問由来","verify_url":"","subject":"法令上の制限","original_id":"O10"}];

function load(){try{const x=localStorage.getItem(KEY);if(x)st=JSON.parse(x)}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function renderSubjects(){
  const names=["宅建業法","権利関係","法令上の制限"];
  $("subjectGrid").innerHTML=names.map(s=>{const m=META[s];return `<button class="subject" onclick="openSubject('${s}')"><b>${s}</b><small>最優先 ${m.a_count}問／全 ${m.count}問</small><span class="count">${m.categories.length}分野</span></button>`;}).join("");
}
function hideAll(){["subjects","subjectMenu","quiz","done"].forEach(x=>$(x).classList.add("hidden"));$("dock").classList.add("hidden")}
function showSubjects(){hideAll();$("subjects").classList.remove("hidden");selectedSubject=null;window.scrollTo(0,0)}
function openSubject(s){
  selectedSubject=s;st.subject=s;save();hideAll();$("subjectMenu").classList.remove("hidden");
  $("subjectTitle").textContent=s+"・短期攻略100問";$("aBtn").textContent="★ 最優先 "+META[s].a_count+"問";
  $("categoryGrid").innerHTML=META[s].categories.map(c=>{const n=Q.filter(q=>q.subject===s&&q.category===c).length;return `<button class="topic" data-cat="${c}">${c}<small>${n}問</small></button>`;}).join("");
  document.querySelectorAll("#categoryGrid .topic").forEach(btn=>btn.addEventListener("click",()=>startCategory(btn.dataset.cat)));
  window.scrollTo(0,0);
}
function startArray(arr,mode){
  if(!arr.length){alert("対象問題がありません。");return}
  let ids=arr.map(x=>x.id);if($("order").value==="random")ids=shuffle(ids);
  st.queue=ids;st.idx=0;st.c=0;st.w=0;st.answered=false;st.mode=mode;st.subject=selectedSubject;save();
  hideAll();$("quiz").classList.remove("hidden");$("dock").classList.remove("hidden");render();
}
function startSubjectMode(m){startArray(Q.filter(q=>q.subject===selectedSubject&&(m!=="A"||q.priority==="A")),m==="A"?"最優先":"全100問")}
function startCategory(c){startArray(Q.filter(q=>q.subject===selectedSubject&&q.category===c),c)}
function startWrongSubject(){const arr=Q.filter(q=>q.subject===selectedSubject&&st.wrong[q.id]);if(!arr.length){alert("この分野の誤答履歴はありません。");return}startArray(arr,"誤答だけ")}
function current(){return Q.find(q=>q.id===st.queue[st.idx])}
function render(){
  const q=current();if(!q){finish();return}selectedSubject=q.subject;st.answered=false;
  $("qid").textContent=q.original_id||q.id;$("priority").textContent="優先 "+q.priority;$("priority").className="pill "+(q.priority==="A"?"A":"");
  $("subj").textContent=q.subject;$("cat").textContent=q.category;$("point").textContent=q.point;
  $("remaining").textContent=st.queue.length-st.idx;$("correct").textContent=st.c;$("wrong").textContent=st.w;$("question").textContent=q.question;
  $("bar").style.width=(st.idx/st.queue.length*100)+"%";$("result").className="result";$("actions").className="actions";$("dock").classList.remove("hidden");save();window.scrollTo({top:0,behavior:"smooth"});
}
function answer(a){
  if(st.answered)return;st.answered=true;const q=current(),ok=a===q.answer;if(ok)st.c++;else{st.w++;st.wrong[q.id]=true}
  $("result").className="result "+(ok?"ok":"ng");$("rt").textContent=ok?"正解":"不正解";$("ca").textContent=q.answer?"○":"×";
  $("ex").innerHTML="<br><b>解説：</b>"+q.explanation;$("mem").textContent="試験で覚える一言： "+q.memory;$("src").textContent="根拠： "+q.source;
  $("actions").className="actions show";$("dock").classList.add("hidden");save();$("result").scrollIntoView({behavior:"smooth",block:"center"});
}
function next(){st.idx++;if(st.idx>=st.queue.length)finish();else render()}
function finish(){hideAll();$("done").classList.remove("hidden");$("doneText").textContent=`${selectedSubject}／${st.mode}：正解 ${st.c}、不正解 ${st.w}。誤答は保存しました。`;save();window.scrollTo(0,0)}
function backSubject(){if(!selectedSubject)selectedSubject=st.subject;if(selectedSubject)openSubject(selectedSubject);else showSubjects()}
function resetSubject(){if(!selectedSubject)return;if(confirm(selectedSubject+"の誤答履歴を削除しますか？")){Q.filter(q=>q.subject===selectedSubject).forEach(q=>delete st.wrong[q.id]);save();alert("この分野の誤答履歴をリセットしました。")}}
load();renderSubjects();showSubjects();
</script>
</body></html>
