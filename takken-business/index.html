const Q=[{"id":"B01","category":"基本・免許","point":"宅建業の範囲","question":"自己所有の建物を反復継続して他人に賃貸する行為は、宅地建物取引業に該当する。","answer":false,"explanation":"自ら貸主となって宅地・建物を賃貸する行為は、宅建業法上の『宅地建物取引業』には含まれません。売買・交換を自ら行う場合とは区別します。","memory":"自ら貸すだけ＝宅建業ではない。","source":"収集No.270／令和5年 問38 肢ア","priority":"A","origin":"312問由来","verify_url":""},{"id":"B02","category":"基本・免許","point":"免許権者","question":"1つの都道府県内だけに宅建業法上の事務所を置く場合、原則としてその都道府県知事の免許を受ける。","answer":true,"explanation":"事務所が1都道府県内だけなら知事免許、2以上の都道府県にまたがれば国土交通大臣免許です。","memory":"1県＝知事、2県以上＝大臣。","source":"国交省免許制度／収集No.182","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000242.html"},{"id":"B03","category":"基本・免許","point":"本店の扱い","question":"甲県に本店、乙県に支店があり、宅建業を営むのが乙県の支店だけでも、本店は宅建業法上の事務所と扱われるため国土交通大臣免許が必要となる。","answer":true,"explanation":"支店だけで宅建業を営む場合でも、本店は主たる事務所として扱われます。結果として2都道府県に事務所を有することになります。","memory":"支店だけ営業でも本店を数える。","source":"収集No.182／令和7年 問41 肢3","priority":"A","origin":"312問由来","verify_url":""},{"id":"B04","category":"基本・免許","point":"免許有効期間","question":"宅地建物取引業の免許の有効期間は5年間である。","answer":true,"explanation":"免許の有効期間は5年間です。","memory":"免許＝5年。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000242.html"},{"id":"B05","category":"基本・免許","point":"更新申請","question":"免許の更新申請は、有効期間満了日の90日前から30日前までに行う。","answer":true,"explanation":"引き続き宅建業を営む場合、更新申請は満了日の90日前から30日前までが原則です。","memory":"更新＝90日前～30日前。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000242.html"},{"id":"B06","category":"基本・免許","point":"更新処分待ち","question":"適法に免許更新を申請したが満了日までに処分がされない場合、従前の免許は満了日に当然失効する。","answer":false,"explanation":"更新申請が適法にされていれば、処分があるまで従前の免許は引き続き効力を有します。","memory":"更新申請済み＝処分まで免許継続。","source":"収集No.152／令和6年 問38 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"B07","category":"基本・免許","point":"変更届","question":"事務所の所在地など免許申請書の一定の記載事項に変更が生じたときは、原則30日以内に変更の届出を行う。","answer":true,"explanation":"事務所の新設等、一定の変更事項は30日以内の届出が必要です。","memory":"変更届＝30日以内。","source":"収集No.208／令和5年 問32 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"B08","category":"基本・免許","point":"廃業届","question":"法人が株主総会決議で解散した場合、清算人が解散の日から30日以内に廃業等の届出をする。","answer":true,"explanation":"法人の解散では清算人が30日以内に届出をします。旧役員が60日以内、ではありません。","memory":"法人解散＝清算人・30日。","source":"収集No.87／令和7年 問41 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"B09","category":"基本・免許","point":"免許の承継","question":"個人の宅建業者が法人化して新会社の代表取締役になれば、その新会社は個人の免許を承継できる。","answer":false,"explanation":"宅建業免許は承継されません。新会社は別途免許を受ける必要があります。","memory":"法人化しても免許は引き継げない。","source":"収集No.218／平成29年 問44 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"B10","category":"基本・免許","point":"欠格事由","question":"禁錮・拘禁刑など一定の刑に処せられた者は、刑の執行終了等から原則5年を経過しなければ免許の欠格事由から外れない。","answer":true,"explanation":"一定の刑罰を受けた者には5年間の欠格期間があります。法人では役員等の欠格も法人の免許に影響します。","memory":"一定の刑＝原則5年。","source":"収集No.129／令和元年 問43 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"T01","category":"宅建士・事務所","point":"専任宅建士の人数","question":"事務所では、宅建業に従事する者5人につき1人以上の割合で成年者である専任宅建士を置く。","answer":true,"explanation":"事務所の法定割合は5人に1人以上です。","memory":"事務所＝5人に1人。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.hrr.mlit.go.jp/kensei/sangyo/fudousan/license.html"},{"id":"T02","category":"宅建士・事務所","point":"案内所の専任宅建士","question":"一団の分譲の案内所で契約締結も申込み受付もしない場合でも、専任宅建士を1人以上置かなければならない。","answer":false,"explanation":"一定の案内所で専任宅建士が必要なのは、契約締結又は契約の申込みを受ける場所などです。","memory":"契約行為なしの案内所＝専任宅建士不要。","source":"収集No.162／令和3年12月 問41 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"T03","category":"宅建士・事務所","point":"35条説明者","question":"35条の重要事項説明を行う宅建士は、その事務所の専任宅建士でなければならない。","answer":false,"explanation":"専任である必要はありません。その宅建業者の業務に従事する宅建士であれば重要事項説明を行えます。","memory":"35条説明＝専任でなくてよい。","source":"収集No.202／令和3年10月 問26 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"T04","category":"宅建士・事務所","point":"35条・37条の記名","question":"35条書面や37条書面に記名する宅建士も、専任宅建士である必要はない。","answer":true,"explanation":"35条書面・37条書面の記名についても、専任性は要求されません。","memory":"記名も専任不要。","source":"収集No.335／平成27年 問29 肢4","priority":"A","origin":"312問由来","verify_url":""},{"id":"T05","category":"宅建士・事務所","point":"登録の移転","question":"甲県登録の宅建士が乙県の宅建業者の専任宅建士に就任する場合、必ず乙県へ登録を移転しなければならない。","answer":false,"explanation":"登録の移転は可能ですが義務ではありません。勤務先の所在地と登録都道府県が一致している必要はありません。","memory":"登録移転＝できる、義務ではない。","source":"収集No.284／令和4年 問33 肢イ","priority":"B","origin":"312問由来","verify_url":""},{"id":"T06","category":"宅建士・事務所","point":"取引士証の有効期間","question":"登録を他県へ移転して新しい宅建士証の交付を受けると、有効期間はその交付日から新たに5年間となる。","answer":false,"explanation":"登録移転に伴う新しい宅建士証の有効期間は、従前の宅建士証の残存期間と同じです。","memory":"登録移転しても有効期限はリセットされない。","source":"収集No.315／平成28年 問38 肢ア","priority":"B","origin":"312問由来","verify_url":""},{"id":"T07","category":"宅建士・事務所","point":"法定講習","question":"宅建試験合格から1年を超えて宅建士証の交付を受ける場合、原則として申請前6か月以内の法定講習を受ける。","answer":true,"explanation":"試験合格後1年以内の交付なら法定講習は不要ですが、それを超える場合は原則受講が必要です。","memory":"合格後1年超＝6か月以内講習。","source":"収集No.128／平成29年 問30 肢3","priority":"B","origin":"312問由来","verify_url":""},{"id":"T08","category":"宅建士・事務所","point":"従業者証明書","question":"宅建士証を携帯している宅建士は、従業者証明書を携帯しなくてもよい。","answer":false,"explanation":"宅建士証と従業者証明書は別物です。宅建士であっても業務従事中は従業者証明書が必要です。","memory":"取引士証≠従業者証明書。","source":"収集No.312／平成25年 問41 肢4","priority":"A","origin":"312問由来","verify_url":""},{"id":"T09","category":"宅建士・事務所","point":"従業者名簿","question":"一時的に事務の補助のため雇用した者でも宅建業に従事するなら、従業者名簿への記載対象となる。","answer":true,"explanation":"一時的な補助者も、宅建業に従事するなら従業者名簿の対象です。","memory":"短期雇用でも従事者なら名簿へ。","source":"収集No.333／平成29年 問35 肢4","priority":"B","origin":"312問由来","verify_url":""},{"id":"T10","category":"宅建士・事務所","point":"事務所の掲示・備付け","question":"宅建業者の事務所では標識と報酬額を掲示し、従業者名簿・帳簿を備えるが、免許証そのものの掲示義務はない。","answer":true,"explanation":"免許証の掲示義務はありません。標識には免許証番号等が記載されます。","memory":"事務所＝標識・報酬表・名簿・帳簿。免許証掲示なし。","source":"収集No.183／令和4年 問26 肢3","priority":"A","origin":"312問由来","verify_url":""},{"id":"G01","category":"営業保証金・保証協会","point":"営業保証金額","question":"営業保証金は、主たる事務所1,000万円、従たる事務所1か所につき500万円である。","answer":true,"explanation":"営業保証金の基本額です。","memory":"営業保証金＝本店1000・支店500。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.hrr.mlit.go.jp/kensei/sangyo/fudousan/license.html"},{"id":"G02","category":"営業保証金・保証協会","point":"供託先","question":"営業保証金は本店・支店ごとにそれぞれ最寄りの供託所へ供託する。","answer":false,"explanation":"支店分も含め、主たる事務所の最寄りの供託所にまとめて供託します。","memory":"営業保証金＝本店最寄りにまとめて。","source":"収集No.168／平成24年 問33 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"G03","category":"営業保証金・保証協会","point":"地方債の評価","question":"地方債証券を営業保証金に充てる場合、額面金額の90％で評価される。","answer":true,"explanation":"地方債証券は額面の90％評価です。","memory":"地方債＝90％。","source":"収集No.177／平成24年 問33 肢1","priority":"B","origin":"312問由来","verify_url":""},{"id":"G04","category":"営業保証金・保証協会","point":"本店移転・金銭のみ","question":"本店移転で最寄り供託所が変わり、営業保証金を金銭のみで供託している場合、従前の供託所に保管替えを請求する。","answer":true,"explanation":"金銭のみなら保管替えです。","memory":"金銭だけ＝保管替え。","source":"収集No.252／令和6年 問27 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"G05","category":"営業保証金・保証協会","point":"本店移転・有価証券あり","question":"営業保証金に有価証券が含まれる場合、本店移転で供託所が変わったときは新供託所に全額を新たに供託し、その後旧供託所から取り戻す。","answer":true,"explanation":"有価証券を含む場合は保管替えができません。","memory":"債券あり＝新供託→旧供託取戻し。","source":"収集No.214・246","priority":"A","origin":"312問由来","verify_url":""},{"id":"G06","category":"営業保証金・保証協会","point":"還付対象","question":"家賃収納代行業務によって生じた債権も、営業保証金から還付を受けられる。","answer":false,"explanation":"還付対象は宅建業に関する取引から生じた債権です。家賃収納代行は宅建業ではありません。","memory":"営業保証金の還付＝宅建取引の債権だけ。","source":"収集No.220／平成30年 問43 肢2","priority":"B","origin":"312問由来","verify_url":""},{"id":"G07","category":"営業保証金・保証協会","point":"保証協会分担金","question":"保証協会の弁済業務保証金分担金は、主たる事務所60万円、従たる事務所1か所につき30万円である。","answer":true,"explanation":"保証協会加入時の基本額です。","memory":"保証協会＝本店60・支店30。","source":"国交省免許制度","priority":"A","origin":"現行法補強","verify_url":"https://www.hrr.mlit.go.jp/kensei/sangyo/fudousan/license.html"},{"id":"G08","category":"営業保証金・保証協会","point":"分担金の納付方法","question":"宅建業者が保証協会へ納付する弁済業務保証金分担金は、有価証券でも納付できる。","answer":false,"explanation":"分担金は金銭で納付します。一方、保証協会が供託する弁済業務保証金には一定の有価証券を充てることができます。","memory":"分担金＝現金だけ。","source":"収集No.144／平成23年 問43 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"G09","category":"営業保証金・保証協会","point":"一部事務所廃止","question":"保証協会の社員が一部の事務所を廃止して分担金の返還を受ける場合、還付請求権者への公告が必ず必要である。","answer":false,"explanation":"一部事務所廃止による分担金返還では公告不要です。社員の地位を失った場合とは区別します。","memory":"保証協会・一部廃止＝公告不要。","source":"収集No.112／平成30年 問44 肢4","priority":"B","origin":"312問由来","verify_url":""},{"id":"G10","category":"営業保証金・保証協会","point":"社員資格喪失","question":"還付充当金を納付せず保証協会の社員資格を失った宅建業者は、資格喪失後1週間以内に営業保証金を供託する必要がある。","answer":true,"explanation":"資格を失った後は営業保証金制度へ移るため、1週間以内の供託が必要です。供託しても社員資格が自動回復するわけではありません。","memory":"保証協会を失ったら1週間で営業保証金。","source":"収集No.120／令和元年 問33 肢4","priority":"A","origin":"312問由来","verify_url":""},{"id":"M01","category":"媒介契約","point":"書面交付","question":"宅地・建物の売買又は交換の媒介契約を締結した宅建業者は、一般媒介でも所定事項を記載した媒介契約書面を交付する。","answer":true,"explanation":"一般媒介も書面交付の対象です。","memory":"売買・交換の媒介＝一般でも書面。","source":"収集No.225","priority":"A","origin":"312問由来","verify_url":""},{"id":"M02","category":"媒介契約","point":"価額の記載","question":"一般媒介契約では、媒介契約書面に売買すべき価額を記載しなくてもよい。","answer":false,"explanation":"売買すべき価額は媒介契約の種類を問わず記載事項です。","memory":"価額＝一般でも記載。","source":"収集No.225／令和4年 問31 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"M03","category":"媒介契約","point":"宅建士記名","question":"媒介契約書面には、媒介を担当する宅建士の記名が必要である。","answer":false,"explanation":"媒介契約書面の作成・交付義務は宅建業者にあり、宅建士の記名義務はありません。","memory":"媒介契約書＝宅建士記名不要。","source":"収集No.239／平成28年 問27 肢3","priority":"A","origin":"312問由来","verify_url":""},{"id":"M04","category":"媒介契約","point":"専任媒介の期間","question":"専任媒介契約で有効期間を6か月と定めると、契約全体が無効になる。","answer":false,"explanation":"3か月を超える部分だけが制限され、期間は3か月となります。契約全体が無効になるわけではありません。","memory":"専任6か月→無効ではなく3か月。","source":"収集No.240／令和元年 問31 肢イ","priority":"A","origin":"312問由来","verify_url":""},{"id":"M05","category":"媒介契約","point":"更新","question":"専任媒介契約は依頼者の申出により更新できるが、更新後も3か月を超えることはできない。","answer":true,"explanation":"更新も依頼者の申出が必要で、更新後の期間も3か月上限です。","memory":"更新も依頼者申出・3か月。","source":"収集No.254／平成25年 問28 肢ウ","priority":"A","origin":"312問由来","verify_url":""},{"id":"M06","category":"媒介契約","point":"自動更新","question":"依頼者があらかじめ希望していれば、専任媒介契約を自動更新する特約は有効である。","answer":false,"explanation":"専任媒介契約の更新には、その都度依頼者の申出が必要です。自動更新特約は認められません。","memory":"専任媒介＝自動更新NG。","source":"収集No.281／令和2年10月 問29 肢ウ","priority":"A","origin":"312問由来","verify_url":""},{"id":"M07","category":"媒介契約","point":"業務処理報告","question":"一般媒介契約では、法律上の業務処理状況の定期報告義務はない。","answer":true,"explanation":"定期報告義務は専任媒介・専属専任媒介の規制です。","memory":"一般媒介＝定期報告義務なし。","source":"収集No.138／令和3年10月 問38 肢イ","priority":"B","origin":"312問由来","verify_url":""},{"id":"M08","category":"媒介契約","point":"指定流通機構","question":"指定流通機構に登録した物件の売買契約が成立したときは、引渡し前でも遅滞なく契約成立を通知する。","answer":true,"explanation":"引渡しの完了は条件ではありません。登録番号・取引価格・契約成立日などを通知します。","memory":"REINS成約通知＝契約成立後すぐ。","source":"収集No.125／平成28年 問27 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"M09","category":"媒介契約","point":"建物状況調査","question":"既存建物の媒介では、建物状況調査を実施する者のあっせんの有無を媒介契約書面に記載する。","answer":true,"explanation":"既存住宅媒介の重要ポイントです。","memory":"既存建物＝調査あっせんの有無を媒介契約書へ。","source":"収集No.267／令和元年 問31 肢エ","priority":"B","origin":"312問由来","verify_url":""},{"id":"M10","category":"媒介契約","point":"建物状況調査実施者","question":"建物状況調査を実施できる者は、建築士であれば講習を受けていなくてもよい。","answer":false,"explanation":"建築士であり、かつ国土交通大臣が定める講習を修了した者である必要があります。","memory":"状況調査＝建築士＋講習修了。","source":"収集No.255・267","priority":"B","origin":"312問由来","verify_url":""},{"id":"I01","category":"35条重要事項説明","point":"時期","question":"重要事項説明は、売買・賃貸借契約が成立した後に行っても、相手方が同意していればよい。","answer":false,"explanation":"35条の説明は契約成立までに行わなければなりません。","memory":"35条＝契約前。","source":"収集No.311／平成23年 問33 肢3","priority":"A","origin":"312問由来","verify_url":""},{"id":"I02","category":"35条重要事項説明","point":"説明と書面交付のタイミング","question":"35条書面を先に交付し、後日、契約締結前に宅建士が重要事項説明をすることは可能である。","answer":true,"explanation":"書面交付と説明が必ず同時である必要はありません。いずれも契約成立前に適切に行うことが必要です。","memory":"35書面と説明は同時でなくてもよい。","source":"収集No.27／平成23年 問33 肢4","priority":"B","origin":"312問由来","verify_url":""},{"id":"I03","category":"35条重要事項説明","point":"説明場所","question":"重要事項説明は宅建業者の事務所で行わなければならない。","answer":false,"explanation":"説明場所に法定の限定はありません。","memory":"35条＝場所の指定なし。","source":"収集No.133／令和2年10月 問41 肢4","priority":"B","origin":"312問由来","verify_url":""},{"id":"I04","category":"35条重要事項説明","point":"専任性","question":"重要事項説明は専任宅建士でなければ行えない。","answer":false,"explanation":"専任である必要はありません。","memory":"35条説明＝宅建士なら専任不要。","source":"収集No.202","priority":"A","origin":"312問由来","verify_url":""},{"id":"I05","category":"35条重要事項説明","point":"売買代金","question":"宅地の売買の媒介では、売買代金の額・支払時期・支払方法は35条の法定説明事項である。","answer":false,"explanation":"代金の額・支払時期・支払方法は37条書面の事項です。35条では代金等以外の金銭の額・目的などが問題になります。","memory":"代金そのもの＝35条ではなく37条。","source":"収集No.234／令和4年 問36 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"I06","category":"35条重要事項説明","point":"宅地の貸借と法令制限","question":"宅地の貸借の媒介では、建築基準法の道路斜線制限がある場合、その概要を説明する必要がある。","answer":true,"explanation":"宅地の貸借では法令上の制限が重要事項説明の対象になります。","memory":"宅地貸借＝法令制限を説明。","source":"収集No.223／平成27年 問31 肢ア","priority":"B","origin":"312問由来","verify_url":""},{"id":"I07","category":"35条重要事項説明","point":"建物貸借と建築制限","question":"建物の貸借の媒介では、準防火地域の建築物の構造制限について必ず説明しなければならない。","answer":false,"explanation":"建物貸借では、建築基準法上のこの種の制限は35条の法定説明事項ではありません。","memory":"建物貸借＝建築基準法制限は原則説明不要。","source":"収集No.244／平成27年 問31 肢ウ","priority":"B","origin":"312問由来","verify_url":""},{"id":"I08","category":"35条重要事項説明","point":"水害ハザードマップ","question":"建物の貸借でも、水害ハザードマップに物件位置が含まれるときは、その概ねの位置を示して説明する。","answer":true,"explanation":"洪水・雨水出水・高潮の水害ハザードマップに関する説明は取引類型を問わず重要です。","memory":"水害マップ＝売買でも貸借でも。","source":"収集No.171／令和6年 問37 肢ア","priority":"A","origin":"312問由来","verify_url":"https://www.mlit.go.jp/totikensangyo/const/sosei_const_fr3_000074.html"},{"id":"I09","category":"35条重要事項説明","point":"管理委託先","question":"建物の貸借で管理が管理会社に委託されている場合、区分所有建物でなくても管理会社の商号・所在地等を説明する。","answer":true,"explanation":"貸借では管理委託先の情報が重要事項になります。","memory":"貸借＋管理委託＝管理会社情報を説明。","source":"収集No.289／令和元年 問41 肢1","priority":"B","origin":"312問由来","verify_url":""},{"id":"I10","category":"35条重要事項説明","point":"住宅性能評価","question":"住宅性能評価を受けた新築住宅である旨は、建物の貸借でも35条説明が必要である。","answer":false,"explanation":"この事項は建物の売買・交換で問題となるもので、建物貸借では法定説明事項ではありません。","memory":"住宅性能評価＝貸借では不要。","source":"収集No.307／令和元年 問28 肢1","priority":"B","origin":"312問由来","verify_url":""},{"id":"C01","category":"37条書面","point":"交付時期","question":"37条書面は契約成立後、遅滞なく交付する。","answer":true,"explanation":"35条は契約前、37条は契約成立後です。","memory":"37条＝契約成立後。","source":"収集No.117ほか","priority":"A","origin":"312問由来","verify_url":""},{"id":"C02","category":"37条書面","point":"業者間取引","question":"売主・買主の双方が宅建業者である場合、37条書面の交付は不要である。","answer":false,"explanation":"業者間でも37条書面の交付義務は免除されません。","memory":"37条＝業者間でも必要。","source":"収集No.117／平成30年 問28 肢イ","priority":"A","origin":"312問由来","verify_url":""},{"id":"C03","category":"37条書面","point":"宅建士記名","question":"37条書面には宅建士の記名が必要だが、その宅建士が専任である必要はない。","answer":true,"explanation":"宅建士の記名は必要ですが専任性は不要です。","memory":"37条＝宅建士記名、専任不要。","source":"収集No.335","priority":"A","origin":"312問由来","verify_url":""},{"id":"C04","category":"37条書面","point":"代金等以外の金銭","question":"代金・借賃以外に授受する金銭の定めがあるときは、額・目的・授受時期を37条書面に記載する。","answer":true,"explanation":"代金等以外の金銭に関する定めは37条の重要記載事項です。","memory":"代金外金銭＝額・目的・時期。","source":"収集No.115／令和3年10月 問37 肢3","priority":"B","origin":"312問由来","verify_url":""},{"id":"C05","category":"37条書面","point":"不可抗力の負担","question":"天災その他不可抗力による損害の負担について定めがあるときは、貸借でも37条書面に記載する。","answer":true,"explanation":"取引類型を問わず、定めがあれば記載します。","memory":"不可抗力負担の定め＝37条。","source":"収集No.111／平成23年 問34 肢3","priority":"B","origin":"312問由来","verify_url":""},{"id":"C06","category":"37条書面","point":"解除に関する定め","question":"買換え特約やローン特約など契約解除に関する定めがあるときは、37条書面に記載する。","answer":true,"explanation":"解除に関する定めは37条書面の記載事項です。","memory":"解除特約＝37条。","source":"収集No.291／平成26年 問42 肢ウ","priority":"A","origin":"312問由来","verify_url":""},{"id":"C07","category":"37条書面","point":"契約不適合責任","question":"契約不適合責任に関する特約がある場合、相手方が宅建業者なら37条書面への記載を省略できる。","answer":false,"explanation":"業者間でも省略できません。","memory":"契約不適合特約＝業者間でも37条。","source":"収集No.194／平成25年 問36 肢4","priority":"A","origin":"312問由来","verify_url":""},{"id":"C08","category":"37条書面","point":"責任履行措置","question":"契約不適合責任の履行について保証保険などの措置の定めがあるときは、その内容を37条書面に記載する。","answer":true,"explanation":"責任履行措置の定めがある場合は37条記載事項です。","memory":"保証保険等の定め＝37条。","source":"収集No.209／平成26年 問40 肢ア","priority":"B","origin":"312問由来","verify_url":""},{"id":"C09","category":"37条書面","point":"手付金保全","question":"手付金等の保全措置の概要は、37条書面の必須記載事項である。","answer":false,"explanation":"手付金等の保全措置の概要は35条で説明する事項であり、37条の必須記載事項ではありません。","memory":"手付金保全＝35条、37条ではない。","source":"収集No.137／平成24年 問31 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"C10","category":"37条書面","point":"代金の支払条件","question":"売買代金の額・支払時期・支払方法は37条書面の記載事項である。","answer":true,"explanation":"代金の支払条件は契約内容として37条で明確にします。","memory":"代金額・時期・方法＝37条。","source":"収集No.234","priority":"A","origin":"312問由来","verify_url":""},{"id":"A01","category":"業務規制・広告","point":"広告開始時期","question":"建築確認が必要な未完成建物について、建築確認申請中である旨を表示すれば確認前でも販売広告をできる。","answer":false,"explanation":"必要な建築確認等の処分を受ける前は広告できません。","memory":"許可・確認前広告＝NG。","source":"収集No.206／平成27年 問37 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"A02","category":"業務規制・広告","point":"無免許広告","question":"宅建業免許を申請中の者は、契約を免許取得後に行う予定なら宅地売買の広告をしてもよい。","answer":false,"explanation":"無免許営業を目的とする広告自体が禁止されます。","memory":"免許前は広告もNG。","source":"収集No.155／平成26年 問27 肢4","priority":"A","origin":"312問由来","verify_url":""},{"id":"A03","category":"業務規制・広告","point":"業務停止中の広告","question":"業務全部停止期間中でも、契約締結を停止期間後にするなら広告はできる。","answer":false,"explanation":"広告も宅建業務の一部なので、業務停止期間中はできません。","memory":"業務停止＝広告も停止。","source":"収集No.193／平成28年 問32 肢4","priority":"A","origin":"312問由来","verify_url":""},{"id":"A04","category":"業務規制・広告","point":"誇大広告","question":"著しく事実に相違する広告は、問い合わせや契約が一件もなくても宅建業法違反となり得る。","answer":true,"explanation":"誇大広告は広告をした時点で違反となり、監督処分・罰則の対象になり得ます。","memory":"誇大広告＝成約ゼロでも違反。","source":"収集No.308／平成26年 問30 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"A05","category":"業務規制・広告","point":"取引態様","question":"広告では『売主・貸主・代理・媒介（仲介）』など取引態様を明示する。","answer":true,"explanation":"取引態様の明示は基本規制です。","memory":"広告＝取引態様を明示。","source":"収集No.119／令和2年12月 問47 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"A06","category":"業務規制・広告","point":"徒歩分数","question":"道路距離80mを1分として計算し15分50秒となる場合、徒歩15分と表示できる。","answer":false,"explanation":"1分未満の端数は切り上げるため16分表示です。","memory":"徒歩分数＝端数切上げ。","source":"収集No.122／令和7年 問47 肢4","priority":"B","origin":"312問由来","verify_url":""},{"id":"A07","category":"業務規制・広告","point":"管理費表示","question":"住戸ごとに管理費が異なり全戸分を表示しにくい場合、最高額だけを表示すればよい。","answer":false,"explanation":"全てを示すのが困難な場合は最低額と最高額を表示します。","memory":"管理費省略表示＝最低＋最高。","source":"収集No.140／令和4年 問47 肢3","priority":"B","origin":"312問由来","verify_url":""},{"id":"A08","category":"業務規制・広告","point":"リフォーム表示","question":"中古住宅を『改装済み』と広告するなら、改装の内容と時期を明示する。","answer":true,"explanation":"改装済みである旨を表示する場合には、その内容と時期を明示します。","memory":"改装済み表示＝内容＋時期。","source":"収集No.251／平成24年 問47 肢2","priority":"B","origin":"312問由来","verify_url":""},{"id":"A09","category":"業務規制・広告","point":"迷惑勧誘","question":"相手方から午後3時の訪問は迷惑だと事前に告げられていても、深夜でなければ午後3時に訪問勧誘してよい。","answer":false,"explanation":"相手方が迷惑を覚える時間だと分かっているのに勧誘する行為は禁止されます。","memory":"相手が迷惑と言った時間＝訪問NG。","source":"収集No.331／平成24年 問41 肢エ","priority":"A","origin":"312問由来","verify_url":""},{"id":"A10","category":"業務規制・広告","point":"値引き勧誘","question":"売買代金を値引きして契約締結を誘引すること自体は、直ちに宅建業法違反となるわけではない。","answer":true,"explanation":"値引きによる誘引自体は禁止行為ではありません。手付貸与や威迫などとは区別します。","memory":"値引き＝それ自体は違反でない。","source":"収集No.314／平成24年 問41 肢ウ","priority":"B","origin":"312問由来","verify_url":""},{"id":"R01","category":"8種制限","point":"適用範囲","question":"自ら売主となる場合の8種制限は、売主が宅建業者で買主が宅建業者ではない場合に適用される。","answer":true,"explanation":"非業者買主を保護するための規制です。業者間取引には原則適用されません。","memory":"8種制限＝業者売主×非業者買主。","source":"収集問題群・8種制限","priority":"A","origin":"312問由来","verify_url":""},{"id":"R02","category":"8種制限","point":"クーリングオフの場所","question":"買主が宅建業者の事務所で買受けの申込みをした場合、その後レストランで契約しても原則クーリング・オフできない。","answer":true,"explanation":"クーリング・オフできるかは原則として申込み場所で判断します。","memory":"申込みが事務所＝クーリングオフ不可。","source":"収集No.163／平成24年 問37 肢4","priority":"A","origin":"312問由来","verify_url":""},{"id":"R03","category":"8種制限","point":"クーリングオフ期間","question":"クーリング・オフは、所定の告知を受けた日から8日を経過するまでは行うことができる。","answer":true,"explanation":"8日間が基本です。","memory":"クーリングオフ＝8日。","source":"宅建業法37条の2","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/content/001881261.pdf"},{"id":"R04","category":"8種制限","point":"クーリングオフ後の返金","question":"クーリング・オフで解除されたとき、宅建業者は受領済みの手付金その他の金銭を速やかに返還する。","answer":true,"explanation":"解除後は速やかな返還義務があります。","memory":"クーリングオフ＝受領金は速やかに返す。","source":"収集No.313／令和4年 問38 肢4","priority":"B","origin":"312問由来","verify_url":""},{"id":"R05","category":"8種制限","point":"手付の性質","question":"宅建業者が自ら売主となり非業者買主から受ける手付は、原則として解約手付として扱われる。","answer":true,"explanation":"名目にかかわらず解約手付としての効力が問題になります。","memory":"業者売主の手付＝解約手付。","source":"収集No.226／令和元年 問37 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"R06","category":"8種制限","point":"手付解除","question":"買主が履行に着手する前なら、業者売主は正当な理由がなくても手付の倍額を現実に提供して解除できる。","answer":true,"explanation":"相手方が履行に着手する前であれば、倍返しによる手付解除ができます。","memory":"売主の手付解除＝倍返し・正当理由不要。","source":"収集No.226","priority":"A","origin":"312問由来","verify_url":""},{"id":"R07","category":"8種制限","point":"手付額上限","question":"業者売主が非業者買主から受ける手付額は、代金の20％を超えることができない。","answer":true,"explanation":"手付額の上限は20％です。","memory":"手付＝20％以下。","source":"宅建業法39条","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/totikensangyo/const/content/001881261.pdf"},{"id":"R08","category":"8種制限","point":"完成物件の保全","question":"完成物件では、手付金等が代金の10％以下かつ1,000万円以下なら、原則として保全措置なしで受領できる。","answer":true,"explanation":"完成物件は『10％以下かつ1,000万円以下』が保全措置不要の基準です。","memory":"完成＝10％以下＆1000万円以下。","source":"収集No.154／平成23年 問37 肢2","priority":"A","origin":"312問由来","verify_url":""},{"id":"R09","category":"8種制限","point":"未完成物件の保全","question":"未完成物件では、手付金等が代金の5％以下かつ1,000万円以下なら、原則として保全措置なしで受領できる。","answer":true,"explanation":"未完成物件は5％基準です。","memory":"未完成＝5％以下＆1000万円以下。","source":"収集No.229／平成27年 問36 肢ウ","priority":"A","origin":"312問由来","verify_url":""},{"id":"R10","category":"8種制限","point":"契約不適合特約","question":"業者売主は、契約不適合責任について民法より買主に不利な特約を自由に定めることができる。","answer":false,"explanation":"原則として民法より買主に不利な特約は無効です。引渡しから2年以上の通知期間を定める特約などには例外があります。","memory":"業者売主の契約不適合＝買主不利特約は原則無効。","source":"収集No.275・295","priority":"A","origin":"312問由来","verify_url":""},{"id":"F01","category":"報酬","point":"売買媒介の速算式","question":"売買代金が400万円を超える通常の媒介では、税抜代金×3％＋6万円を基礎に消費税を加える速算式を使える。","answer":true,"explanation":"400万円超の売買媒介で用いる基本速算式です。","memory":"400万円超＝3％＋6万円＋税。","source":"国交省報酬制度","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/content/001750045.pdf"},{"id":"F02","category":"報酬","point":"代理報酬","question":"売買・交換の代理で依頼者一方から受ける報酬上限は、通常の媒介報酬上限の2倍までである。","answer":true,"explanation":"代理は媒介の2倍を上限とするのが基本です。","memory":"代理＝媒介上限の2倍。","source":"国交省報酬制度","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/const/content/001750045.pdf"},{"id":"F03","category":"報酬","point":"賃貸媒介の合計上限","question":"通常の賃貸借媒介では、貸主・借主双方から受ける報酬合計は原則として借賃1か月分の1.1倍以内である。","answer":true,"explanation":"消費税込みで1.1か月分が基本上限です。","memory":"賃貸媒介合計＝1.1か月。","source":"国交省報酬告示","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/notice/noticedata/sgml/1970/26197000/26197000.html"},{"id":"F04","category":"報酬","point":"居住用賃貸","question":"居住用建物の媒介で、依頼時に特段の承諾がない場合、一方の依頼者から受けられる報酬は原則借賃0.55か月分以内である。","answer":true,"explanation":"居住用建物は一方0.55か月分が原則です。承諾がある場合の例外に注意します。","memory":"居住用＝一方0.55か月原則。","source":"収集No.28／令和6年 問28 肢ア","priority":"A","origin":"312問由来","verify_url":""},{"id":"F05","category":"報酬","point":"免税事業者","question":"消費税免税事業者の報酬上限計算では、一定の場合に税抜報酬額の1.04倍相当まで受領できる。","answer":true,"explanation":"免税事業者は仕入れに係る消費税等相当額として0.04倍を限度に加算できる運用です。","memory":"免税業者＝原則1.04倍。","source":"収集No.28","priority":"B","origin":"312問由来","verify_url":"https://www.mlit.go.jp/totikensangyo/const/content/001753240.pdf"},{"id":"F06","category":"報酬","point":"低廉な空家等","question":"価格800万円以下の低廉な空家等の売買媒介では、一定要件のもと依頼者一方から税込33万円まで受けられる特例がある。","answer":true,"explanation":"2024年7月以降の特例です。使用状態は問いません。","memory":"800万円以下＝税込33万円特例。","source":"収集No.266／現行告示","priority":"A","origin":"312問由来","verify_url":"https://www.mlit.go.jp/totikensangyo/const/1_6_bf_000013.html"},{"id":"F07","category":"報酬","point":"長期の空家等","question":"長期の空家等の貸借媒介では、一定要件のもと貸主である依頼者から借賃1か月分の2.2倍まで受けられる特例がある。","answer":true,"explanation":"2024年7月以降の特例です。双方から受ける合計額も2.2か月分以内です。","memory":"長期空家等＝貸主から最大2.2か月。","source":"国交省報酬改正","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/policy/shingikai/content/001965126.pdf"},{"id":"F08","category":"報酬","point":"特別費用","question":"依頼者の特別の依頼による遠隔地の現地調査費用で、事前に費用負担の承諾を得ていれば、報酬とは別に実費を受領できることがある。","answer":true,"explanation":"通常の媒介業務に含まれない特別の依頼・費用で、事前承諾がある場合に別途受領できます。","memory":"特別依頼＋事前承諾＝実費別途可。","source":"収集No.175／平成25年 問37 肢ウ","priority":"B","origin":"312問由来","verify_url":""},{"id":"F09","category":"報酬","point":"差額報酬","question":"売主が手取り額を決め、実際の売却額との差額を宅建業者が受け取る契約なら、報酬上限規制は適用されない。","answer":false,"explanation":"その差額も実質的に報酬として扱われ、法定上限の範囲内でなければなりません。","memory":"手取り方式でも報酬上限あり。","source":"収集No.325／平成28年 問33 肢ア","priority":"B","origin":"312問由来","verify_url":""},{"id":"F10","category":"報酬","point":"案内所の報酬額掲示","question":"契約締結を行う分譲案内所にも、国土交通大臣が定める報酬額を掲示しなければならない。","answer":false,"explanation":"報酬額の掲示義務があるのは事務所です。案内所では標識等の別規制が問題になります。","memory":"報酬額掲示＝事務所だけ。","source":"収集No.272／令和3年10月 問29 肢3","priority":"B","origin":"312問由来","verify_url":""},{"id":"S01","category":"監督・瑕疵","point":"不正免許","question":"不正の手段で宅建業免許を受けた場合、免許権者は免許を取り消さなければならない。","answer":true,"explanation":"任意ではなく必要的取消しとなる典型です。","memory":"不正免許＝必ず取消し。","source":"収集No.123／令和3年12月 問28 肢ア","priority":"A","origin":"312問由来","verify_url":""},{"id":"S02","category":"監督・瑕疵","point":"指示違反と業務停止","question":"指示処分に従わない宅建業者には業務停止を命じることができ、業務停止処分に違反した場合は免許取消しの対象となる。","answer":true,"explanation":"監督処分の流れとして重要です。","memory":"指示違反→停止、停止違反→取消し。","source":"収集No.318／令和6年 問31 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"S03","category":"監督・瑕疵","point":"所在地知事の権限","question":"甲県知事免許の宅建業者が乙県内で法違反をした場合、乙県知事がその乙県内の業務について業務停止処分をすることがある。","answer":true,"explanation":"業務地の都道府県知事にも一定の監督権限があります。","memory":"免許権者以外の業務地知事も停止可。","source":"収集No.324／平成26年 問44 肢ア","priority":"B","origin":"312問由来","verify_url":""},{"id":"S04","category":"監督・瑕疵","point":"聴聞","question":"宅建業者への指示処分・業務停止処分などでは、法定の聴聞手続が問題となる。","answer":true,"explanation":"監督処分では聴聞が重要な手続です。","memory":"監督処分＝聴聞。","source":"収集No.332・126","priority":"B","origin":"312問由来","verify_url":""},{"id":"S05","category":"監督・瑕疵","point":"新築住宅の資力確保","question":"宅建業者が自ら売主として新築住宅を非業者買主に引き渡す場合、原則として供託又は保険による資力確保措置が必要である。","answer":true,"explanation":"住宅瑕疵担保履行法の基本です。","memory":"新築住宅・業者売主＝供託か保険。","source":"国交省住宅瑕疵担保履行法","priority":"A","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/jutakukentiku/jutaku-kentiku.files/kashitanpocorner/jigyousya/obligation.html"},{"id":"S06","category":"監督・瑕疵","point":"媒介業者の義務","question":"新築住宅の売買を媒介しただけの宅建業者にも、住宅瑕疵担保保証金の供託又は保険加入義務がある。","answer":false,"explanation":"資力確保義務は自ら売主として新築住宅を販売する宅建業者に課されます。媒介しただけの業者には課されません。","memory":"瑕疵担保履行法＝媒介だけなら資力確保義務なし。","source":"収集No.262／令和元年 問45 肢1","priority":"A","origin":"312問由来","verify_url":""},{"id":"S07","category":"監督・瑕疵","point":"業者間新築住宅","question":"新築住宅の買主が宅建業者である場合でも、売主宅建業者には住宅瑕疵担保履行法上の資力確保義務がある。","answer":false,"explanation":"同法では買主宅建業者は保護対象から除外されます。","memory":"新築でも業者間＝資力確保義務なし。","source":"収集No.60／令和2年10月 問45 肢4","priority":"B","origin":"312問由来","verify_url":""},{"id":"S08","category":"監督・瑕疵","point":"基準日と届出","question":"住宅瑕疵担保履行法の基準日は毎年3月31日で、資力確保措置の状況は基準日から3週間以内に届け出る。","answer":true,"explanation":"現在は年1回、3月31日基準です。","memory":"瑕疵担保＝3/31・3週間以内。","source":"収集No.167／現行国交省","priority":"A","origin":"312問由来","verify_url":"https://www.mlit.go.jp/jutakukentiku/jutaku-kentiku.files/kashitanpocorner/jigyousya/obligation.html"},{"id":"S09","category":"監督・瑕疵","point":"未届出等の契約制限","question":"必要な資力確保措置や届出をしない場合、基準日の翌日から50日を経過した日以後、新たな新築住宅の売買契約が制限される。","answer":true,"explanation":"未措置・未届出のまま一定期間経過後は新規契約が禁止されます。","memory":"未措置・未届出＝50日後から新規契約NG。","source":"国交省住宅瑕疵担保履行法","priority":"B","origin":"現行法補強","verify_url":"https://www.mlit.go.jp/jutakukentiku/jutaku-kentiku.files/kashitanpocorner/jigyousya/"},{"id":"S10","category":"監督・瑕疵","point":"供託超過額の取戻し","question":"住宅販売瑕疵担保保証金が法定基準額を超過しても、免許行政庁の承認なしに超過額を自由に取り戻すことはできない。","answer":true,"explanation":"超過額の取戻しには承認等の手続が必要です。","memory":"瑕疵担保供託の取戻し＝承認が必要。","source":"収集No.146／令和4年 問45 肢4","priority":"B","origin":"312問由来","verify_url":""}], KEY="takken_business_short100_v1";
const CATS=["基本・免許", "宅建士・事務所", "営業保証金・保証協会", "媒介契約", "35条重要事項説明", "37条書面", "業務規制・広告", "8種制限", "報酬", "監督・瑕疵"];
let st={queue:[],idx:0,c:0,w:0,active:false,answered:false,wrong:{},mode:""};
const $=x=>document.getElementById(x);
function save(){localStorage.setItem(KEY,JSON.stringify(st))}function load(){try{let x=localStorage.getItem(KEY);if(x)st=JSON.parse(x)}catch(e){}}
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function makeQueue(arr){let ids=arr.map(x=>x.id);if($("order").value==="random")ids=sh(ids);return ids}
function startMode(mode){let arr=mode==="A"?Q.filter(x=>x.priority==="A"):Q;startArray(arr,mode)}
function startCat(c){startArray(Q.filter(x=>x.category===c),c)}
function startWrongAll(){let arr=Q.filter(x=>st.wrong[x.id]);if(!arr.length){alert("誤答履歴はありません。");return}startArray(arr,"誤答")}
function startArray(arr,mode){st.queue=makeQueue(arr);st.idx=0;st.c=0;st.w=0;st.active=true;st.answered=false;st.mode=mode;save();$("home").classList.add("hidden");$("done").classList.add("hidden");$("quiz").classList.remove("hidden");$("dock").classList.remove("hidden");render()}
function current(){return Q.find(x=>x.id===st.queue[st.idx])}
function render(){let q=current();if(!q){finish();return}st.answered=false;$("qid").textContent=q.id;$("priority").textContent="優先 "+q.priority;$("priority").className="pill "+(q.priority==="A"?"A":"");$("cat").textContent=q.category;$("point").textContent=q.point;$("remaining").textContent=st.queue.length-st.idx;$("correct").textContent=st.c;$("wrong").textContent=st.w;$("question").textContent=q.question;$("bar").style.width=(st.idx/st.queue.length*100)+"%";$("result").className="result";$("actions").className="actions";$("dock").classList.remove("hidden");save();window.scrollTo({top:0,behavior:"smooth"})}
function answer(a){if(st.answered)return;st.answered=true;let q=current(),ok=a===q.answer;if(ok)st.c++;else{st.w++;st.wrong[q.id]=true}$("result").className="result "+(ok?"ok":"ng");$("rt").textContent=ok?"正解":"不正解";$("ca").textContent=q.answer?"○":"×";$("ex").innerHTML="<br><b>解説：</b>"+q.explanation;$("mem").textContent="試験で覚える一言： "+q.memory;$("src").textContent="根拠： "+q.source+(q.origin==="現行法補強"?"（現行法補強）":"");$("actions").className="actions show";$("dock").classList.add("hidden");save();$("result").scrollIntoView({behavior:"smooth",block:"center"})}
function next(){st.idx++;if(st.idx>=st.queue.length)finish();else render()}
function finish(){st.active=false;save();$("quiz").classList.add("hidden");$("dock").classList.add("hidden");$("done").classList.remove("hidden");$("doneText").textContent=`${st.mode}：正解 ${st.c}、不正解 ${st.w}。間違えた問題は誤答履歴に保存しました。`;}
function backHome(){$("quiz").classList.add("hidden");$("done").classList.add("hidden");$("dock").classList.add("hidden");$("home").classList.remove("hidden")}
function resetAll(){if(confirm("誤答履歴と進捗を削除しますか？")){localStorage.removeItem(KEY);location.reload()}}
function renderGrid(){$("grid").innerHTML=CATS.map(c=>`<button class="topic" onclick="startCat('${c}')">${c}<small>10問</small></button>`).join("")}
load();renderGrid();
</script></body></html>
